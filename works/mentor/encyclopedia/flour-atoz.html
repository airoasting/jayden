<!doctype html>
<html lang="ko">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밀가루 A to Z 백과사전</title>
<meta name="description" content="초등학생을 위한 밀가루 백과사전. A부터 Z까지 밀가루에 얽힌 낱말을 재미있게 배워요.">
<style>
:root{
  --scale:1;
  --bg:#F3EADB;
  --surface:#F3EADB;
  --sd:#d5c4a6;          /* soft shadow dark */
  --sl:#ffffff;          /* soft shadow light */
  --ink:#4a3725;
  --ink-soft:#7a6248;
  --accent:#d9822b;
  --accent-ink:#ffffff;
  --line:rgba(122,98,72,.18);
  --focus:#e0782a;
  --overlay:rgba(60,42,22,.45);
  --clay-ink:#3b2a1a;
  --clay-hi:rgba(255,255,255,.6);
  --clay-lo:rgba(90,60,30,.18);
  --clay-drop:rgba(120,90,50,.28);
  --c-kind:#F6C76E; --c-ing:#A6D8AE; --c-proc:#94C9EC; --c-food:#F6A98F; --c-sci:#C7ADEB; --c-hist:#F3AECB; --c-etc:#E6D3B3;
  --r-sm:18px; --r-md:24px; --r-lg:28px;
  --raised:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);
  --raised-sm:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);
  --pressed:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl);
  --clay:inset -3px -5px 8px var(--clay-lo),inset 3px 4px 7px var(--clay-hi),5px 7px 14px var(--clay-drop);
  --clay-pressed:inset 3px 4px 8px var(--clay-lo),inset -2px -3px 6px var(--clay-hi);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a231c; --surface:#2a231c; --sd:#1a150f; --sl:#3a3026;
    --ink:#f3e6d1; --ink-soft:#c9b394; --accent:#f0a24a; --accent-ink:#2a1b0c;
    --line:rgba(243,230,209,.14); --focus:#f6b562; --overlay:rgba(0,0,0,.6);
    --clay-hi:rgba(255,255,255,.35); --clay-lo:rgba(0,0,0,.25); --clay-drop:rgba(0,0,0,.45);
    --c-kind:#e3b55e; --c-ing:#8fc39a; --c-proc:#82b6d8; --c-food:#e5937a; --c-sci:#b39ad8; --c-hist:#de99b7; --c-etc:#cdb995;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a231c; --surface:#2a231c; --sd:#1a150f; --sl:#3a3026;
  --ink:#f3e6d1; --ink-soft:#c9b394; --accent:#f0a24a; --accent-ink:#2a1b0c;
  --line:rgba(243,230,209,.14); --focus:#f6b562; --overlay:rgba(0,0,0,.6);
  --clay-hi:rgba(255,255,255,.35); --clay-lo:rgba(0,0,0,.25); --clay-drop:rgba(0,0,0,.45);
  --c-kind:#e3b55e; --c-ing:#8fc39a; --c-proc:#82b6d8; --c-food:#e5937a; --c-sci:#b39ad8; --c-hist:#de99b7; --c-etc:#cdb995;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(100% * var(--scale));scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:1.125rem;line-height:1.8;overflow-x:clip;
  word-break:keep-all;overflow-wrap:break-word;
}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ---------- neumorphic primitives ---------- */
.raised{background:var(--surface);box-shadow:var(--raised);border-radius:var(--r-md)}
.nbtn{
  min-height:48px;min-width:48px;padding:.4rem 1rem;border-radius:var(--r-sm);
  background:var(--surface);box-shadow:var(--raised-sm);
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:"Jua",sans-serif;font-size:1rem;line-height:1.2;
  transition:box-shadow .18s ease,transform .18s ease;
}
.nbtn:hover{transform:translateY(-1px)}
.nbtn:active,.nbtn[aria-pressed="true"]{box-shadow:var(--pressed);transform:none}
.nbtn[disabled],.nbtn[aria-disabled="true"]{opacity:.4;cursor:not-allowed;transform:none}

.chip{
  --c:var(--c-etc);
  display:inline-flex;align-items:center;gap:.3rem;
  background:var(--c);color:var(--clay-ink);
  border-radius:999px;padding:.15rem .8rem;font-family:"Jua",sans-serif;font-size:.9rem;line-height:1.6;
  box-shadow:var(--clay);white-space:nowrap;
}
.cat-kind{--c:var(--c-kind)}.cat-ing{--c:var(--c-ing)}.cat-proc{--c:var(--c-proc)}
.cat-food{--c:var(--c-food)}.cat-sci{--c:var(--c-sci)}.cat-hist{--c:var(--c-hist)}.cat-etc{--c:var(--c-etc)}

/* ---------- header ---------- */
.site-head{padding:24px 0 8px}
.head-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{
  flex:none;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:2.1rem;
  background:var(--c-kind);box-shadow:var(--clay);
}
.brand h1{font-size:clamp(1.6rem,5vw,2.4rem)}
.brand h1 .az{color:var(--accent)}
.intro{margin:.15rem 0 0;color:var(--ink-soft);font-size:1rem;line-height:1.6}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .nbtn{padding:.4rem .8rem}

/* ---------- hero video ---------- */
.hero{padding:16px 0 8px}
.video-frame{padding:14px;border-radius:var(--r-lg);background:var(--c-kind);box-shadow:var(--clay)}
#video{position:relative;width:100%;border-radius:20px}
#video:has(.video-ph){aspect-ratio:16/9;overflow:hidden;background:var(--surface);box-shadow:var(--pressed)}
#video > iframe,#video > video,#video > canvas{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.video-ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--ink-soft)}
.video-ph .big{font-size:3.4rem;line-height:1}
.video-ph p{margin:.4rem 0 0;font-family:"Jua",sans-serif;font-size:1.1rem}

/* ---------- sticky A-Z ---------- */
.azbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.azbar .wrap{position:relative}
.az-scroll{
  display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;
  padding:8px 6px 10px;scrollbar-width:thin;
}
.az-btn{
  flex:none;width:48px;height:48px;border-radius:50%;scroll-snap-align:center;
  background:var(--surface);box-shadow:var(--raised-sm);
  font-family:"Jua",sans-serif;font-size:1.25rem;line-height:1;
  transition:box-shadow .18s,background .18s,color .18s,transform .18s;
}
.az-btn:hover{transform:translateY(-2px)}
.az-btn.active{background:var(--accent);color:var(--accent-ink);box-shadow:var(--clay)}
.az-btn[aria-disabled="true"]{opacity:.35;cursor:default;transform:none}

/* ---------- controls ---------- */
.controls{padding:20px 0 4px;display:grid;gap:16px}
.search{
  display:flex;align-items:center;gap:10px;padding:0 16px;min-height:58px;border-radius:999px;
  background:var(--surface);box-shadow:var(--pressed);
}
.search span{font-size:1.3rem}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:1.05rem;padding:12px 0}
.search input::placeholder{color:var(--ink-soft);opacity:.85}
.search:focus-within{outline:3px solid var(--focus);outline-offset:3px}
.clear-q{width:44px;height:44px;border-radius:50%;font-size:1.1rem}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.fchip{
  --c:var(--surface);
  min-height:48px;padding:.3rem 1rem;border-radius:999px;
  background:var(--surface);box-shadow:var(--raised-sm);
  font-family:"Jua",sans-serif;font-size:1rem;display:inline-flex;align-items:center;gap:.4rem;
  transition:box-shadow .18s,background .18s,transform .18s;
}
.fchip .n{font-size:.8rem;min-width:1.8em;padding:0 .4em;border-radius:999px;background:var(--line);text-align:center;line-height:1.6}
.fchip[aria-pressed="true"]{background:var(--c);color:var(--clay-ink);box-shadow:var(--clay-pressed)}
.fchip[aria-pressed="true"].all{--c:var(--accent);color:var(--accent-ink)}
.fchip:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.status{color:var(--ink-soft);font-size:.95rem;margin:0}

/* ---------- quiz ---------- */
.quiz{margin:20px 0 4px;padding:22px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--raised)}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.quiz h2{font-size:1.45rem;display:flex;align-items:center;gap:.5rem}
.quiz-q{margin:14px 0;padding:16px 18px;border-radius:var(--r-sm);box-shadow:var(--pressed);max-width:36em}
.quiz-q .lead{display:block;font-family:"Jua",sans-serif;color:var(--ink-soft);font-size:.95rem}
.quiz-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.qbtn{
  min-height:56px;padding:.5rem 1rem;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--raised-sm);
  font-family:"Jua",sans-serif;font-size:1.1rem;line-height:1.3;text-align:center;
  transition:box-shadow .18s,background .18s,transform .18s;
}
.qbtn:hover:not(:disabled){transform:translateY(-2px)}
.qbtn:disabled{cursor:default}
.qbtn.right{background:var(--c-ing);color:var(--clay-ink);box-shadow:var(--clay)}
.qbtn.wrong{background:var(--c-food);color:var(--clay-ink);box-shadow:var(--clay-pressed)}
.quiz-fb{min-height:1.8em;margin:12px 0 0;font-family:"Jua",sans-serif;font-size:1.15rem}
.linkish{text-decoration:underline;text-underline-offset:3px;font-family:"Jua",sans-serif;min-height:48px;padding:0 .3rem;color:var(--accent)}

/* ---------- grid / cards ---------- */
.grid{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.card{position:relative;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--raised);scroll-margin-top:110px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px)}
.card:has(.card-open:active){box-shadow:var(--pressed);transform:none}
.card-open{display:block;width:100%;height:100%;text-align:left;padding:20px 20px 18px;border-radius:var(--r-lg)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-right:52px}
.badge{
  flex:none;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;
  font-family:"Jua",sans-serif;font-size:2rem;line-height:1;
  background:var(--c);color:var(--clay-ink);box-shadow:var(--clay);
}
.card-emoji{font-size:2.3rem;line-height:1}
.card-word{display:block;font-family:"Jua",sans-serif;font-size:1.35rem;line-height:1.3}
.card-ko{display:block;color:var(--ink-soft);font-size:1rem;line-height:1.5}
.card-sum{display:block;margin:10px 0 14px;font-size:1rem;line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fav{
  position:absolute;top:14px;right:14px;z-index:2;width:48px;height:48px;border-radius:50%;
  background:var(--surface);box-shadow:var(--raised-sm);font-size:1.35rem;line-height:1;
  filter:grayscale(1);opacity:.7;transition:box-shadow .18s,filter .18s,opacity .18s,transform .18s;
}
.fav[aria-pressed="true"]{filter:none;opacity:1;box-shadow:var(--pressed)}
.fav:active{transform:scale(.92)}
.empty{text-align:center;padding:44px 16px;margin-top:20px;border-radius:var(--r-lg);box-shadow:var(--pressed)}
.empty .big{font-size:3rem;line-height:1}
.empty h2{font-size:1.5rem;margin:.6rem 0 .2rem}
.empty p{margin:0 0 1rem;color:var(--ink-soft)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg{position:absolute;inset:0;background:var(--overlay);animation:fade .2s ease}
.sheet{
  position:relative;width:100%;max-width:760px;max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 50px rgba(0,0,0,.3),var(--raised);
  padding:20px 22px 24px;animation:pop .22s ease;
}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sheet-bar .left,.sheet-bar .right{display:flex;gap:10px;flex-wrap:wrap}
.d-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.d-emoji{flex:none;width:112px;height:112px;border-radius:32px;display:grid;place-items:center;font-size:4rem;line-height:1;background:var(--surface);box-shadow:var(--pressed)}
.d-titles{min-width:0;flex:1}
.d-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.d-line .badge{width:52px;height:52px;font-size:1.8rem}
.d-word{font-size:clamp(1.7rem,6vw,2.3rem)}
.d-ko{margin:.2rem 0 .5rem;color:var(--ink-soft);font-size:1.15rem;font-family:"Jua",sans-serif}
.d-sum{font-size:1.15rem;margin:0 0 1rem;max-width:36em;font-weight:700}
.d-body p{margin:0 0 1.1em;max-width:36em}
.callout{margin:18px 0;padding:16px 18px;border-radius:var(--r-md);background:var(--c);color:var(--clay-ink);box-shadow:var(--clay);max-width:38em}
.callout h3{font-size:1.2rem;margin-bottom:.3rem}
.callout p{margin:0}
.call-fun{--c:var(--c-kind)}
.call-try{--c:var(--c-ing)}
.related{margin:22px 0 8px}
.related h3{font-size:1.15rem;margin-bottom:.6rem}
.rel-list{display:flex;flex-wrap:wrap;gap:10px}
.rel-btn{border-radius:999px;padding:.3rem 1rem .3rem .4rem}
.rel-btn .b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--clay-ink);box-shadow:var(--clay);font-size:1.1rem}
.d-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.d-nav .nbtn{flex:1;max-width:48%}
.d-nav .nbtn span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin:12px 0 0;text-align:center;color:var(--ink-soft);font-size:.85rem}
@media (max-width:640px){
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:94dvh;padding:16px 16px 22px}
  .d-emoji{width:88px;height:88px;font-size:3.2rem;border-radius:26px}
  .hint{display:none}
}
body.lock{overflow:hidden}

/* ---------- back to top & footer ---------- */
.totop{
  position:fixed;right:16px;bottom:16px;z-index:40;width:60px;height:60px;border-radius:22px;
  background:var(--accent);color:var(--accent-ink);box-shadow:var(--clay);font-family:"Jua",sans-serif;font-size:.85rem;line-height:1.1;
  display:grid;place-items:center;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s;
}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop .arr{font-size:1.4rem;display:block}
.site-foot{margin:48px 0 0;padding:28px 0 96px;color:var(--ink-soft);font-size:.95rem;border-top:1px solid var(--line);text-align:center}
.site-foot p{margin:.2rem auto;max-width:36em}

@media (max-width:420px){
  .tools .nbtn .lbl{display:none}
  .brand-mark{width:54px;height:54px;font-size:1.8rem;border-radius:18px}
  .quiz{padding:18px 16px}
}
.d-facts,.d-words,.d-more{margin:22px 0;padding:18px 20px;border-radius:var(--r-md);background:var(--md-surface-c,var(--surface));box-shadow:var(--raised-sm)}
.d-facts h3,.d-words h3,.d-more h3{margin:0 0 10px;font-size:1.2rem}
.d-facts dl,.d-words dl{margin:0;display:grid;gap:8px}
.d-facts dl>div{display:grid;grid-template-columns:minmax(5.5em,32%) 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.d-facts dl>div:last-child{border-bottom:0}
.d-facts dt,.d-words dt{font-weight:700;color:var(--accent)}
.d-facts dd,.d-words dd{margin:0}
.d-words dl>div{padding:6px 0}
.d-more details{padding:10px 14px;margin:8px 0;border-radius:var(--r-sm);background:var(--md-surface-low,var(--bg))}
.d-more summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
.d-more details p{margin:8px 0 0}
@media (max-width:480px){.d-facts dl>div{grid-template-columns:1fr;gap:2px}}
</style>

    --md-secondary-container:#5A4330; --md-tertiary-container:#404B25; --md-tertiary:#C0CC9A;
    --md-surface:#19120C; --md-surface-low:#221A14; --md-surface-c:#261E18; --md-surface-high:#312822;
    --md-on-surface:#F0DFD3; --md-on-surface-var:#D7C3B5; --md-outline:#52443A;
    --c-kind:#6A3B00; --c-ing:#404B25; --c-proc:#1F4A6E; --c-food:#73332A; --c-sci:#4B3C73; --c-hist:#6B2D4A; --c-etc:#4A3A2C;
    --clay-ink:#FFEDE0; --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --md-primary:#FFB870; --md-on-primary:#4A2800;

  /* ---------------- 도우미 ---------------- */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function entryLink(letter, label) {
    return '<a class="fg-link" href="#entry-' + letter + '" data-fg-letter="' + letter + '">자세히: ' +
      letter + (label ? ' ' + esc(label) : '') + ' →</a>';
  }

  function injectStyle() {
    if (document.getElementById('fg-style')) return;
    var st = document.createElement('style');
    st.id = 'fg-style';
    st.textContent = CSS;
    document.head.appendChild(st);
    var hasJua = Array.prototype.some.call(document.querySelectorAll('link[href]'), function (l) {
      return /Jua/.test(l.getAttribute('href'));
    });
    if (!hasJua) {
      var lk = document.createElement('link');
      lk.rel = 'stylesheet';
      lk.href = 'https://fonts.googleapis.com/css2?family=Jua&display=swap';
      document.head.appendChild(lk);
    }
  }

  /* ---------------- 각 절 그리기 ---------------- */

  function htmlHistory() {
    var items = HISTORY.map(function (h, i) {
      return '<li class="fg-tli" data-i="' + i + '">' +
        '<button type="button" class="fg-tlbtn" aria-expanded="false" aria-controls="fg-tl-' + i + '">' +
        '<span class="fg-tlemo" aria-hidden="true">' + h.emoji + '</span>' +
        '<span><span class="fg-tlwhen">' + esc(h.when) + '</span><span class="fg-tltitle">' + esc(h.title) + '</span></span>' +
        '<span class="fg-tlarrow" aria-hidden="true">▾</span></button>' +
        '<div class="fg-tlbody" id="fg-tl-' + i + '" hidden><p>' + esc(h.text) + '</p>' + entryLink(h.link) + '</div>' +
        '</li>';
    }).join('');
    return '<p class="fg-lead">밀가루는 아주 오랜 시간 동안 사람과 함께했어요. 점을 눌러서 이야기를 펼쳐 보세요.</p>' +
      '<ol class="fg-tl">' + items + '</ol>' +
      '<p class="fg-note">아주 오래된 일은 정확한 때를 알기 어려워요. 그래서 ‘약’이라고 적었어요.</p>';
  }

  function htmlFunction() {
    var cards = FUNCTIONS.map(function (f) {
      return '<article class="fg-clay">' +
        '<span class="fg-emo" aria-hidden="true">' + f.emoji + '</span>' +
        '<h3>' + esc(f.title) + '</h3>' +
        '<p>' + esc(f.text) + '</p>' +
        entryLink(f.letter, f.word) +
        '</article>';
    }).join('');
    return '<p class="fg-lead">밀가루는 그냥 하얀 가루가 아니에요. 요리 속에서 여러 가지 일을 척척 해내요.</p>' +
      '<div class="fg-grid">' + cards + '</div>';
  }

  function barHtml(t) {
    var max = 16;
    return '<div class="fg-bar" aria-label="단백질 ' + esc(t.protein) + '">' +
      '<div class="fg-barlabel"><span>단백질 막대 💪</span><span>' + esc(t.protein.split(' (')[0]) + '</span></div>' +
      '<div class="fg-track"><span class="fg-fill" data-w="' + Math.round((t.hi / max) * 100) + '"></span></div>' +
      '<div class="fg-barlabel"><span>0%</span><span>8%</span><span>16%</span></div>' +
      '</div>';
  }

  function htmlTypes() {
    var rows = TYPES.map(function (t) {
      return '<tr><td>' + t.emoji + ' ' + esc(t.name) + '</td><td>' + esc(t.protein) + '</td><td>' +
        esc(t.feel) + '</td><td>' + esc(t.foods) + '</td></tr>';
    }).join('');
    var table = '<div class="fg-tablewrap" role="region" aria-label="밀가루 종류 비교표" tabindex="0">' +
      '<table class="fg-table"><thead><tr><th>이름</th><th>단백질</th><th>느낌</th><th>어디에 써요?</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
    var cards = TYPES.map(function (t, i) {
      return '<article class="fg-clay fg-tcard">' +
        '<button type="button" class="fg-tbtn" aria-expanded="false" aria-controls="fg-ty-' + i + '">' +
        '<span class="fg-emo" aria-hidden="true">' + t.emoji + '</span>' +
        '<span><span class="fg-tname">' + esc(t.name) + '</span><span class="fg-tprot">' + esc(t.foods) + '</span></span>' +
        '<span class="fg-tarrow" aria-hidden="true">▾</span></button>' +
        barHtml(t) +
        '<div class="fg-tbody" id="fg-ty-' + i + '" hidden>' +
        '<p>' + esc(t.text) + '</p>' +
        '<dl><dt>단백질</dt><dd>' + esc(t.protein) + '</dd><dt>느낌</dt><dd>' + esc(t.feel) + '</dd></dl>' +
        entryLink(t.letter) +
        '</div></article>';
    }).join('');
    return '<p class="fg-lead">밀가루는 단백질(글루텐)이 얼마나 들어 있느냐에 따라 이름이 달라져요. 단백질이 많을수록 반죽이 더 쫄깃해져요. 단단한 밀에서는 강력분이, 무른 밀에서는 박력분이 나와요.</p>' +
      table +
      '<div class="fg-tcards">' + cards + '</div>' +
      '<p class="fg-note">단백질 숫자는 대략이에요. 정확한 기준은 나라와 회사마다 조금씩 달라요. 밀가루 봉지 뒤의 ‘영양 정보’를 살펴보세요!</p>' +
      '<p class="fg-note">🔥 재(회분)로 나누는 나라도 있어요. 밀가루를 아주 뜨거운 오븐에서 태우면 재가 조금 남아요. 껍질에는 무기질이 많아서, 껍질이 많이 섞일수록 재가 많이 남아요. 흰 밀가루 100g은 재가 약 0.4g, 밀알을 통째로 간 가루는 약 2g 넘게 남아요. 독일은 이 양을 숫자로 붙여 405(하얀 가루)부터 1600(짙은 통곡물 가루)까지, 프랑스는 45부터 150까지로 나눠요.</p>';
  }

      '<radialGradient id="fg-gGerm" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#F6D77A"/><stop offset="1" stop-color="#D9A93A"/></radialGradient>' +

      '<path d="M120 12 C185 12 222 80 222 165 C222 250 180 308 120 308 C60 308 18 250 18 165 C18 80 55 12 120 12 Z" fill="url(#fg-gBran)"/>' +

      '<g fill="#E9D7B0" opacity=".8"><circle cx="92" cy="110" r="5"/><circle cx="140" cy="95" r="4"/><circle cx="160" cy="150" r="6"/><circle cx="105" cy="170" r="4"/><circle cx="135" cy="210" r="5"/><circle cx="80" cy="215" r="4"/><circle cx="170" cy="225" r="4"/></g>' +
      '<path d="M120 40 C118 120 118 200 120 250" stroke="#E2CDA0" stroke-width="3" fill="none" stroke-dasharray="6 8"/>' +

      '<g class="fg-part" data-part="germ" tabindex="0" role="button" aria-label="씨눈(배아)">' +

      '<path d="M104 286 C110 278 120 276 126 282" stroke="#9C7A1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +

      '<g font-size="14" fill="#5B4636" font-family="Jua, sans-serif" pointer-events="none">' +

    var btns = [['bran', '🛡️ 껍질'], ['germ', '🌱 씨눈'], ['endo', '🍚 배젖']].map(function (b) {
      return '<button type="button" class="fg-pill" data-part="' + b[0] + '" aria-pressed="false">' + b[1] + '</button>';

  /* ---------------- 동작 연결 ---------------- */

  function wireToggle(root, itemSel, btnSel, bodySel, onOpen) {
    Array.prototype.forEach.call(root.querySelectorAll(itemSel), function (item) {
      var btn = item.querySelector(btnSel);
      var body = item.querySelector(bodySel);
      btn.addEventListener('click', function () {
        var open = !item.classList.contains('fg-open');
        item.classList.toggle('fg-open', open);
        btn.setAttribute('aria-expanded', String(open));
        body.hidden = !open;
        if (open && onOpen) onOpen(item);
      });
    });
  }

  function showPart(root, key) {
    var p = PARTS[key];
    if (!p) return;
    var anat = root.querySelector('.fg-anat');
    anat.classList.add('fg-sel');
    Array.prototype.forEach.call(anat.querySelectorAll('.fg-part'), function (g) {
      g.classList.toggle('fg-hl', g.getAttribute('data-part') === key);
    });
    Array.prototype.forEach.call(anat.querySelectorAll('.fg-pbtns .fg-pill'), function (b) {
      var on = b.getAttribute('data-part') === key;
      b.classList.toggle('fg-on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    anat.querySelector('.fg-pinfo').innerHTML =
      '<h3>' + p.emoji + ' ' + esc(p.name) + '<span class="fg-pct">' + esc(p.pct) + '</span></h3>' +
      '<p>' + esc(p.text) + '</p>' + entryLink(p.letter);
  }

  function animateBars(root) {
    var fills = root.querySelectorAll('.fg-fill');
    function go() {
      Array.prototype.forEach.call(fills, function (f) {
        f.style.width = 'calc(' + f.getAttribute('data-w') + '% - 8px)';
      });
    }
    var sec = root.querySelector('#guide-types');
    if ('IntersectionObserver' in window && sec) {
      var io = new IntersectionObserver(function (ents) {
        if (ents.some(function (e) { return e.isIntersecting; })) { go(); io.disconnect(); }
      }, { threshold: 0.15 });
      io.observe(sec);
    } else {
      go();
    }
  }

  function mount(el) {
    if (!el) return;
    injectStyle();

    var nav = SECTIONS.map(function (s) {
      return '<a class="fg-pill" href="#' + s.id + '" data-fg-jump="' + s.id + '">' + s.emoji + ' ' + esc(s.pill) + '</a>';
    }).join('');

    var builders = {
      'guide-history': htmlHistory,
      'guide-function': htmlFunction,
      'guide-types': htmlTypes,
      'guide-anatomy': htmlAnatomy
    };

    var secs = SECTIONS.map(function (s) {
      return '<section class="fg-sec" id="' + s.id + '" aria-labelledby="' + s.id + '-h">' +
        '<h2 id="' + s.id + '-h">' + s.emoji + ' ' + esc(s.title) + '</h2>' +
        builders[s.id]() + '</section>';
    }).join('');

    el.innerHTML =
      '<div class="fg-root">' +
      '<header class="fg-head"><h2>📖 밀가루 총론</h2><p>낱말 사전을 펼치기 전에, 밀가루의 큰 그림을 먼저 살펴봐요.</p></header>' +
      '<nav class="fg-nav" aria-label="총론 바로가기">' + nav + '</nav>' +
      secs +
      '</div>';

    var root = el.querySelector('.fg-root');

    // 바로가기: 해시를 바꾸지 않고 부드럽게 이동 (A–Z 해시 라우팅과 부딪히지 않게)
    Array.prototype.forEach.call(root.querySelectorAll('[data-fg-jump]'), function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var t = document.getElementById(a.getAttribute('data-fg-jump'));
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        Array.prototype.forEach.call(root.querySelectorAll('[data-fg-jump]'), function (x) {
          x.classList.toggle('fg-on', x === a);
        });
      });
    });

    // 낱말 링크: location.hash = LETTER
    root.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('[data-fg-letter]') : null;
      if (!a) return;
      e.preventDefault();
      location.hash = a.getAttribute('data-fg-letter');
    });

    wireToggle(root, '.fg-tli', '.fg-tlbtn', '.fg-tlbody');
    wireToggle(root, '.fg-tcard', '.fg-tbtn', '.fg-tbody');

    // 밀알 부분 고르기
    Array.prototype.forEach.call(root.querySelectorAll('.fg-anat [data-part]'), function (n) {
      var key = n.getAttribute('data-part');
      n.addEventListener('click', function () { showPart(root, key); });
      if (n.tagName.toLowerCase() === 'g') {
        n.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showPart(root, key); }
        });
      }
    });

    // 첫 번째 연표 점은 열어 둬요
    var first = root.querySelector('.fg-tli .fg-tlbtn');
    if (first) first.click();

    animateBars(root);

  function matchQ(e){
    if(!state.q) return true;
    var hay = (e.word + ' ' + e.korean + ' ' + e.summary + ' ' + e.letter).toLowerCase();
    return state.q.split(/\s+/).every(function(t){ return hay.indexOf(t) !== -1; });
  }
  function matchFav(e){ return !state.fav || !!favs[e.letter]; }

  /* ---------- cards ---------- */
  var grid = $('grid');
  function renderCards(){
    if(!data.length){
      grid.innerHTML = '';
      $('empty').hidden = false;
      $('empty').querySelector('h2').textContent = '낱말을 준비하고 있어요';
      $('emptyMsg').textContent = '조금 뒤에 다시 열어 주세요. 🌾';
      $('resetBtn').hidden = true;
      return;
    }
    var html = data.map(function(e, i){
      var id = byLetter[e.letter] === i ? ' id="entry-' + esc(e.letter) + '"' : '';
      var cls = catCls(e.category);
      return '<li class="card ' + cls + '"' + id + ' data-i="' + i + '">' +
        '<button class="card-open" type="button" data-i="' + i + '" aria-label="' + esc(e.letter + ', ' + e.word + ', ' + e.korean + ' 자세히 보기') + '">' +
          '<span class="card-top"><span class="badge" aria-hidden="true">' + esc(e.letter) + '</span><span class="card-emoji" aria-hidden="true">' + esc(e.emoji) + '</span></span>' +
          '<span class="card-word">' + esc(e.word) + '</span>' +
          '<span class="card-ko">' + esc(e.korean) + '</span>' +
          '<span class="card-sum">' + esc(e.summary) + '</span>' +
          '<span class="chip ' + cls + '">' + (CAT_ICON[e.category] || '📖') + ' ' + esc(e.category || '기타') + '</span>' +
        '</button>' +
        '<button class="fav" type="button" data-letter="' + esc(e.letter) + '" data-word="' + esc(e.word) + '" aria-pressed="' + !!favs[e.letter] + '" aria-label="' + (favs[e.letter] ? '즐겨찾기에서 빼기: ' : '즐겨찾기에 넣기: ') + esc(e.word) + '">⭐</button>' +
      '</li>';
    }).join('');
    grid.innerHTML = html;
  }
  grid.addEventListener('click', function(ev){
    var f = ev.target.closest('.fav'); if(f){ toggleFav(f.dataset.letter); return; }
    var o = ev.target.closest('.card-open'); if(o){ openEntry(+o.dataset.i, o); }
  });

  function applyFilters(){
    if(!data.length){ updateCounts(); return; }
    var cards = grid.children, shown = 0;
    for(var i = 0; i < cards.length; i++){
      var e = data[+cards[i].dataset.i];
      var ok = matchQ(e) && matchFav(e) && (state.cat === '전체' || e.category === state.cat);
      cards[i].hidden = !ok; if(ok) shown++;
    }
    updateCounts();
    $('favOnly').setAttribute('aria-pressed', state.fav);
    var empty = $('empty');
    empty.hidden = shown > 0;
    if(!shown){
      $('emptyMsg').textContent = state.fav && !Object.keys(favs).length
        ? '아직 ⭐ 즐겨찾기한 낱말이 없어요. 마음에 드는 카드의 별을 눌러 봐요!'
        : '다른 말로 찾아보거나, 고른 것을 모두 풀어 볼까요?';
    }
    var parts = [];
    if(state.q) parts.push('“' + qEl.value.trim() + '”');
    if(state.cat !== '전체') parts.push(state.cat);
    if(state.fav) parts.push('즐겨찾기');
    $('status').textContent = parts.length ? parts.join(' · ') + ' — 낱말 ' + shown + '개를 찾았어요.' : '모두 ' + data.length + '개의 낱말이 있어요.';
  }
  function updateCounts(){
    var counts = {'전체': 0}; CATS.forEach(function(c){ counts[c] = 0; });
    data.forEach(function(e){ if(matchQ(e) && matchFav(e)){ counts['전체']++; if(e.category in counts) counts[e.category]++; } });
    Array.prototype.forEach.call(filtersEl.children, function(b){
      var c = b.dataset.cat, on = c === state.cat;
      b.setAttribute('aria-pressed', on);
      b.querySelector('.n').textContent = counts[c];
      b.disabled = !on && counts[c] === 0;
      b.setAttribute('aria-label', c + ' ' + counts[c] + '개');
    });
  }

  /* ---------- active letter observer ---------- */
  function observeCards(){
    if(!('IntersectionObserver' in window) || !data.length) return;
    var visible = {};
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ var i = +en.target.dataset.i; if(en.isIntersecting) visible[i] = true; else delete visible[i]; });
      var keys = Object.keys(visible).map(Number).filter(function(i){ return !grid.children[i].hidden; });
      if(keys.length) setActiveLetter(data[Math.min.apply(null, keys)].letter);
    }, { rootMargin: '-120px 0px -50% 0px', threshold: 0 });
    Array.prototype.forEach.call(grid.children, function(c){ io.observe(c); });
  }

  /* ---------- modal ---------- */
  var modal = $('modal'), sheet = $('sheet'), detail = $('detail');
  var current = -1, opener = null;
  function openEntry(i, from){
    if(i < 0 || i >= data.length) return;
    var wasOpen = current >= 0;
    if(!wasOpen){ opener = from || document.activeElement; }
    current = i; stopSpeak();
    renderDetail();
    if(!wasOpen){
      modal.hidden = false; document.body.classList.add('lock');
      setTimeout(function(){ $('closeBtn').focus(); }, 30);
    }
    sheet.scrollTop = 0;
    var L = data[i].letter;
    if(location.hash !== '#' + L){ try{ history.replaceState(null, '', '#' + L); }catch(e){} }
  }
  function closeModal(){
    if(current < 0) return;
    stopSpeak();
    var L = data[current].letter;
    current = -1; modal.hidden = true; document.body.classList.remove('lock');
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    var back = opener && document.contains(opener) ? opener : (document.querySelector('#entry-' + L + ' .card-open'));
    if(back && back.focus) back.focus({preventScroll: false});
    opener = null;
  }
  function renderDetail(){
    var e = data[current], cls = catCls(e.category);
    var rel = e.related.filter(function(r, k, arr){ return r !== e.letter && arr.indexOf(r) === k && (r in byLetter); });
    detail.innerHTML =
      '<div class="d-hero">' +
        '<div class="d-emoji" aria-hidden="true">' + esc(e.emoji) + '</div>' +
        '<div class="d-titles">' +
          '<div class="d-line ' + cls + '"><span class="badge" aria-hidden="true">' + esc(e.letter) + '</span><h2 class="d-word" id="dWord">' + esc(e.word) + '</h2></div>' +
          '<p class="d-ko">' + esc(e.korean) + '</p>' +
          '<span class="chip ' + cls + '">' + (CAT_ICON[e.category] || '📖') + ' ' + esc(e.category || '기타') + '</span>' +
        '</div>' +
      '</div>' +
      (e.summary ? '<p class="d-sum">' + esc(e.summary) + '</p>' : '') +
      '<div class="d-body">' + e.body.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' +
      (e.facts && e.facts.length ? '<div class="d-facts"><h3>📋 한눈에 보기</h3><dl>' + e.facts.map(function(f){ return '<div><dt>' + esc(f.k) + '</dt><dd>' + esc(f.v) + '</dd></div>'; }).join('') + '</dl></div>' : '') +
      (e.more && e.more.length ? '<div class="d-more"><h3>🔍 더 알아보기</h3>' + e.more.map(function(m){ return '<details><summary>' + esc(m.t) + '</summary><p>' + esc(m.d) + '</p></details>'; }).join('') + '</div>' : '') +
      (e.words && e.words.length ? '<div class="d-words"><h3>📖 낱말 풀이</h3><dl>' + e.words.map(function(w){ return '<div><dt>' + esc(w.w) + '</dt><dd>' + esc(w.m) + '</dd></div>'; }).join('') + '</dl></div>' : '') +
      (e.funFact ? '<div class="callout call-fun"><h3>💡 깜짝 상식</h3><p>' + esc(e.funFact) + '</p></div>' : '') +
      (e.tryIt ? '<div class="callout call-try"><h3>🙌 해 보아요</h3><p>' + esc(e.tryIt) + '</p></div>' : '') +
      (rel.length ? '<div class="related"><h3>🔗 함께 보면 좋은 낱말</h3><div class="rel-list">' + rel.map(function(r){
          var t = data[byLetter[r]];
          return '<button class="nbtn rel-btn ' + catCls(t.category) + '" type="button" data-letter="' + esc(r) + '"><span class="b" aria-hidden="true">' + esc(r) + '</span>' + esc(t.korean || t.word) + '</button>';
        }).join('') + '</div></div>' : '');
    var p = data[current - 1], n = data[current + 1];
    $('prevBtn').disabled = !p; $('nextBtn').disabled = !n;
    $('prevT').textContent = p ? p.letter + ' ' + (p.korean || p.word) : '처음이에요';
    $('nextT').textContent = n ? n.letter + ' ' + (n.korean || n.word) : '마지막이에요';
    $('prevBtn').setAttribute('aria-label', p ? '이전 낱말: ' + p.word : '이전 낱말 없음');
    $('nextBtn').setAttribute('aria-label', n ? '다음 낱말: ' + n.word : '다음 낱말 없음');
    syncFavButtons(e.letter);
  }
  detail.addEventListener('click', function(ev){
    var r = ev.target.closest('.rel-btn'); if(r){ openEntry(byLetter[r.dataset.letter]); $('closeBtn').focus(); }
  });
  $('closeBtn').addEventListener('click', closeModal);
  $('modalBg').addEventListener('click', closeModal);
  $('prevBtn').addEventListener('click', function(){ openEntry(current - 1); });
  $('nextBtn').addEventListener('click', function(){ openEntry(current + 1); });
  $('dFav').addEventListener('click', function(){ if(current >= 0) toggleFav(data[current].letter); });
  document.addEventListener('keydown', function(ev){
    if(current < 0) return;
    if(ev.key === 'Escape'){ ev.preventDefault(); closeModal(); return; }
    if(ev.key === 'ArrowLeft' && current > 0){ ev.preventDefault(); openEntry(current - 1); return; }
    if(ev.key === 'ArrowRight' && current < data.length - 1){ ev.preventDefault(); openEntry(current + 1); return; }
    if(ev.key === 'Tab'){
      var f = Array.prototype.filter.call(sheet.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])'), function(el){ return !el.disabled && !el.hidden && el.offsetParent !== null; });
      if(!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if(ev.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))){ ev.preventDefault(); last.focus(); }
      else if(!ev.shiftKey && (document.activeElement === last || !sheet.contains(document.activeElement))){ ev.preventDefault(); first.focus(); }
    }
  });

  /* ---------- speech ---------- */
  var synth = window.speechSynthesis, speaking = false;
  var canSpeak = !!(synth && window.SpeechSynthesisUtterance);
  if(canSpeak) $('speakBtn').hidden = false;
  function koVoice(){ try{ var v = synth.getVoices(); for(var i = 0; i < v.length; i++){ if(/^ko/i.test(v[i].lang)) return v[i]; } }catch(e){} return null; }
  function setSpeakUI(on){ speaking = on; $('speakBtn').setAttribute('aria-pressed', on); $('speakLbl').textContent = on ? '멈추기' : '읽어주기'; }
  function stopSpeak(){ if(canSpeak){ try{ synth.cancel(); }catch(e){} } if(speaking) setSpeakUI(false); }
  $('speakBtn').addEventListener('click', function(){
    if(!canSpeak || current < 0) return;
    if(speaking){ stopSpeak(); return; }
    var e = data[current];
    var chunks = [e.letter + '. ' + e.word + '. ' + e.korean + '.', e.summary].concat(e.body);
    if(e.funFact) chunks.push('깜짝 상식. ' + e.funFact);
    if(e.tryIt) chunks.push('해 보아요. ' + e.tryIt);
    chunks = chunks.filter(Boolean);
    try{ synth.cancel(); }catch(err){}
    var voice = koVoice();
    setSpeakUI(true);
    chunks.forEach(function(text, k){
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.92; u.pitch = 1.05; if(voice) u.voice = voice;
      if(k === chunks.length - 1){ u.onend = function(){ setSpeakUI(false); }; }
      u.onerror = function(){ setSpeakUI(false); };
      synth.speak(u);
    });
  });

  /* ---------- random ---------- */
  $('randomBtn').addEventListener('click', function(ev){ if(data.length) openEntry(rand(data.length), ev.currentTarget); });
  if(!data.length) $('randomBtn').disabled = true;

  /* ---------- back to top ---------- */
  var toTop = $('toTop'), ticking = false;
  window.addEventListener('scroll', function(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(function(){ toTop.classList.toggle('show', window.scrollY > 600); ticking = false; });
  }, {passive: true});
  toTop.addEventListener('click', function(){ window.scrollTo({top: 0, behavior: 'smooth'}); });

  /* ---------- hash deep links ---------- */
  function fromHash(){
    var m = /^#([A-Za-z])$/.exec(location.hash || '');
    if(!m) return;
    var i = byLetter[m[1].toUpperCase()];
    if(i == null) return;
    var card = $('entry-' + data[i].letter);
    if(card){ setActiveLetter(data[i].letter); card.scrollIntoView({block: 'start'}); }
    openEntry(i, card ? card.querySelector('.card-open') : null);
  }
  window.addEventListener('hashchange', function(){
    var m = /^#([A-Za-z])$/.exec(location.hash || '');
    if(m && (current < 0 || data[current].letter !== m[1].toUpperCase())) fromHash();
  });

  /* ---------- init ---------- */
  renderCards();
  applyFilters();
  observeCards();
  if(data.length) fromHash();
})();
</script>
<script>try{window.FlourGuide&&FlourGuide.mount(document.getElementById("guide"))}catch(e){console.error(e)}</script>
</body>
