<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kearney Hotspot 시상식</title>
<!--
  사용법
  - → 키: 3등 → 2등 → 1등 → 전체 결과 순으로 공개. 공개마다 스포트라이트가 카드 위를 돌다 수상 조에 멈추고 폭죽이 터진다.
  - 클릭은 시상을 넘기지 않는다. 카드의 "결과물 보기"를 누르면 그 조의 페이지가 새 탭으로 열린다.
  - R: 처음부터 다시. F 또는 오른쪽 아래 버튼: 전체 화면. M: 소리 켜고 끄기.
  - 소리: 카드 고를 때 딸깍 소리와 드럼롤, 3등 짧은 빵빠레, 2등 더 크고 긴 빵빠레, 1등 피날레 빵빠레와 폭죽 소리. 파일 없이 브라우저에서 합성한다.
  - 순위 바꾸기: awards.html?first=1&second=8&third=7 (기본값은 아래 RANK)
  - 카드 내용은 아래 TEAMS 배열에서 고친다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Archivo+Black&family=Black+Han+Sans&family=Bungee&family=DM+Serif+Display:ital@0;1&family=Do+Hyeon&family=Nanum+Pen+Script&family=Song+Myung&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: 크라프트 보드에 11개 조의 종이 카드를 4열로 붙이고, 공개 순간에는 한 장을 떼어 가운데 크게 띄운다. */
:root{
  --board:#b48a58;
  --paper:#f3eee1;
  --ink:#1c1916;
  --red:#d23a26;
  --blue:#2b57a6;
  --yellow:#f2c432;
  --pink:#f0a2b6;
  --green:#3a8956;
  --mint:#bfe3cf;
  --sky:#bcd3f0;
  --gold:#e7b230;
  --silver:#c4ccd5;
  --bronze:#c47f45;
  --tape:rgba(250,246,214,.66);
  --shadow:rgba(28,25,22,.32);

  --f-display:"Abril Fatface","Song Myung",Georgia,serif;
  --f-ko:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --f-mono:"Space Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;color:var(--ink);font-family:var(--f-ko);user-select:none;
  word-break:keep-all;overflow-wrap:break-word;
  background:
    radial-gradient(ellipse at 18% 22%, rgba(255,240,210,.18), transparent 45%),
    radial-gradient(ellipse at 82% 78%, rgba(60,35,10,.18), transparent 50%),
    repeating-linear-gradient(83deg, rgba(60,35,10,.05) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-12deg, rgba(255,240,210,.05) 0 1px, transparent 1px 5px),
    var(--board);
}
body.idle{cursor:none}

.board{
  height:100%;display:grid;grid-template-rows:auto 1fr;gap:2vh;
  padding-block:max(2vh, env(safe-area-inset-top, 0px)) max(2.4vh, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, 2.4vw, env(safe-area-inset-left, 0px));
  padding-right:max(16px, 2.4vw, env(safe-area-inset-right, 0px));
}
.lift{filter:drop-shadow(3px 5px 0 var(--shadow))}
.tape{
  position:absolute;width:5.2em;height:1.4em;background:var(--tape);z-index:2;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  clip-path:polygon(3% 8%,8% 0,92% 4%,97% 0,100% 92%,95% 100%,6% 96%,0 100%);
}

/* 위 */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.title{
  position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.3em .6em;padding:.45em .9em .4em;background:var(--paper);
  transform:rotate(-1.5deg);font-size:clamp(calc(16px + 2pt),calc(2.6vh + 2pt),calc(34px + 2pt));
  clip-path:polygon(0 6%,3% 0,97% 4%,100% 0,99% 94%,96% 100%,2% 95%);
}
.title .tape{top:-.55em;left:40%;transform:rotate(-4deg)}
.hand{font-family:var(--f-hand);font-size:1.2em;line-height:1;white-space:nowrap}
.words{display:flex;gap:.08em;font-size:1.25em}
.hint{
  position:relative;padding:.55em 1em .5em;background:var(--yellow);transform:rotate(2deg);
  font-size:clamp(15px,2.3vh,30px);clip-path:polygon(0 0,100% 3%,98% 100%,2% 96%);
}
.hint .tape{top:-.55em;right:1em;transform:rotate(6deg)}
.hint b{color:var(--red);font-weight:400}

/* 카드 격자 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:2.2vh 1.8vw;min-height:0}
.slot{position:relative;min-width:0;min-height:0;transition:transform .4s ease, opacity .5s ease, filter .5s ease}
.slot > .lift{height:100%}

.card{
  position:relative;height:100%;display:flex;flex-direction:column;gap:.45em;
  padding:.85em 1em .8em;font-size:min(2.15vh,1.25vw);
  background:var(--paper);transform:rotate(var(--r,0deg));
  clip-path:var(--clip);
}
.card .tape{top:-.4em;left:calc(50% - 2.6em);transform:rotate(var(--tr,-3deg))}
.c0{background:repeating-linear-gradient(0deg, rgba(28,25,22,.07) 0 1px, transparent 1px 5px), var(--paper)}
.c1{background:var(--yellow)}
.c2{background:radial-gradient(rgba(28,25,22,.16) 1px, transparent 1.6px) 0 0/6px 6px, var(--pink)}
.c3{background:var(--mint)}
.c4{background:var(--sky)}
.k0{--clip:polygon(1% 2%,99% 0,100% 97%,0 100%)}
.k1{--clip:polygon(0 3%,40% 0,100% 2%,98% 100%,55% 97%,2% 100%)}
.k2{--clip:polygon(2% 0,100% 3%,97% 98%,0 100%)}

.row{display:flex;align-items:center;gap:.25em .6em;flex-wrap:wrap}
.team{display:flex;align-items:center;font-size:2.3em;line-height:1}
.members{margin:0;font-family:var(--f-hand);font-size:1.6em;line-height:1}
.head{
  margin:0;font:400 1.75em/1.24 var(--f-ko);letter-spacing:-.01em;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.head mark{background:var(--red);color:var(--paper);padding:0 .18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.c0 .head mark,.c3 .head mark{background:var(--ink)}
.sub{margin:0;min-width:0;font:italic 400 1.05em/1.2 "DM Serif Display","Song Myung",serif;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place-tag{margin:0;font:400 1.6em/1 var(--f-ko)}
.place-tag span{display:inline-block;background:var(--red);color:var(--paper);padding:.12em .35em .08em;transform:rotate(-1.5deg);box-shadow:2px 3px 0 var(--shadow)}

/* 매장 이름과 링크는 장식 없이 글자로만 둔다. 카드의 장식은 조 번호와 상권 강조 하나로 충분하다. */
.store{margin:0;min-width:0;font:400 1.3em/1.2 var(--f-ko);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{opacity:.55}
.tagline{margin:0;font:400 1.5em/1.15 var(--f-hand)}
.stats{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.2em 0;font:400 .95em/1.3 var(--f-ko)}
.stats li{white-space:nowrap}
.stats li + li::before{content:"·";margin:0 .5em;opacity:.5}
.foot{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:.8em;min-width:0}
.open{flex:none;color:inherit;font:400 .9em/1 var(--f-ko);opacity:.65;text-decoration:underline;text-underline-offset:.2em;cursor:pointer}
.open:hover{opacity:1;color:var(--red)}
.open:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* 격자 카드에는 제목, 매장 이름, 링크만 둔다. 한 줄 설명과 근거 숫자는 공개 무대에서만 보인다. */
.grid .tagline,.grid .stats,.grid .sub{display:none}
.grid .card{gap:.35em}
.grid .team{font-size:2em}
.grid .head{font-size:1.5em}
.grid .store{font-size:1.05em}
.grid .members{font-size:1.3em}
.grid .place-tag{font-size:1.3em}
.grid .foot{justify-content:flex-end}

/* 시작 카드 (12번째 칸) */
.start-card{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;
  background:var(--ink);color:var(--paper);transform:rotate(2.5deg);font-size:min(2.15vh,1.25vw);
  clip-path:polygon(0 4%,100% 0,98% 100%,3% 96%);text-align:center;
}
.start-card .big{font:400 3.2em/1 var(--f-display);color:var(--yellow)}
.start-card .hand{font-size:2em}

/* 랜섬 노트 글자 */
.cut{display:inline-block;transform:rotate(var(--r,0deg)) translateY(var(--y,0));filter:drop-shadow(2px 3px 0 var(--shadow))}
.chip{display:flex;align-items:center;justify-content:center;line-height:1;padding:.08em .16em .04em}
.v0{background:repeating-linear-gradient(0deg, rgba(28,25,22,.08) 0 1px, transparent 1px 4px), var(--paper);color:var(--ink);font-family:"DM Serif Display","Song Myung",Georgia,serif}
.v1{background:var(--red);color:var(--paper);font-family:"Archivo Black","Black Han Sans",sans-serif}
.v2{background:var(--yellow);color:var(--ink);font-family:"Bungee","Do Hyeon",sans-serif}
.v3{background:var(--ink);color:var(--paper);font-family:"Abril Fatface","Song Myung",Georgia,serif}
.v4{background:var(--blue);color:var(--paper);font-family:"DM Serif Display","Song Myung",Georgia,serif;font-style:italic}
.v5{background:radial-gradient(rgba(28,25,22,.2) 1px, transparent 1.6px) 0 0/6px 6px, var(--pink);color:var(--ink);font-family:"Abril Fatface","Black Han Sans",serif}
.v6{background:repeating-linear-gradient(0deg, rgba(28,25,22,.08) 0 1px, transparent 1px 4px), var(--paper);color:var(--red);font-family:"Bungee","Do Hyeon",sans-serif}
.v7{background:var(--green);color:var(--paper);font-family:"Archivo Black","Do Hyeon",sans-serif}
.s0{clip-path:polygon(2% 4%,97% 0,100% 93%,4% 100%)}
.s1{clip-path:polygon(0 8%,30% 2%,62% 6%,100% 0,96% 52%,100% 97%,58% 93%,22% 100%,3% 94%,5% 48%)}
.s2{clip-path:polygon(5% 0,100% 6%,94% 100%,0 92%)}
.s3{clip-path:polygon(0 0,48% 4%,100% 1%,98% 100%,52% 95%,2% 99%)}

/* 스포트라이트 룰렛 */
.slot.spot{transform:translateY(-6px) scale(1.04);z-index:3}
.slot.spot::after{
  content:"";position:absolute;inset:-10px;border:5px solid var(--yellow);pointer-events:none;
  box-shadow:0 0 0 4px var(--ink), 0 0 40px 10px rgba(242,196,50,.65);
  transform:rotate(-1deg);
}
.rolling .slot:not(.spot):not(.won){opacity:.55;filter:saturate(.6)}

/* 수상 카드 */
.slot.won{z-index:2}
.slot.won .medal{position:absolute;top:-1.6vh;right:-.6vw;z-index:4;font-size:min(2vh,1.15vw)}
.final .slot:not(.won){opacity:.42;filter:grayscale(.7)}
.final .slot.won{transform:scale(1.05)}
.final .slot.won.r1{transform:scale(1.1) rotate(-1deg)}

/* 로제트 메달 */
.rosette{position:relative;width:6.4em;height:8em;display:block}
.rosette .tail{position:absolute;top:3.6em;width:2.2em;height:4.4em;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.rosette .tail.l{left:1.1em;transform:rotate(14deg)}
.rosette .tail.r{right:1.1em;transform:rotate(-14deg);background:var(--blue)}
.rosette .disc{
  position:absolute;top:0;left:0;width:6.4em;height:6.4em;border-radius:50%;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--m) 0 9deg, color-mix(in srgb, var(--m) 65%, white) 9deg 18deg);
  box-shadow:3px 5px 0 var(--shadow);
}
.rosette .disc span{
  width:4.4em;height:4.4em;border-radius:50%;display:grid;place-items:center;background:var(--m);
  border:.18em solid var(--paper);font:400 1.5em/1 var(--f-ko);color:var(--ink);
}
.m1{--m:var(--gold)} .m2{--m:var(--silver)} .m3{--m:var(--bronze)}

/* 공개 무대 */
.stage{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 45%, rgba(28,25,22,.35), rgba(28,25,22,.82));
  padding:4vh max(16px,4vw);opacity:0;transition:opacity .35s ease;
}
.stage[hidden]{display:none}
.stage:not(.show){pointer-events:none}
.stage.show{opacity:1}
.stage-inner{display:flex;flex-direction:column;align-items:center;gap:3vh;width:min(86vw,1200px)}
.rank-words{display:flex;align-items:center;gap:.12em;font-size:min(13vh,9vw)}
.rank-words .rosette{font-size:.16em;margin-right:.4em}
.feature{width:100%;height:min(62vh,760px)}
.feature .card{font-size:min(3.2vh,1.9vw);gap:.55em;padding:1.1em 1.3em 1em}
.stage.show .rank-words{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
.stage.show .feature{animation:fly .75s .15s cubic-bezier(.2,1.4,.35,1) both}
@keyframes stamp{from{transform:scale(2.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{from{transform:translateY(40vh) scale(.35) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}

canvas#fx{position:fixed;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}
#flash{position:fixed;inset:0;z-index:29;background:#fff6d6;opacity:0;pointer-events:none}
#flash.on{animation:flash .7s ease-out}
@keyframes flash{from{opacity:.8}to{opacity:0}}
.stage::before{content:"";position:absolute;inset:-60%;opacity:0;pointer-events:none;background:repeating-conic-gradient(from 0deg, var(--ray,transparent) 0 6deg, transparent 6deg 18deg);animation:spin 26s linear infinite;transition:opacity .6s}
.stage.r2::before{--ray:rgba(196,204,213,.18);opacity:1}
.stage.r1::before{--ray:rgba(231,178,48,.3);opacity:1}
.stage-inner{position:relative}
@keyframes spin{to{transform:rotate(1turn)}}

.fs-tag{
  position:fixed;z-index:40;border:0;cursor:pointer;
  right:calc(max(16px, 2vw) + env(safe-area-inset-right, 0px));
  bottom:calc(max(12px, 2vh) + env(safe-area-inset-bottom, 0px));
  padding:.5em .9em;background:var(--paper);color:var(--ink);font:400 15px/1 var(--f-ko);
  transform:rotate(-3deg);box-shadow:2px 4px 0 var(--shadow);transition:opacity .3s;
}
.fs-tag kbd{font:700 12px/1 var(--f-mono);padding:.15em .35em;margin-left:.3em;border:1.5px solid var(--ink)}
.fs-tag:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.is-fs.idle .fs-tag{opacity:0;pointer-events:none}
.fs-tag.snd{right:calc(max(16px, 2vw) + env(safe-area-inset-right, 0px) + 130px);transform:rotate(2deg);background:var(--yellow)}

@media (max-width:760px){
  body{overflow:auto}
  .board{height:auto;min-height:100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:minmax(190px,auto)}
  .card,.start-card,.slot.won .medal{font-size:14px}
  .feature .card{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  .stage.show .rank-words,.stage.show .feature{animation:none}
  .stage::before{animation:none}
  .slot{transition:none}
}
</style>
</head>
<body>
<main class="board">
  <header class="top">
    <div class="lift"><div class="title"><span class="tape"></span><span class="hand">11개 조 발표</span><span id="titleWords" class="words"></span><span class="hand date">2026.10.18</span></div></div>
    <div class="lift"><div class="hint"><span class="tape"></span><span id="hint"><b>→</b> 누르면 <b>3등</b> 공개</span></div></div>
  </header>
  <section id="grid" class="grid" aria-label="11개 조 카드"></section>
</main>

<div id="stage" class="stage" hidden>
  <div class="stage-inner">
    <div id="rankWords" class="rank-words"></div>
    <div id="feature" class="feature"></div>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<button id="snd" class="fs-tag snd" type="button">소리 켬<kbd>M</kbd></button>
<button id="fs" class="fs-tag" type="button">전체 화면<kbd>F</kbd></button>

<script>

  // 카드 내용. 패들렛 게시물과 각 조 페이지(2026-10-18 확인)에 적힌 것만 넣었다. 비어 있는 칸은 확인하지 못한 정보다.

        if (p.vy >= -0.6) burst(p.x, p.y, p.power, p.c, p.type); else next.push(p);
      } else if (p.k === "p") {
        p.px = p.x; p.py = p.y;
        p.vx *= p.drag; p.vy = p.vy * p.drag + G * p.g;
        p.x += p.vx; p.y += p.vy; p.life--;
        let a = Math.max(0, p.life / p.max);
        if (p.twinkle) a *= 0.55 + Math.random() * 0.45;
        ctx.globalAlpha = a;
        ctx.strokeStyle = p.c; ctx.lineWidth = p.w;
        ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
        if (p.life > 0) next.push(p);
        else if (p.split) {
          for (let i = 0; i < 4; i++) { const a2 = Math.random() * Math.PI * 2; next.push(P(p.x, p.y, Math.cos(a2) * 2.4, Math.sin(a2) * 2.4, 38, pickc())); }
          if (Math.random() < 0.3) SFX.crackle();
        }
      } else {
        p.ph += 0.05; p.vy = Math.min(p.vy + 0.08, 3.8);
        p.x += p.vx + Math.sin(p.ph) * 0.8; p.y += p.vy; p.rot += p.vr;
        ctx.globalAlpha = 1; ctx.fillStyle = p.c;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.w / 2, (-p.h / 2) * Math.abs(Math.cos(p.ph * 1.7)), p.w, p.h * Math.abs(Math.cos(p.ph * 1.7)) + 1);
        ctx.restore();
        if (p.y < H + 30) next.push(p);
      }
    }
    ctx.globalAlpha = 1;
    parts = next;
    raf = parts.length ? requestAnimationFrame(frame) : 0;
    if (!raf) ctx.clearRect(0, 0, W, H);
  }

  function flash() {
    if (reduce) return;
    const f = $("flash");
    f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  }

  let rainTimer = 0;
  function rain(ticks, n) {
    clearInterval(rainTimer);
    let k = 0;
    rainTimer = setInterval(() => { confetti(n); if (++k > ticks) clearInterval(rainTimer); }, 200);
  }
  function celebrate(rank) {
    SFX.fanfare(rank);
    if (reduce) { confetti(rank === 1 ? 90 : 40, true); return; }
    if (rank === 3) {
      [0, 350, 700, 1000, 1300].forEach((d) => later(() => rocket(1), d));
      confetti(60, false); confetti(40, true);
    } else if (rank === 2) {
      [[0, "ring", 1.2], [250, "peony", 1.2], [600, "ring", 1.3], [1000, "peony", 1.3], [1050, "crossette", 1.2],
       [1400, "ring", 1.4], [1700, "peony", 1.3], [2000, "crossette", 1.3], [2300, "ring", 1.5], [2400, "peony", 1.4]]
        .forEach(([d, ty, p]) => later(() => rocket(p, ty), d));
      confetti(110, false); confetti(70, true);
    } else {
      const types = ["peony", "ring", "willow", "crossette"];
      flash();
      for (let i = 0; i < 6; i++) later(() => rocket(1.5, types[i % 4]), i * 80);
      for (let i = 0; i < 24; i++) later(() => rocket(rnd(1.2, 1.7), types[(Math.random() * 4) | 0]), 600 + i * 125);
      later(flash, 2290);
      later(() => { flash(); for (let i = 0; i < 12; i++) later(() => rocket(1.8, i % 2 ? "willow" : "ring"), i * 60); }, 3650);
      confetti(160, false); confetti(120, true);
      rain(50, 8);
    }
  }
  function celebrateFinal() {
    SFX.finale();
    if (reduce) { confetti(60, true); return; }
    ["ring", "willow", "peony", "crossette", "ring", "willow"].forEach((ty, i) => later(() => rocket(1.4, ty), i * 220));
    confetti(100, false);
    rain(30, 6);
  }

  // 진행: 0 대기 → 3등 → 2등 → 1등 → 전체 결과
  let step = 0, busy = false;
  const HINTS = [
    "<b>→</b> 누르면 <b>3등</b> 공개",
    "<b>→</b> 누르면 <b>2등</b> 공개",
    "<b>→</b> 누르면 <b>1등</b> 공개",
    "<b>→</b> 누르면 <b>전체 결과</b>",
    "축하합니다! <b>R</b> 처음부터",
  ];
  const setHint = () => { $("hint").innerHTML = HINTS[step]; };

  function roulette(winner) {
    return new Promise((done) => {
      const pool = TEAMS.map((t) => t.n).filter((n) => !slots[n].classList.contains("won"));
      if (reduce) { done(); return; }
      document.body.classList.add("rolling");
      const steps = 18;
      const seq = [];
      for (let i = 0; i < steps - 1; i++) {
        let n;
        do { n = pool[(Math.random() * pool.length) | 0]; } while (n === seq[seq.length - 1] || (i === steps - 2 && n === winner));
        seq.push(n);
      }
      seq.push(winner);
      const delay = (k) => 50 + k * k * 0.75;
      let total = 0;
      for (let k = 1; k < seq.length; k++) total += delay(k);
      SFX.pick(RANK_OF[winner], total / 1000);
      let i = 0;
      const tickOne = () => {
        Object.values(slots).forEach((s) => s.classList.remove("spot"));
        slots[seq[i]].classList.add("spot");
        if (i === seq.length - 1) SFX.land(); else SFX.tick(i, seq.length);
        if (innerWidth <= 760) slots[seq[i]].scrollIntoView({ block: "nearest" });
        i++;
        if (i < seq.length) setTimeout(tickOne, delay(i));
        else setTimeout(() => { document.body.classList.remove("rolling"); done(); }, 500);
      };
      tickOne();
    });
  }

  function openStage(n, rank) {
    const t = TEAMS.find((x) => x.n === n);
    const rw = $("rankWords");
    rw.replaceChildren(rosette(rank), chips(`${rank}등`, rank * 5));
    const f = $("feature");
    f.replaceChildren();
    const lift = document.createElement("div");
    lift.className = "lift";
    lift.style.height = "100%";
    lift.append(cardNode(t));
    f.append(lift);
    const st = $("stage");
    st.classList.remove("r1", "r2", "r3");
    st.classList.add("r" + rank);
    st.hidden = false;
    requestAnimationFrame(() => st.classList.add("show"));
    celebrate(rank);
  }
  function closeStage() {
    const st = $("stage");
    st.classList.remove("show");
    return new Promise((r) => setTimeout(() => { st.hidden = true; r(); }, reduce ? 0 : 350));
  }
  function markWon(n, rank) {
    const s = slots[n];
    s.classList.remove("spot");
    s.classList.add("won", "r" + rank);
    const m = document.createElement("span");
    m.className = "medal";
    m.append(rosette(rank));
    s.append(m);
  }

  async function next() {
    if (busy || step > 3) return;
    busy = true;
    if (step >= 1) {
      await closeStage();
      const prev = ORDER[step - 1];
      markWon(prev, RANK_OF[prev]);
    }
    if (step < 3) {
      const n = ORDER[step];
      await roulette(n);
      openStage(n, RANK_OF[n]);
    } else {
      document.body.classList.add("final");
      Object.values(slots).forEach((s) => s.classList.remove("spot"));
      celebrateFinal();
    }
    step++;
    setHint();
    busy = false;
  }

  function reset() {
    if (busy) return;
    step = 0;
    clearInterval(rainTimer);
    timers.splice(0).forEach(clearTimeout);
    parts = [];
    document.body.classList.remove("final", "rolling");
    Object.values(slots).forEach((s) => { s.classList.remove("won", "r1", "r2", "r3", "spot"); s.querySelector(".medal")?.remove(); });
    const st = $("stage"); st.classList.remove("show"); st.hidden = true;
    setHint();
  }

  function toggleSound() {
    muted = !muted;
    if (AC) master.gain.value = muted ? 0 : 0.75;
    $("snd").firstChild.textContent = muted ? "소리 끔" : "소리 켬";
  }
  $("snd").addEventListener("click", toggleSound);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "f" || e.key === "F") fs();
    else if (e.key === "m" || e.key === "M") toggleSound();
  });

  // 전체 화면
  function fs() {
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
  $("fs").addEventListener("click", fs);
  document.addEventListener("fullscreenchange", () => document.body.classList.toggle("is-fs", !!document.fullscreenElement));

  let idleTimer;
  const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); };
  ["mousemove", "pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, wake));
  wake();
  setHint();
})();
</script>
</body>
