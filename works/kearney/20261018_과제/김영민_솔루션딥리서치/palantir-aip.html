Tier로 Speedrun을 직접 해 보고 '해 봤다'는 경험을 하나 만들어 갈 것", "남은 한계: Reddit·X 직접 인용 없음, 사례 수치 대부분 자체 발표 — 신뢰도 배지를 보고 무게를 조절할 것"]}}, "quiz": [{"q": "면접관이 'AIP는 결국 ChatGPT 래퍼 아닌가요?'라고 묻는다. 가장 정확한 반박의 핵심은?", "options": ["AIP는 자체 파운데이션 모델을 학습시켜 GPT보다 성능이 높다", "AIP는 온톨로지(업무 객체·관계·Action)와 권한 체계 위에서 LLM이 데이터를 읽고 Action으로 쓰게 하는 운영 계층이다", "AIP는 여러 LLM의 답을 앙상블해 환각을 원천적으로 없앤다", "AIP는 사내 문서를 벡터 DB에 넣어 검색해 주는 RAG 전용 제품이다"], "answer": 1, "explanation": "AIP의 차별점은 모델이 아니라 온톨로지·Action·권한·감사라는 '운영 계층'이다. 모델은 OpenAI·Anthropic 등 외부 공급자를 고르거나 BYOM으로 등록하므로 '자체 모델로 성능 우위'는 틀렸고, 환각을 '원천적으로 없앤다'는 과장이다(실제로는 Evals·HITL로 관리). RAG는 Document Intelligence 등 기능 일부일 뿐 전체가 아니다.", "difficulty": "basic", "type": "understanding", "ref": "brief"}, {"q": "2026-04 공식 공지 기준, 'AIP Agent Studio'의 현재 이름은?", "options": ["AIP Agent Builder", "AIP Chatbot Studio", "AIP Threads", "AIP Assist"], "answer": 1, "explanation": "Agent Studio는 AIP Chatbot Studio로, AIP Agents는 AIP Chatbots로 개명됐다. Threads는 문서·챗봇 즉석 분석 도구, Assist는 플랫폼 내 도움말로 별개 제품이다. Agent Builder라는 제품명은 없다.", "difficulty": "basic", "type": "recall", "ref": "capabilities"}, {"q": "온톨로지 개념을 데이터베이스 용어로 대응시킬 때 틀린 것은?", "options": ["Object type ≈ 데이터셋(테이블)", "Object ≈ 행(row)", "Link type ≈ 조인(join)", "Action type ≈ 인덱스(index)"], "answer": 3, "explanation": "Action type은 객체·속성·링크를 한 번에 바꾸는 변경 집합과 부수효과의 스키마로, 인덱스가 아니다. 나머지 셋은 공식 core concepts 문서의 대응 그대로다.", "difficulty": "basic", "type": "recall", "ref": "playbook"}, {"q": "고객이 'AI가 틀린 결정을 바로 실행할까 봐 무섭다'고 한다. AIP 기능 중 가장 직접적인 대응은?", "options": ["Pipeline Builder의 Use LLM 노드로 데이터를 정제한다", "Automate에서 Logic의 edit을 자동 적용하지 않고 staging해 Proposals 탭에서 사람이 승인하게 한다", "Model Catalog에서 가장 큰 모델을 선택한다", "AIP Analyst로 결과를 시각화해 보여준다"], "answer": 1, "explanation": "Automate는 edit을 자동 적용하거나 staging할 수 있고, staging된 제안은 추론·decision log와 함께 사람이 승인해야 Action이 실행된다(HITL). 큰 모델 선택은 오류를 없애지 못하고, Analyst 시각화는 실행 통제 장치가 아니며, 데이터 정제는 다른 단계의 일이다.", "difficulty": "intermediate", "type": "application", "ref": "capabilities"}, {"q": "보안팀이 'row/column 권한을 걸었으니 LLM 출력도 안전하다'고 한다. 문서 기준으로 맞는 반응은?", "options": ["맞다. row/column 정책은 입력과 출력 모두에 적용된다", "틀리다. row/column 정책은 읽기 시점에만 적용되므로 출력·edit·하류 데이터 보호에는 lineage로 전파되는 Markings가 필요하다", "틀리다. AIP는 LLM 호출 시 권한 체계를 적용하지 않는다", "맞다. 단, BYOM 모델에서만 그렇다"], "answer": 1, "explanation": "AIP Logic·OSDK 문서는 세분 정책이 읽기 시점에만 적용되고 출력에는 따라가지 않는다고 명시한다. Markings는 lineage로 파생 리소스에 전파되므로 하류 보호 수단이 된다. AIP가 권한을 무시한다는 보기는 반대로 틀렸고, BYOM 여부와는 무관하다.", "difficulty": "advanced", "type": "application", "ref": "playbook"}, {"q": "외부 Microsoft Copilot Studio 에이전트가 Palantir의 '주문' 객체를 조회하고 허용된 Action만 호출하게 하고 싶다. 맞는 도구는?", "options": ["Palantir MCP — AI IDE가 온톨로지 타입을 수정하는 빌더용", "Ontology MCP — Developer Console 앱 범위의 object·action·query를 외부 에이전트에 노출하는 소비자용", "AIP Threads — PDF 기반 즉석 분석", "Pipeline Builder — 노코드 데이터 파이프라인"], "answer": 1, "explanation": "Ontology MCP는 소비자용으로 앱 범위를 제한해 외부 에이전트에 객체·Action을 노출하며, 2026-03 Copilot Studio 연동이 공지됐다. Palantir MCP는 빌더용(타입·코드 변경, 데이터 쓰기 불가)이라 목적이 다르다.", "difficulty": "intermediate", "type": "application", "ref": "capabilities"}, {"q": "AIP Bootcamp에 대한 설명으로 가장 정확한 것은?", "options": ["3개월간 고객사 인력을 Palantir 인증 엔지니어로 교육하는 프로그램", "1~5일 동안 고객의 실제 데이터로 작동하는 유스케이스를 만들고 MVP 롤아웃 계획을 내는 hands-on 세션", "Palantir 직원 대상 신입 온보딩 과정", "슬라이드 중심의 경영진 AI 전략 워크숍"], "answer": 1, "explanation": "공식 자료는 'zero to use case in one to five days', 고객 데이터 위 실습과 MVP 롤아웃 계획을 핵심으로 설명한다. 인증 교육은 별도의 자격 프로그램이고, 슬라이드 워크숍은 Bootcamp가 대체하려던 방식이다.", "difficulty": "basic", "type": "understanding", "ref": "playbook"}, {"q": "에어갭(인터넷 단절) 국방망에도 Palantir 플랫폼 소프트웨어를 지속적으로 배포·업그레이드하게 하는 구성요소는?", "options": ["Foundry DevOps (product 패키징)", "Apollo (Hub-Spoke 방식으로 Rubix 등 각 환경에 플랫폼 소프트웨어를 지속 배포)", "Global Branching", "Ontology SDK"], "answer": 1, "explanation": "Apollo는 Product + Release Channel + 제약으로 플랫폼 소프트웨어를 클라우드·온프렘·기밀망에 배포한다. DevOps와 Global Branching은 고객이 만든 유스케이스 자산(온톨로지·파이프라인·앱)의 패키징·변경 관리 도구라 헷갈리기 쉬운 오답이다. (참고: 별도 enrollment로 고객 자산을 배포할 때는 Foundry products가 Apollo hub를 경유할 수 있다.)", "difficulty": "intermediate", "type": "understanding", "ref": "capabilities"}, {"q": "제조사 고객이 첫 미팅에서 'AI로 공장에서 뭘 할 수 있을지 브레인스토밍하자'고 한다. FDE의 가장 좋은 첫 움직임은?", "options": ["가능한 AI 유스케이스 50개 목록을 즉석에서 제시한다", "LLM 모델 선정부터 논의한다", "가장 비싼 늦은/잘못된 결정 하나를 찾아 누가·어떤 데이터로·얼마나 자주 내리는지 묻고, baseline 지표와 정의를 정한다", "전사 데이터 레이크부터 구축하자고 제안한다"], "answer": 2, "explanation": "플레이북의 Discovery는 '결정'에서 역산한다. 유스케이스 나열이나 모델 선정은 문제 정의 전 솔루션으로 뛰는 실패 패턴이고, 데이터 레이크 선구축은 가치 증명을 늦춘다. 면접 Decomposition에서도 같은 원칙이 평가된다.", "difficulty": "intermediate", "type": "application", "ref": "playbook"}, {"q": "Tampa General Hospital의 '패혈증 재원일수 −30%'를 면접에서 인용할 때 가장 정확한 표현은?", "options": ["AIP 에이전트 도입 효과로 무작위 대조시험에서 입증된 결과", "병원 발표·학회 초록 기준이며, 2023년 Foundry 기반 알림 파일럿의 대조군 없는 전후 비교라 AIP 기여분은 분리되지 않는다", "Palantir 단독 마케팅 수치로 근거가 전혀 없다", "NHS 독립 평가에서 확인된 수치"], "answer": 1, "explanation": "수치는 병원 자료와 SHM 학회 초록에서 나오며, 초록은 AIP 발표 이전에 시작된 Foundry 항생제 알림 파일럿의 전후 비교다. 'AIP 효과·RCT'는 이중으로 과장이고, 병원 측 1차 자료가 있으므로 '근거 없음'은 과소평가, NHS는 다른 사례다.", "difficulty": "intermediate", "type": "understanding", "ref": "cases"}, {"q": "NHS FDP 사례에서 NHS England(7일 이상 재원 환자 지연일수 −13.58%)와 Health Foundation(의미 있는 차이 없음)의 결론이 엇갈린 핵심 이유로 통계 감독기관(OSR)이 지적한 것은?", "options": ["Health Foundation이 다른 나라 데이터를 썼기 때문", "측정한 지표의 정의(코호트·분모)가 달랐기 때문 — 7일 이상 장기 재원 환자 기준 vs 모든 재원 기간의 지연 퇴원 병상 비율", "NHS England는 OPTICA 도입 트러스트만, Health Foundation은 미도입 트러스트만 분석했기 때문", "Palantir가 데이터를 공개하지 않았기 때문"], "answer": 1, "explanation": "OSR은 2026-08-10 서신에서 '7일 이상 코호트' 정의 차이를 핵심 방법론 차이로 지목했다. 그래서 교훈은 '파일럿 전에 지표 정의와 baseline을 합의하라'이다. Health Foundation은 도입 25개와 미도입 91개 트러스트를 '비교'했으므로 한쪽만 분석했다는 보기는 틀렸고, 나머지 보기는 본문 근거가 없다.", "difficulty": "advanced", "type": "understanding", "ref": "cases"}, {"q": "Lear 사례(사용자 100→16,000명, 유스케이스 4→280개, Palantir 콜 기준)가 가장 잘 보여주는 성장 메커니즘은?", "options": ["Foundry 좌석 라이선스를 대량 증설한 결과", "같은 플랫폼 위에서 유스케이스를 늘리고 사내 펠로십으로 빌더를 키운 land & expand", "Gotham으로 전환해 국방 수요를 흡수한 결과", "AI FDE가 유스케이스를 자동 생성한 결과"], "answer": 1, "explanation": "Lear는 2023년 소수 유스케이스로 시작해 사내 'American Tech Fellowship'으로 빌더를 키우며 유스케이스를 늘렸고 2025-09 5년 확장 계약을 맺었다. Palantir는 좌석 단위가 아닌 플랫폼 구독이고, Gotham·AI FDE 자동 생성은 본문 근거가 없다. 단 $30M 절감은 IDEA 프로그램 전체 수치라는 점도 기억할 것.", "difficulty": "basic", "type": "understanding", "ref": "cases"}, {"q": "모델 공급자를 GPT 계열에서 다른 모델로 바꾸려는 고객에게 AIP 안에서 권할 근거 기반 절차는?", "options": ["새 모델로 즉시 전환하고 사용자 불만을 모니터링한다", "AIP Evals suite(실제 케이스 + evaluator)로 두 모델의 정확도·비용을 비교하고, Global Branching 브랜치에서 검증 후 병합한다", "Pipeline Builder의 LLM 노드를 전체 재처리해 결과 파일을 육안 비교한다", "Model Catalog에서 기존 모델을 끄고 새 모델만 켠 뒤 Logic이 자동 적응하길 기다린다"], "answer": 1, "explanation": "Evals는 run·모델 간 비교와 분산 측정을 지원하고, Global Branching은 Logic·온톨로지 변경을 브랜치에서 검증·병합한다. AIP Evolve도 모델 마이그레이션을 이 경로로 제안한다. 즉시 전환·모델 끄기는 회귀를 놓치고, 전체 재처리 육안 비교는 비용만 크고 정량 근거가 없다. (Logic 함수 기준. Chatbot Studio는 Global Branching 지원 목록에 없으므로 버전 고정 + Evals 비교 + 단계적 publish로 대신한다.)", "difficulty": "advanced", "type": "application", "ref": "capabilities"}, {"q": "'AI FDE'에 대한 설명으로 옳은 것은?", "options": ["Palantir가 고객사에 파견하는 인간 엔지니어의 새 직함", "자연어로 Foundry(데이터 통합·온톨로지·함수 등) 플랫폼 자산을 만드는 에이전트로, 사용자 권한을 그대로 따르고 변경을 브랜치 제안·PR로 낸다", "Bootcamp 수료자에게 주는 자격증", "외부 에이전트가 온톨로지를 조회하는 MCP 서버"], "answer": 1, "explanation": "AI FDE는 2026-03 GA된 빌더 에이전트다. 인간 FDE를 대체하는 직함이 아니라 생산성 도구이며, 자격증은 AI Engineer 시험이 별도로 있고, 외부 에이전트용 MCP 서버는 Ontology MCP다.", "difficulty": "basic", "type": "recall", "ref": "capabilities"}, {"q": "이미 Databricks에 레이크하우스가 있는 고객이 'Palantir를 쓰면 데이터를 또 복사해야 하냐'고 묻는다. 가장 정확하고 정직한 답은?", "options": ["예, Foundry로 모든 원천 데이터를 이관해야 한다", "원천 테이블은 virtual table로 복사 없이 가리킬 수 있지만, 업무 객체로 쓰면 온톨로지 인덱스가 생기고 virtual table은 브랜치·버전 관리를 지원하지 않는다", "완전한 zero-copy라 Palantir 쪽에는 아무것도 저장되지 않는다", "Databricks와 Palantir는 기술적으로 연동되지 않는다"], "answer": 1, "explanation": "공식 문서상 virtual table은 원천을 가리키는 포인터이며 객체 backing도 가능하지만, 객체는 OSv2에 인덱싱되고 virtual table은 versioning·branching을 지원하지 않는다. '완전 zero-copy'는 과장, '전부 이관'과 '연동 불가'는 2025-03 파트너십과 문서에 반한다.", "difficulty": "intermediate", "type": "application", "ref": "capabilities"}, {"q": "Palantir FDE 면접의 Decomposition 라운드에서 후기들이 공통으로 지적하는 실패 패턴은?", "options": ["가정(assumption)을 명시적으로 말하는 것", "1분 만에 기술 솔루션으로 뛰어들거나, 컨설팅 케이스 프레임만 읊는 것", "데이터 모델과 데이터셋 조인을 그리는 것", "지표와 파일럿 계획을 제안하는 것"], "answer": 1, "explanation": "후기들은 '입력 → 데이터 모델 → 로직 → 출력 → 지표 → 파일럿'으로 쪼개고 가정을 명시하는 것을 높이 평가하고, 성급한 기술 제안과 컨설팅식 접근을 실패 요인으로 꼽는다. 나머지 보기는 오히려 좋은 답의 구성요소다.", "difficulty": "advanced", "type": "application", "ref": "voices"}, {"q": "Palantir의 성장이 '기존 고객 확장'에 크게 기대고 있음을 보여주는 회사 측 지표는?", "options": ["Rule of 40 155", "NDR(순매출유지율) 157%", "FedRAMP High 인가", "Forrester Wave Leader 선정"], "answer": 1, "explanation": "NDR 157%(Q2 2026, 콜 발언)는 기존 고객의 지출이 1년에 1.5배 이상 늘었다는 뜻으로 land & expand를 직접 보여준다. Rule of 40은 성장+수익성 종합 지표, FedRAMP·Forrester는 확장과 무관한 인증·평가다.", "difficulty": "intermediate", "type": "understanding", "ref": "overview"}, {"q": "규제가 엄격한 은행이 '특정 국가 내에서 자체 호스팅한 모델만 써야 한다'고 한다. AIP에서 가장 적절한 구성은?", "options": ["Model Catalog의 기본 모델만 사용하고 규제를 예외 처리한다", "자체 모델을 registered model(BYOM)로 등록해 Logic·Chatbot 등에서 쓰고, Markings allowlist로 민감 등급 데이터의 LLM 경로를 통제한다", "AIP를 쓰지 않고 Foundry만 쓴다", "Ontology MCP로 외부 호스팅 LLM에 연결한다"], "answer": 1, "explanation": "BYOM(2026-05 GA)은 법·규제 사유를 대표 사용 사례로 들며 플랫폼 전반에서 쓸 수 있다. 외부 호스팅 LLM 연결은 오히려 데이터 거버넌스가 외부로 넘어간다는 경고 대상이고, AIP를 포기하는 것은 요구를 충족하는 해법이 아니다.", "difficulty": "advanced", "type": "application", "ref": "capabilities"}, {"q": "구매 담당자가 AI 제안을 승인하면 SAP에 발주가 생성돼야 하고, SAP 호출이 실패하면 온톨로지 상태도 바뀌면 안 된다. 어떤 설계가 맞는가?", "options": ["Action에 side-effect webhook을 걸어 SAP를 호출한다", "Action에 writeback webhook을 걸어 SAP를 먼저 호출하고, 실패 시 Action 전체가 중단되게 한다", "Automate가 매일 밤 온톨로지 변경분을 CSV로 SAP에 업로드한다", "Workshop 위젯에서 SAP GUI를 임베드해 사람이 다시 입력한다"], "answer": 1, "explanation": "writeback webhook은 다른 rule보다 먼저 실행되고 실패하면 Action 전체가 중단돼 Ontology가 바뀌지 않는다. side-effect webhook은 edit 이후 best-effort로 실행돼 실패해도 온톨로지 변경이 남는다 — 가장 헷갈리는 오답. 야간 배치·수동 재입력은 요구(동기 일관성)를 만족하지 못한다.", "difficulty": "advanced", "type": "application", "ref": "playbook"}, {"q": "다음 중 'Logic'과 'Chatbot'을 고르는 기준으로 가장 적절한 것은?", "options": ["Logic은 개발자용, Chatbot은 비개발자용이다", "반복적인 판단을 타입이 정해진 출력·edit으로 자동화하고 Evals로 검증할 일은 Logic, 사람이 화면에서 묻고 탐색하며 Action을 확인하는 다회차 상호작용은 Chatbot", "Logic은 사내 모델만, Chatbot은 외부 모델만 쓸 수 있다", "Chatbot은 Action을 호출할 수 없으므로 읽기 전용 업무에만 쓴다"], "answer": 1, "explanation": "Logic은 단발성 LLM 함수로 Automate와 결합해 배치·판단 자동화에 쓰고, Chatbot은 세션 상태를 가진 대화형 도구로 Action 도구도 호출할 수 있다. 둘 다 노코드이고 모델 선택은 공통이므로 나머지 보기는 틀렸다. Chatbot도 함수로 publish하면 Evals·Automate에 쓸 수 있으므로 기준은 '도구 가능 여부'가 아니라 '상호작용 형태(단발·타입 출력 vs 다회차 대화)'다.", "difficulty": "intermediate", "type": "application", "ref": "playbook"}, {"q": "에이전트가 온톨로지의 '재고 수량' 속성을 수정한 뒤, 다음 날 ERP에서 새 재고 값이 들어왔는데 화면 값이 바뀌지 않는다. 가장 가능성 높은 원인은?", "options": ["Funnel 인덱싱이 고장 났다", "기본 충돌 정책 'Apply user edits' 때문에 편집된 속성은 원천 갱신보다 사용자/에이전트 값이 계속 우선한다", "LLM marking allowlist가 ERP 데이터를 차단했다", "virtual table이 브랜치를 지원하지 않기 때문이다"], "answer": 1, "explanation": "공식 문서상 기본 충돌 정책은 'Apply user edits'로, 한 번 edit된 속성은 이후 원천이 갱신돼도(원천을 바꾸고 재수집해도) 바뀌지 않는다. 대안은 ① 원천이 system of record인 속성은 Action에서 직접 edit하지 않고 writeback webhook만 호출한 뒤 재수집으로 반영하거나 ② 'Apply most recent value'(UTC timestamp 필요)로 바꾸는 것이며, 이미 생긴 edit은 개별 undo가 불가하다. allowlist는 LLM 호출 관문이고, virtual table 브랜치 제약은 이 현상과 무관하다.", "difficulty": "advanced", "type": "application", "ref": "playbook"}, {"q": "AIG 사례에서 'AI 효과'로 인용하기에 가장 적절한 지표는?", "options": ["Lexington 접수 건수 +26% (연차보고서)", "견적 시간 −55%·인수 건수 약 +40% (AIG CEO, Lexington 중견기업 재산 라인, 자체 수치)", "검토 3~4주 → 1일 미만 (2차 분석 정리)", "AIP 단독 기여로 확인된 매출 증가율"], "answer": 1, "explanation": "AIG CEO가 AIG Assist의 기여로 직접 밝힌 운영·전환 지표가 가장 적절하다(단, 자체 수치이고 Palantir 몫은 분리되지 않는다). 접수 +26%는 시장·영업 볼륨 지표, 3~4주→1일은 2차 정리 수치, 'AIP 단독 기여 매출'은 어떤 출처도 밝히지 않았다.", "difficulty": "intermediate", "type": "application", "ref": "cases"}], "sources": [{"id": "S1", "title": "AIP Overview (Palantir Foundry docs)", "url": "https://palantir.com/docs/foundry/aip/overview/", "publisher": "Palantir Technologies (공식 문서)", "date": "", "tier": "official", "confidence": "high"}, {"id": "S2", "title": "AIP features (applicat     document.querySelectorAll("#rail a, #chipbar a").forEach(function (a) {
      var on = a.getAttribute("data-id") === cur;
      if (on !== a.classList.contains("on")) {
        a.classList.toggle("on", on);
        if (on && a.parentNode === chipbar) chipbar.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
      }
    });
  }
  var ticking = false;
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(function () { spy(); ticking = false; }); } }, { passive: true });
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { drawFlows(false); }, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawFlows(true); });
  drawFlows(false); spy();
  // sections are built after load, so honor a #section deep link manually
  var hid = (location.hash || "").slice(1);
  function jump() { if (/^[\w.~-]+$/.test(hid) && document.getElementById(hid)) document.getElementById(hid).scrollIntoView(); }
  jump();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { requestAnimationFrame(jump); });
})();
</script>
