<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palantir AIP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
/* Layout: field-dossier — hero band, sticky section rail (desktop) / chip bar (phone), one reading column */
:root {
  --paper: #F2F5F4; --surface: #FFFFFF; --sunk: #E8EEEC; --ink: #15201E; --muted: #586764; --line: #D5DEDB;
  --accent: #0D6B61; --accent-ink: #FFFFFF; --accent-soft: #DCEEEA;
  --good: #1D7A3E; --good-soft: #DDF1E3; --warn: #9A6100; --warn-soft: #FBEFD5; --bad: #B4322A; --bad-soft: #F8E0DD;
  --p-black: #22272B; --p-red: #C0362C; --p-blue: #2459B8; --p-silver: #7D8A93; --p-gold: #B07D0A; --p-white: #FFFFFF;
  --lane-problem: #F8E0DD; --lane-source: #E6ECEA; --lane-solution: #D3ECE7; --lane-user: #DFE7F6; --lane-outcome: #E1F2E4;
  --lane-stroke: #9DB0AC;
  --f-display: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1413; --surface: #162020; --sunk: #1D2928; --ink: #E3ECEA; --muted: #93A5A1; --line: #2A3836;
  --accent: #4DB6A6; --accent-ink: #062320; --accent-soft: #173A35;
  --good: #6FCB8B; --good-soft: #17301F; --warn: #E2B154; --warn-soft: #33290F; --bad: #F08A80; --bad-soft: #3A1D1A;
  --p-black: #0A0D0F; --p-red: #E8665B; --p-blue: #6E9BEA; --p-silver: #A9B5BD; --p-gold: #D9A93A; --p-white: #F4F6F5;
  --lane-problem: #3A1F1C; --lane-source: #22302E; --lane-solution: #153B35; --lane-user: #1D2A40; --lane-outcome: #18321F;
  --lane-stroke: #4A5D59; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E1413; --surface: #162020; --sunk: #1D2928; --ink: #E3ECEA; --muted: #93A5A1; --line: #2A3836;
  --accent: #4DB6A6; --accent-ink: #062320; --accent-soft: #173A35;
  --good: #6FCB8B; --good-soft: #17301F; --warn: #E2B154; --warn-soft: #33290F; --bad: #F08A80; --bad-soft: #3A1D1A;
  --p-black: #0A0D0F; --p-red: #E8665B; --p-blue: #6E9BEA; --p-silver: #A9B5BD; --p-gold: #D9A93A; --p-white: #F4F6F5;
  --lane-problem: #3A1F1C; --lane-source: #22302E; --lane-solution: #153B35; --lane-user: #1D2A40; --lane-outcome: #18321F;
  --lane-stroke: #4A5D59; color-scheme: dark; }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.45rem, 2.6vw, 1.85rem); letter-spacing: -0.01em; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
ul { margin: 0; padding-left: 1.2em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Hero */
.hero { background: var(--surface); border-bottom: 1px solid var(--line); }
.hero-inner { max-width: 1180px; margin: 0 auto; padding-block: 40px 32px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.02em; margin-top: 6px; }
.hero .sub { color: var(--muted); font-size: 1.05rem; margin-top: 8px; max-width: 60ch; }
.hero .one { margin-top: 18px; font-size: 1.12rem; max-width: 62ch; border-left: 3px solid var(--accent); padding-left: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink); border: 1px solid transparent; white-space: nowrap; }
.score { text-align: right; }
.score .num { font-family: var(--f-display); font-weight: 800; font-size: 3.6rem; line-height: 1; color: var(--accent); }
.score .num small { font-size: 1.1rem; color: var(--muted); font-weight: 600; }
.score .lbl { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
.pass { display: inline-block; margin-top: 8px; font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.pass.fail { background: var(--warn-soft); color: var(--warn); }

/* Shell */
.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 40px; padding-block: 28px 80px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; display: flex; flex-direction: column; gap: 2px; }
.rail a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-size: 0.92rem; display: flex; justify-content: space-between; gap: 8px; }
.rail a .n { font-family: var(--f-mono); font-size: 0.75rem; }
.rail a:hover { background: var(--sunk); color: var(--ink); }
.rail a.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.chipbar { display: none; }
main { min-width: 0; display: flex; flex-direction: column; gap: 64px; }
section { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.lede { color: var(--muted); max-width: 68ch; }
.read { max-width: 70ch; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.label { font-size: 0.78rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
  .rail { display: none; }
  .chipbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; gap: 6px; overflow-x: auto; padding-block: 10px; background: var(--paper); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .chipbar a { flex: none; text-decoration: none; font-size: 0.85rem; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .chipbar a.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .hero-inner { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .score { text-align: left; }
}

/* Segmented tabs */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fbtn { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 0.84rem; color: var(--muted); }
.fbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Brief */
.brief-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .brief-grid { grid-template-columns: minmax(0, 1fr); } }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 0.92rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.must { counter-reset: m; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.must li { counter-increment: m; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }
.must li::before { content: counter(m); font-family: var(--f-mono); font-size: 0.8rem; color: var(--accent-ink); background: var(--accent); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; margin-top: 3px; }
.analogy { background: var(--accent-soft); border-radius: var(--r); padding: 16px 20px; }

/* Timeline (history) */
.tl { list-style: none; padding: 0; display: flex; flex-direction: column; border-left: 2px solid var(--line); margin-left: 6px; }
.tl li { position: relative; padding: 0 0 14px 20px; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; }
.tl li::before { content: ""; position: absolute; left: -7px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl .d { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); padding-top: 2px; }
@media (max-width: 520px) { .tl li { grid-template-columns: minmax(0, 1fr); gap: 0; } }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; min-width: 560px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.78rem; color: var(--muted); font-weight: 700; background: var(--sunk); }
tr:last-child td { border-bottom: 0; }

/* Capabilities */
.mod { cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; width: 100%; font: inherit; color: inherit; }
.mod:hover { border-color: var(--accent); }
.mod .cat { font-size: 0.75rem; color: var(--accent); font-weight: 600; }
.mod .more { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 0.92rem; }
.mod .hint { font-size: 0.78rem; color: var(--muted); margin-top: auto; }
.kv { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; }
.kv b { font-size: 0.78rem; color: var(--muted); padding-top: 2px; }

/* Diagram */
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; overflow-x: auto; }
.diagram svg { display: block; margin: 0 auto; }
.diagram .cap { font-size: 0.85rem; color: var(--muted); margin-top: 6px; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.78rem; color: var(--muted); justify-content: center; margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--lane-stroke); }

/* Playbook */
.search { width: 100%; max-width: 360px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.concept { display: flex; flex-direction: column; gap: 8px; }
.concept .term { font-weight: 700; font-size: 1.02rem; }
.say { background: var(--sunk); border-radius: 8px; padding: 8px 12px; font-size: 0.92rem; }
.say::before { content: "고객에게: "; font-weight: 700; color: var(--accent); }
.steps { list-style: none; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; }
.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--f-mono); color: var(--accent); font-weight: 500; padding-top: 1px; }
.phases { display: flex; gap: 0; overflow-x: auto; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.phases button { flex: 1 0 140px; border: 0; border-right: 1px solid var(--line); background: transparent; padding: 12px 14px; text-align: left; cursor: pointer; }
.phases button:last-child { border-right: 0; }
.phases button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.phases .pn { font-family: var(--f-mono); font-size: 0.72rem; opacity: 0.8; display: block; }
.phases .pt { font-weight: 700; display: block; }
.phase-body { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
details.acc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.acc summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; gap: 10px; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::before { content: "+"; font-family: var(--f-mono); color: var(--accent); width: 14px; flex: none; }
details.acc[open] summary::before { content: "−"; }
details.acc > div { padding: 0 16px 14px 40px; color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.qlist { list-style: none; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.qlist li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 0.93rem; }
.res a { display: flex; gap: 10px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.res a:hover { border-color: var(--accent); }
.tag { font-family: var(--f-mono); font-size: 0.7rem; padding: 1px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); flex: none; text-transform: uppercase; }

/* Cases */
.case { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.case-head { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; padding: 16px 20px; display: grid; grid-template-columns: 86px minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.case-head .dt { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); padding-top: 3px; }
.case-head .co { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; }
.case-head .ti { color: var(--muted); font-size: 0.95rem; }
.case-head .hl { margin-top: 6px; font-weight: 600; color: var(--accent); }
.case-head .tgl { font-family: var(--f-mono); color: var(--muted); font-size: 1.2rem; }
.case-body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
@media (max-width: 600px) { .case-head { grid-template-columns: minmax(0, 1fr) auto; } .case-head .dt { grid-column: 1 / -1; padding: 0; } }
.chain { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.chain button { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.chain button .k { font-family: var(--f-mono); font-size: 0.68rem; color: var(--muted); }
.chain button .v { font-weight: 700; font-size: 0.88rem; }
.chain button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chain button[aria-selected="true"] .k { color: var(--paper); opacity: 0.7; }
.chain button.inf .v::after { content: "추정"; font-size: 0.62rem; font-weight: 600; margin-left: 4px; padding: 0 4px; border-radius: 3px; background: var(--warn-soft); color: var(--warn); vertical-align: 2px; }
@media (max-width: 600px) { .chain { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.chain-text { background: var(--paper); border-radius: 8px; padding: 14px 16px; min-height: 64px; }
.chain-all { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.chain-all > div { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; font-size: 0.93rem; }
.chain-all > div.inf { border-left-color: var(--warn); }
.metrics { display: flex; flex-wrap: wrap; gap: 10px; }
.metric { background: var(--good-soft); border-radius: 8px; padding: 8px 14px; min-width: 120px; }
.metric .mv { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; color: var(--good); font-variant-numeric: tabular-nums; }
.metric .ml { font-size: 0.8rem; color: var(--ink); }
.metric .mn { font-size: 0.72rem; color: var(--muted); }
.hook { border: 1px dashed var(--p-gold); border-radius: 8px; padding: 10px 14px; font-size: 0.93rem; }
.hook::before { content: "영업 한 줄 · "; font-weight: 700; color: var(--p-gold); }
.case-img { margin: 0; }
.case-img img { border-radius: 8px; border: 1px solid var(--line); display: block; max-width: 100%; }
.case-img figcaption { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
.conf { font-size: 0.72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.conf.high { background: var(--good-soft); color: var(--good); }
.conf.medium { background: var(--accent-soft); color: var(--accent); }
.conf.low { background: var(--warn-soft); color: var(--warn); }
.conf.unverified { background: var(--bad-soft); color: var(--bad); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; }
.ghost:hover { border-color: var(--accent); }
.count { font-size: 0.85rem; color: var(--muted); }

/* Voices */
.voice { display: flex; flex-direction: column; gap: 8px; }
.voice .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.voice .who { font-size: 0.8rem; color: var(--muted); }
.voice .rn { font-size: 0.82rem; border-top: 1px dashed var(--line); padding-top: 8px; color: var(--muted); }
.voice .rn b { color: var(--p-red); }
.sent { font-size: 0.72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.sent.positive { background: var(--good-soft); color: var(--good); }
.sent.negative { background: var(--bad-soft); color: var(--bad); }
.sent.mixed { background: var(--warn-soft); color: var(--warn); }
.sent.neutral { background: var(--sunk); color: var(--muted); }

/* Perspectives */
.roles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 700px) { .roles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.role-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.role-btn .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); }
.role-btn .rn { font-weight: 700; font-size: 0.92rem; }
.role-btn .rr { font-size: 0.72rem; color: var(--muted); text-align: center; line-height: 1.3; }
.role-btn[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.role-panel { border-top: 4px solid var(--rc, var(--accent)); }
.role-panel .hd { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; }
.role-panel ul { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

/* Quiz */
.quiz { display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.qcard { display: flex; flex-direction: column; gap: 14px; }
.qmeta { display: flex; gap: 6px; flex-wrap: wrap; }
.qtext { font-size: 1.12rem; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 11px 14px; text-align: left; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .ol { font-family: var(--f-mono); font-weight: 500; color: var(--muted); }
.opt.right { background: var(--good-soft); border-color: var(--good); }

않으므로 하류 보호는 Markings로 해야 한다 — 실무 함정 1순위다 [S5].", "**4) 어떻게 배포·판매되나**: Apollo(지속 배포)와 Rubix(하드닝된 Kubernetes) 위에서 Palantir 호스팅 SaaS, OCI 등 클라우드, 온프렘·에어갭·기밀망(IL5/IL6, FedRAMP High)까지 같은 배포 모델로 간다 [S31, S32, S34, S35]. 판매는 1~5일 **AIP Bootcamp**로 고객 데이터에 실제 워크플로를 만든 뒤 파일럿→엔터프라이즈 계약으로 확장하는 방식이며, 공개 정가는 없다 [S52, S54]. 회사는 이 모델이 2026 Q2 미국 상업 매출 +149%로 이어졌다고 설명한다(회사 발표) [S190]. 고객 측 근거도 있다: AIG CEO는 AIG Assist의 견적 시간 −55%·인수 +40% 기여를 공개하고 다음 단계 멀티 에이전트를 Palantir·Anthropic과 함께 만든다고 밝혔으며 [S264], Palantir 플랫폼 기반 국방 AI Maven의 사용자는 10만 명을 넘었다 [S262]. 다만 대부분 자체 발표이므로 범위를 붙여 말한다."], "analogy": "AIP는 **'똑똑한 신입사원(LLM)에게 회사 지도·사원증·결재라인·업무일지를 한꺼번에 주는 온보딩 시스템'**이다. 지도 = 온톨로지(무엇이 어디 있고 서로 어떻게 연결되나), 사원증 = 권한·Markings(볼 수 있는 것만 본다), 결재라인 = Action + 사람 승인(아무거나 바꾸지 못한다), 업무일지 = 감사 로그·Evals(무엇을 왜 했는지 남고 품질을 잰다). 신입이 아무리 똑똑해도 이 네 가지가 없으면 회의록 요약만 하게 된다.", "why_learn": "2026년 엔터프라이즈 AI의 병목은 모델 성능보다 **'데이터→결정→실행'을 권한 안에서 잇는 일**로 옮겨 가고 있고, AIP는 그 계층(온톨로지)을 앞세운 대표 제품이다. 회사는 AIP·Bootcamp를 미국 상업 매출 가속(Q2 2026 +149%)의 원인으로 설명한다(회사 설명) [S190, S59]. FDE라는 직무 자체가 Palantir에서 시작돼 OpenAI·Anthropic·Databricks까지 퍼졌고 [S141], 한국에서도 HD현대 그룹 확대·KT premium partner 등 수요가 생겼다 [S93, S96]. 결정 단위로 문제를 쪼개는 Decomposition, 명사+동사로 업무를 모델링하는 온톨로지 사고, Evals로 품질을 재는 습관, HITL 자동화 설계는 어느 회사 FDE 면접에서도 그대로 쓰이는 역량이며, 2026-08 신설된 AI Engineer 자격은 이 역량이 공식 직무 체계가 됐다는 신호다 [S163, S29].", "must_know": ["**온톨로지가 핵심이다**: AIP의 모든 도구(Logic, Chatbot, Agents, Automate, OSDK, MCP)는 온톨로지를 읽고 Action으로 쓴다. 'LLM 래퍼'가 아니라 '운영 모델 + LLM'으로 설명하라 [S3, S18].", "**2026년 용어 변화**: AIP Agent Studio → **AIP Chatbot Studio**(2026-04 공지), AIP Agents → AIP Chatbots [S44]. 공식 용어상 Chatbot과 구분되는 'agent'는 pro-code agent(Claude Agent SDK·OpenAI Agents SDK·Google ADK 템플릿)이며 [S47], AI FDE 같은 플랫폼 에이전트도 같은 범주로 볼 수 있다(해석).", "**쓰기 = Action + HITL + webhook**: 에이전트의 쓰기는 Action을 통해 Ontology에 edit으로 기록되고, 원천 시스템(SAP 등) 반영은 Action의 writeback webhook으로 별도 설계한다. Automate는 edit을 자동 적용하거나 Proposals로 staging해 사람이 승인하게 한다 [S10, S230].", "**배포 = Bootcamp → Pilot → Production → Expand**: Bootcamp는 1~5일, 고객 데이터로 작동하는 유스케이스와 MVP 계획을 낸다 [S52]. 실제 일정은 Bootcamp보다 데이터 연결·보안 승인이 좌우한다(현장 관행). Apollo는 플랫폼 소프트웨어를 SaaS부터 에어갭까지 배포하고, 고객이 만든 유스케이스 자산은 Global Branching·DevOps로 승격·복제한다 [S31, S239].", "**사례는 숫자·출처·범위를 같이 말하라**: AIG CEO는 AIG Assist가 Lexington 중견기업 재산 라인에서 견적 시간 −55%·인수 건수 약 +40%에 기여했다고 밝혔다(AIG 자체 수치, 접수 +26%는 별개의 볼륨 지표) [S264, S81]. Lear는 사용자 11,000명+·유스케이스 175개+를 직접 발표했다 [S71]. NHS FDP(Foundry 기반)는 지표 정의·baseline 추세를 두고 효과가 논쟁 중이다 [S247, S249]. 수치마다 '누가, 어느 범위로'와 'Foundry 성과인지 AIP 성과인지'를 붙여라.", "**비판에는 3단으로 답하라 — 인정 → 2026 현황 → 내 방식**: 예) '온톨로지는 새 개념이 아니다'(인정) → '새로운 건 그 모델이 권한·Action·감사와 묶여 LLM의 도구 인터페이스가 된다는 점'(현황) → '그래서 저는 결정 하나와 baseline부터 잡겠습니다'(내 방식) [S149, S18, S144]. 또 다른 예: '비싼 컨설팅 아니냐'(인정: 초기 FDE 비중이 크다) → (현황: 일회성 해결이 제품으로 환류되고 AI FDE가 반복 작업을 가져가며, adj. 영업이익률 62%) → (내 방식: 확장 단계마다 내부 빌더 인계 계획을 넣겠다) [S141, S15, S190]."], "key_facts": [{"label": "발표", "value": "2023-04 (군사 시나리오 데모와 함께 공개) [S220]"}, {"label": "기반", "value": "Foundry(데이터 운영) + Apollo(지속 배포) + Ontology [S1]"}, {"label": "빌더 도구", "value": "AIP Logic · Chatbot Studio(구 Agent Studio) · Evals · Automate [S1, S44]"}, {"label": "2026 GA 신기능", "value": "AI FDE(3월), AIP Analyst(4월), BYOM·Global Branching(5월), Palantir/Ontology MCP(6월), AIP Evolve(9월) [S43, S45, S46, S49]"}, {"label": "배포 형태", "value": "Palantir 호스팅 SaaS, OCI·프라이빗/소버린 클라우드, 온프렘·에어갭·엣지 [S35, S36, S33]"}, {"label": "미 정부 인가", "value": "FedRAMP High(2024-12, AIP 포함), DoD IL5·IL6 [S34]"}, {"label": "Q2 2026 실적", "value": "매출 $1.935B(+93% YoY), 미국 상업 $764M(+149%), 해외 상업 $182M(+26%), Rule of 40 155 [S190, S64]"}, {"label": "고객 수", "value": "Q1 2026 전체 1,007·미국 상업 615(콜 발언) → Q2 2026 미국 상업 653(콜 발언, 전사본) [S193, S64]"}, {"label": "채택 신호", "value": "Maven Smart System 활성 사용자 20,000+(2025-05) → 사용자 100,000+(2026-09, 정의 상이), NATO 도입(2025-03 계약). AIP 명시 문구는 없음 [S259, S262, S260]"}, {"label": "확장 지표", "value": "NDR 157%(Q2 2026, 콜 발언), $1M+ 딜 220건·$10M+ 딜 73건(분기) [S196, S190]"}, {"label": "FY2026 가이던스", "value": "매출 $8.150–8.158B (2026-08 상향) [S190]"}, {"label": "GTM", "value": "AIP Bootcamp 1~5일, 2024-06까지 1,300회 이상. 2025~26 공식 횟수는 미공개 [S52, S53]"}]}, "overview": {"summary": ["**요지**: AIP는 독립 제품이라기보다 Palantir 플랫폼(Foundry·Gotham·Apollo) 위에 얹힌 **AI 계층**이며, 공통 분모는 온톨로지다. 공식 문서도 AIP가 'Ontology와 개발자 툴체인 위에서' 동작한다고 설명한다 [S1, S3]. 따라서 공개 사례의 성과가 Foundry(데이터 통합·운영 앱)에서 나온 것인지 AIP(LLM·에이전트)에서 나온 것인지 구분해서 읽어야 한다.", "Palantir는 2003년 창업해 정보·국방용 Gotham으로 시작했고, 상업용 Foundry와 배포 플랫폼 Apollo를 거쳐 2023-04 AIP를 발표했다 [S221, S220]. 경영진은 AIP와 Bootcamp를 미국 상업 매출 가속의 원인으로 직접 지목해 왔고 [S59], 2026 Q2에는 전체 매출 +93%, 미국 상업 +149%를 기록했다(회사 발표). 반면 해외 상업은 +26%에 그쳐 지역 간 격차가 크다 [S190, S64].", "2025-11~2026-10 사이 AIP는 '챗봇 빌더'에서 **에이전트가 플랫폼 자체를 만들고 개선하는 단계**로 이동했다 — AI FDE(자연어로 Foundry 조작), AIP Evolve(AI FDE 에이전트 무리가 AI 시스템 개선), 외부 에이전트를 온톨로지에 붙이는 Ontology MCP 등 [S15, S48, S17]. 2023년 출시 데모가 '환각을 어떻게 막는지 설명하지 않았다'는 비판을 받았던 것과 달리 [S169], 2025~26년에는 Evals Experiments·Observability·marking allowlist 같은 품질·통제 기능이 잇달아 나왔다 [S38, S39, S50]."], "history": [{"date": "2003", "event": "Peter Thiel, Alex Karp 등이 Palantir 공동 창업, In-Q-Tel 초기 투자 [S221]"}, {"date": "2020-09", "event": "NYSE 직상장(Direct Listing) [S221]"}, {"date": "2022-10", "event": "DISA로부터 IL6 잠정 인가 — Apollo 기반 배포 모델 [S33]"}, {"date": "2023-04", "event": "AIP 발표(T-80 전차 시나리오 군사 데모) [S220]"}, {"date": "2023-11", "event": "AIP Bootcamp를 핵심 GTM으로 선언, 출시 5개월 만에 약 300개 조직 사용 [S51]"}, {"date": "2024-06", "event": "AIP Bootcamp 누적 1,300회 이상 [S53]"}, {"date": "2024-08", "event": "Microsoft와 기밀망(IL6/TS)에서 Azure OpenAI + AIP 연동 발표, Forrester Wave AI/ML Platforms Leader(Palantir 발표) [S204, S210]"}, {"date": "2024-09", "event": "S&P 500 편입 [S222]"}, {"date": "2024-12", "event": "FedRAMP High 인가(AIP 포함 전 제품) [S34]"}, {"date": "2025-03", "event": "Databricks 전략 파트너십(Unity Catalog ↔ Ontology) [S205]"}, {"date": "2025-07", "event": "미 육군 Enterprise Agreement(10년, 상한 $10B, 계약 75건 통합) [S85]"}, {"date": "2025-10", "event": "Snowflake(Iceberg zero-copy), NVIDIA(Nemotron·CUDA-X) 파트너십 [S207, S208]"}, {"date": "2025-11", "event": "AI FDE·AIP Analyst 베타, Ontology/AIP Observability [S39]"}, {"date": "2026-03", "event": "AI FDE GA, Ontology MCP–Microsoft Copilot Studio 연동 [S43]"}, {"date": "2026-04", "event": "AIP Agent Studio → AIP Chatbot Studio 개명, AIP Analyst GA [S44, S43]"}, {"date": "2026-05", "event": "Global Branching GA, BYOM(registered models) GA [S45]"}, {"date": "2026-06", "event": "Palantir MCP·Ontology MCP GA, 구 객체 저장소(OSv1) 지원 종료 [S46, S231]"}, {"date": "2026-07", "event": "Pro-code agents(Claude Agent SDK·OpenAI Agents SDK·Google ADK 템플릿) [S47]"}, {"date": "2026-08", "event": "Associate 자격 개편, AI Engineer 시험 신설(2026-08-03 시작) [S29]"}, {"date": "2026-09", "event": "AIP Evolve GA [S49]"}, {"date": "2026-10", "event": "LLM 데이터 접근 marking allowlist(Control Panel) [S50]"}], "business_model": "공개 정가 없는 **협상형 다년 플랫폼 구독**이 기본이다(좌석 단위가 아님). LLM 토큰은 공식 문서상 compute-seconds로 환산돼 계량되고 [S235], 라이선스 협상 컨설팅사 Redress Compliance의 단독 추정(구매자 측 협상 대행이라는 이해관계 있음)으로는 첫 엔터프라이즈 계약이 연 $0.5–2M 수준이다 [S54]. 회사 측 숫자로 보면 NDR 157%(콜 발언), 상위 20개 고객 평균 TTM 매출 $124M(콜 발언)으로 '작게 들어가 크게 넓히는(land & expand)' 구조가 뚜렷하다 [S196, S64]. Bootcamp가 계약으로 이어진 예도 콜에서 반복된다(고객 익명, 벤더 발표): 5일 Bootcamp 뒤 약 $3M 계약 [S59], Bootcamp 5주 뒤 $26M ACV 엔터프라이즈 계약 [S69], 유틸리티 ACV $7M→$31M [S66]. FDE·Deployment Strategist 인력이 판매·구현 비용의 큰 몫이라 '소프트웨어냐 컨설팅이냐' 논쟁이 있지만 [S147, S148], Q2 2026 adj. 영업이익률 62%·adj. FCF 마진 63%는 노동집약형 서비스 기업과는 다른 수익 구조로 보인다(회사 8-K) [S190].", "positioning": "Palantir는 AIP를 'AI 모델'이 아니라 **'AI를 운영에 연결하는 운영체제'**로 포지셔닝한다. 비판자도 인정하는 핵심 논지는 '온톨로지가 LLM에게 업무 객체·행동 API를 준다'는 것이다 [S144, S148]. 데이터 플랫폼(Databricks·Snowflake)과는 경쟁하면서도 연동하고(코피티션), 모델 회사는 공급자로 품는다 — AIG 투자자의 날에는 Palantir·Anthropic CEO가 함께 등장했다 [S205, S207, S20, S79]. **구매자별 메시지**: ① 경제적 구매자(COO·CFO)에게는 'AI 효과를 운영 KPI로 측정하고, 온톨로지를 재사용해 인접 유스케이스를 빠르게 올린다'(Palantir의 논리, 예: Lear 4개→280개, Palantir 콜 [S66]), ② 기술 평가자(CIO·CISO)에게는 '원천 테이블은 레이크하우스에 두고(virtual table) 업무 객체 인덱스만 Palantir에, 모델은 선택·BYOM, Markings·감사 로그 그대로, 에어갭까지 같은 배포 모델', ③ 현업 사용자에게는 '새 툴이 아니라 내가 원래 결정하던 화면에 AI 제안과 승인 버튼이 붙는다' [S205, S21, S22, S31, S24]. 2026년 경영진 메시지는 'sovereign AI'(고객이 특정 LLM 랩에 종속되지 않음)와 'FDE는 Palantir만 가진다'이다 — 회사 주장이므로 면접에서는 근거와 반론을 함께 준비하라 [S64].", "competitors": [{"name": "Databricks (Mosaic AI · Agent Bricks · Apps · Lakebase)", "category": "레이크하우스 + 에이전트/ML 빌더", "difference": "데이터·모델 엔지니어링 계층이 중심(Unity Catalog, MLflow, Agent Bricks의 합성데이터 기반 자동 최적화) [S223]. 2026년 기준 운영 앱(Databricks Apps, 2025-06 GA)과 OLTP(Lakebase, 2026-01 GA — 2026-02 기준 AWS GA·Azure beta)도 갖췄으므로 '운영 앱 계층이 없다'는 말은 틀리다 [S277, S275, S278]. 정확한 차이는 **권한·검증·감사가 붙은 선언적 Action/의미 계층이 플랫폼에 내장돼 있느냐**이며, Databricks에서는 그 로직을 앱 코드로 직접 짠다.", "when_to_choose": "자체 데이터·ML 엔지니어링 조직이 강하고 개방형·사용량 과금을 원할 때. 대기업은 둘 다 쓰는 경우가 많고 2025-03부터 공식 연동, Databricks는 공동 고객이 150곳 이상이라고 주장(벤더 주장) [S205, S206]."}, {"name": "Snowflake (Cortex · Snowflake Intelligence)", "category": "데이터 클라우드 + SQL 중심 AI/분석 에이전트", "difference": "semantic view와 Cortex Search 위의 질의·분석 중심. AIP는 운영 결정의 실행(Action)과 HITL 승인까지 다룸 [S224, S207].", "when_to_choose": "주 사용자가 분석가·BI이고 데이터가 이미 Snowflake에 있을 때. 2025-10부터 Iceberg 기반 양방향 연동 [S207]."}, {"name": "Microsoft (Fabric · Copilot Studio · Foundry)", "category": "하이퍼스케일러 풀스택 + M365 배포 채널", "difference": "셀프서비스·좌석 기반 대규모 확산과 M365 접점이 강점. Palantir는 FDE high-touch 구현과 Action 중심 온톨로지가 강점(개인 분석 기반) [S227]. Microsoft도 **Fabric IQ**(Ignite 2025 발표, Build 2026 GA 발표)로 온톨로지 계층을 들여왔고 Operations agent는 'governed action'을 트리거한다 [S272, S273, S270]. 다만 ontology item은 2026-10 기준 문서상 preview이고, 현재 문서에서는 Palantir Action type 수준의 선언적 write-back을 확인하지 못했다(초기 발표는 온톨로지가 'actions'를 정의한다고 설명) [S271, S272]. 즉 '온톨로지 자체'는 더 이상 Palantir만의 것이 아니며, 실제 차이는 Action·write-back·HITL·에어갭 배포까지 하나의 권한 모델로 묶었는지다.", "when_to_choose": "이미 Microsoft EA·M365·Azure를 쓰고 범용 생산성 copilot이 목적일 때. 국방·기밀망에서는 파트너(Azure OpenAI in AIP) [S204], Ontology MCP로 Copilot Studio와 연동 [S43]."}, {"name": "AWS Bedrock AgentCore / Google Gemini Enterprise", "category": "클라우드 에이전트 부품(런타임·메모리·ID) / 좌석형 업무 에이전트", "difference": "AgentCore는 프레임워크 무관 부품 모음이라 의미 계층·운영 앱은 고객이 직접 만든다. Gemini Enterprise는 좌석당 과금(Business $21, Standard/Plus $30부터, 2차 출처)의 지식근로자용 에이전트 [S225, S226].", "when_to_choose": "내부 엔지니어링 역량이 강해 직접 조립(build)하려 하거나, 전 직원 대상 범용 에이전트를 빠르게 배포하려 할 때."}, {"name": "SAP Business Data Cloud + Joule Agents", "category": "ERP 벤더의 데이터 기반 + 업무 에이전트", "difference": "SAP 업무 맥락(Knowledge Graph)과 Joule 에이전트를 SAP 프로세스 안에서 제공하며, 2026-05에는 BDC를 HANA Cloud·Databricks·Snowflake 위의 데이터 기반으로 확장했다 [S280, S281]. AIP는 SAP 외 시스템(MES·센서·레거시)까지 가로지르는 운영 모델을 겨냥하고, 동시에 SAP Endorsed App으로 SAP 마이그레이션에 협력한다 [S105].", "when_to_choose": "고객 업무의 대부분이 SAP 안에서 끝나는 SAP 중심 기업. Palantir와는 경쟁이자 파트너(코피티션)."}, {"name": "SI 자체 구축 (오픈소스 프레임워크 + 클라우드 LLM)", "category": "직접 조립", "difference": "초기 비용·통제권이 장점. 통합·거버넌스·write-back·배포를 직접 조립해야 하며, 실무자들은 '각 부품은 있지만 엮는 것이 어렵다'고 지적 [S146]. 컨설팅사는 Palantir TCO가 자체 구축의 3–8배라고 주장한다(미검증, 산정 기준 불명) [S54] — 고객이 꺼내면 '통합·거버넌스 조립 비용까지 같은 범위로 비교하자'고 답한다.", "when_to_choose": "국내 SI 시장에서 가장 흔한 실제 경쟁안. 유스케이스가 단일 시스템 안에서 끝나고 내부 개발 역량이 충분할 때."}, {"name": "C3.ai", "category": "산업별 사전 구축 Enterprise AI 앱", "difference": "'AI-first' 패키지 앱(예지정비·공급망)을 꽂아 쓰는 방식 vs Palantir의 'data-first' 범용 온톨로지 위 조립 방식 [S228].", "when_to_choose": "특정 산업 유스케이스를 패키지로 빨리 들이고 싶을 때. 최근 매출 감소·리더십 교체기라는 점은 리스크 [S228]."}, {"name": "Salesforce Agentforce / ServiceNow", "category": "SaaS 애플리케이션 내장형 에이전트", "difference": "해당 SaaS(CRM, ITSM)의 데이터·프로세스 안에서 작동. AIP는 ERP·MES·센서·레거시를 가로지르는 운영 결정을 겨냥 [S214].", "when_to_choose": "유스케이스가 고객 서비스·영업·IT 헬프데스크처럼 그 SaaS 안에서 끝날 때."}], "limitations": ["**학습 곡선과 고유 용어**: 긍정 리뷰어조차 가파른 학습 곡선, Palantir 고유 용어·프로젝트 모델을 단점으로 꼽는다 [S151, S152, S161]. → 2026 현황: Speedrun(60~90분), 자연어로 Foundry를 조작하는 AI FDE, Claude Code·Cursor용 Palantir MCP로 진입로가 짧아졌다 [S27, S15, S16]. 면접에서는 '어렵기 때문에 직접 해 본 경험이 차별화'로 바꿔 말하라.", "**비용·가격 불투명성**: 공개 정가가 없고 협상 기반이라 승인받기 어렵다는 리뷰가 반복된다 [S151, S54]. 모델 선택만으로 토큰 비용이 약 20배 차이 날 수 있다(공식 환산표) [S235]. → 2026 현황: 추가 비용 없는 reserved capacity, 토큰 사용량 export, 사용자별 rate limit, 에이전트별 비용 귀속이 추가됐다 [S41, S45, S47, S193].", "**락인과 데이터 반출 제약**: 온톨로지가 Bootcamp 단계부터 쌓이면서 전환 비용이 커진다는 지적(컨설팅사·커뮤니티) [S54, S143, S149]. → 2026 현황: 원천 데이터는 virtual table로 고객 레이크하우스에 둘 수 있지만 [S234], 온톨로지 정의·Logic·Workshop 앱을 다른 플랫폼으로 옮기는 표준은 없다 — 완화됐지만 해소되지 않은 리스크다.", "**'SaaS 옷을 입은 컨설팅' 비판**: 가치가 FDE 노동과 온톨로지 유지보수에 의존한다는 주장(Michael Burry — 공매도 포지션 보유, Vonng, Donald Farmer) [S147, S149, S150]. → 반론: FDE의 일회성 해결이 제품으로 환류되는 구조[S141, S142], AI FDE·Evolve GA, 62% 영업이익률 [S15, S49, S190]. 단, 'SAP를 대체하지 않고 그 위에 얹힌다'는 Burry의 사실 전제는 정확하며 그것이 곧 포지셔닝이다.", "**에이전트 도구 성숙도**: Agent Studio가 빠르게 변하는 오픈 에이전트 프레임워크보다 제한적이라는 리뷰(표본 6, 신뢰도 낮음) [S154]. → 2026 현황: pro-code agents(Claude Agent SDK 등 템플릿)와 MCP GA로 상당 부분 대응 [S47, S46].", "**성과 검증의 비대칭**: 공개 사례 수치는 대부분 벤더·고객 자체 발표이고, Foundry 성과와 AIP 성과가 분리되지 않는 경우가 많다. 독립 평가가 있는 Palantir 사례인 NHS FDP(Foundry 기반)에서는 효과가 논란이다 [S247, S249]. Lear(IDEA 프로그램 전체)와 Tampa General(초기 Foundry 파일럿)은 기여분이 분리되지 않는다 [S71, S75]. AIG는 CEO가 AIG Assist의 기여(견적 −55%, 인수 +40%)를 밝힌 드문 예외지만 자체 수치이고 Palantir/AIP 몫은 따로 없다 [S264]. → 대응: 수치를 출처·범위·Foundry/AIP 구분과 함께 말하고, 파일럿 전에 baseline과 Evals를 설계하는 것 자체가 FDE 역량이다.", "**지역·고객군 편중**: Q2 2026 미국 상업 +149%에 비해 해외 상업은 $182M(+26%)로 격차가 크고(Q1도 +26%) [S291, S64], 미국 정부 매출($809M)이 전체의 약 42%를 차지해 예산·정치 리스크가 있다 [S190]. 경영진은 격차의 직접 원인을 설명하지 않았고, Karp는 유럽 대륙을 비판하며 미국 수요조차 다 소화하지 못하는 용량 한계를 언급했다(콜 발언) [S257]. 한국에는 공식 법인 발표가 확인되지 않으며 상업 연결고리는 KT(파트너)·HD현대(고객)다. 확인한 서울 FDSE 공고는 미 정부(주한미군) 지원 역할로 명시돼 있다 [S298, S299, S296]. 한국·유럽 고객을 맡을 FDE라면 알아야 할 맥락이다. → 해외 현황: 격차는 사실이지만 HD현대 그룹 계약(2026-01), NATO Maven 도입(2025), Stellantis 5년 갱신·AIP 확장(2026-03), bp 파트너십 위 AIP 추가처럼 큰 해외 레퍼런스는 늘고 있다 [S255, S260, S106, S88].", "**평판·윤리 이슈**: 이민 단속(ICE)·국방 활용을 둘러싼 엔지니어 커뮤니티의 반감이 채용·고객 설득에 변수로 작용한다 [S167, S168]. 회사는 Privacy & Civil Liberties 엔지니어링 조직·외부 자문위원회를 두고 '데이터를 팔거나 채굴하는 회사가 아니다'라고 밝히며, 2026 위임장 설명서에서 ICE 계약을 방어했다 [S282, S283, S289]. 반면 EFF는 인권 질문에 법적 준수 논리로만 답한다고 비판한다 [S287]. 면접에서 'Why Palantir?'에 양쪽 사실을 알고 자기 가치관으로 답할 준비가 필요하다.", "**밸류에이션 논쟁**: trailing P/S 약 62–67배(2026-05, 주가 약 $130 기준), Citron 적정가 약 $40 주장(2025-08) 등 [S213, S215]. 면접에서 직접 묻지는 않더라도 '성장이 지속될 이유'를 물으면 대비가 필요하다."]}, "capabilities": {"intro": "**요지**: AIP의 기능은 '온톨로지를 중심으로 한 4개 층'으로 외우면 된다 — ① 데이터를 온톨로지로 만드는 층(Data Connection·virtual table·Pipeline Builder·Document Intelligence), ② LLM 로직·에이전트를 만드는 층(Logic·Chatbot Studio·Pro-code agents·Evals), ③ 실행·소비 층(Action·Automate·Workshop·OSDK·Analyst·MCP), ④ 이를 감싸는 보안·변경관리·배포 층(Markings·Global Branching·DevOps·Apollo) [S3, S2].", "items": [{"name": "Ontology (Object Storage v2)", "category": "핵심 데이터·의미 계층", "what": "데이터셋과 모델을 object type·property·link type·action type·function·interface로 매핑한 조직의 디지털 트윈. '운영의 명사(객체)와 동사(행동)' [S18, S3].", "how": "dataset↔object type, row↔object, column↔property, join↔link type으로 대응한다. 물리적으로는 Funnel이 dataset·restricted view·stream과 사용자 edit을 읽어 **Object Storage v2에 인덱싱한 사본**이며, 읽기는 Object Set Service가 담당한다(OSv1은 2026-06-30 이후 사용 불가) [S231]. 원천이 다시 들어올 때 기본 충돌 정책은 'Apply user edits'(편집 값 우선)라 모델링 시 원천 속성과 edit 전용 속성을 구분해야 한다 [S232].", "who": "FDE·데이터 엔지니어가 모델링, 모든 앱·에이전트가 소비", "example": "정유사: '설비·센서·작업지시' 객체를 링크로 묶고 '정비 지시 생성' Action을 정의 → 에이전트가 이상 신호를 보고 Action을 제안 (일반 패턴 예시)", "doc_url": "https://www.palantir.com/docs/foundry/ontology/core-concepts/"}, {"name": "Action types · webhooks (write-back)", "category": "쓰기·실행 계층", "what": "객체·속성·링크를 바꾸는 변경 규칙. AI의 모든 쓰기는 Action을 거친다 [S18]. 원천 시스템 반영은 Action에 붙이는 webhook으로 설계한다 [S230].", "how": "**writeback webhook**(Action당 1개)은 다른 rule보다 먼저 실행되고, 실패하면 Action 전체가 중단돼 Ontology가 바뀌지 않는다. 응답값을 이후 rule에 넘길 수 있다. **side-effect webhook**은 edit 이후 best-effort로 실행되고 여러 개 둘 수 있다(순서·성공 미보장). 둘 다 Data Connection의 REST source로 정의한다 [S230]. Action 한 번에 편집할 수 있는 객체는 기본 10,000개 [S231].", "who": "FDE, 통합 엔지니어", "example": "구매 담당자가 AI 제안을 승인하면 writeback webhook이 ERP 발주 API를 먼저 호출하고, 성공 시에만 Ontology의 발주 상태가 바뀐다. 알림은 side-effect webhook으로 보낸다", "doc_url": "https://www.palantir.com/docs/foundry/action-types/webhooks/"}, {"name": "Data Connection · virtual tables · Pipeline Builder (Use LLM)", "category": "데이터 통합·구조화", "what": "배치·스트리밍·CDC로 원천 시스템을 연결하고, 노코드 파이프라인에서 LLM을 데이터셋 전체에 적용해 비정형 데이터를 구조화한다 [S3, S23]. Databricks·Snowflake·BigQuery 등은 virtual table로 데이터를 복사하지 않고 가리킬 수 있다 [S234].", "how": "LLM 노드는 몇 행에 trial run 후 전체 실행. 2026-09 Pipeline Builder용 LLM eval suite GA [S23, S49]. 프로덕션에서는 LLM 노드의 **'Skip recomputing rows'**(입력이 같은 행은 캐시 재사용) 옵션이나 incremental 파이프라인으로 신규 행만 처리해야 빌드마다 전체 행에 LLM을 다시 호출하는 비용 사고를 막는다. 캐시 키는 프롬프트에 쓰인 컬럼이고 입력이 빌드 간 결정적이어야 하며, 프롬프트·출력 타입을 바꾸면 캐시가 초기화될 수 있다. 증분 빌드에서 신규 행 출력이 null이었다는 사용자 보고도 있다 [S293, S294, S238]. virtual table은 versioning·branching을 지원하지 않고 incremental은 append-only만 된다 [S234]. 단, virtual table은 Foundry worker + direct egress가 전제이며 agent proxy·agent worker 경유나 self-service private link 뒤의 레이크하우스는 지원하지 않아 그 경우 dataset 동기화(복제)로 가야 한다 [S234].", "who": "데이터 엔지니어, FDE", "example": "보험 청구서 PDF 수만 건에서 사고 유형·금액 필드를 추출해 '청구' 객체로 적재", "doc_url": "https://www.palantir.com/docs/foundry/pipeline-builder/pipeline-builder-llm/"}, {"name": "AIP Document Intelligence", "category": "문서 처리", "what": "문서 추출·청킹·임베딩(RAG)을 위한 기능. 2026-02 GA, AIP enrollment에서 기본 활성 [S42, S43].", "how": "페이지별 Python 함수(2026-07 GA)와 청킹·임베딩 파이프라인으로 문서를 온톨로지 객체와 연결 [S47].", "who": "FDE, 데이터 엔지니어", "example": "정책·매뉴얼 PDF를 청크로 나눠 정비 어시스턴트의 retrieval context로 사용", "doc_url": "https://palantir.com/docs/foundry/aip/overview/"}, {"name": "AIP Logic", "category": "노코드 LLM 함수", "what": "LLM으로 동작하는 함수를 노코드로 빌드·테스트·릴리스하는 환경. 핵심 블록은 'Use LLM'(프롬프트·도구·입력 속성·타입 지정 출력) [S5].", "how": "온톨로지 객체를 입력받아 문자열·객체 또는 **Ontology edit**을 출력. Branch에서 개발하고 Evals로 테스트, Automate로 자동 실행 [S5, S10]. Workshop 버튼으로 쓰려면 function-backed action으로 감싼다. 블록 실행당 최소 compute-seconds가 과금된다(검색 스니펫 기준 4) [S236].", "who": "FDE, 현업 빌더(비개발자 포함)", "example": "신규 청구 객체가 생기면 Logic이 약관을 조회해 '보상 가능/보류' 판단과 근거를 edit으로 제안", "doc_url": "https://www.palantir.com/docs/foundry/logic/overview/"}, {"name": "AIP Chatbot Studio (구 AIP Agent Studio)", "category": "대화형 어시스턴트 빌더", "what": "LLM·온톨로지·문서·도구를 갖춘 'AIP Chatbot'을 만드는 앱. 2026-04 공지로 Agent Studio에서 개명 [S6, S44].", "how": "retrieval context·application state·도구(Action, Object query, Function, Command, Clarification)·모델·시스템 프롬프트를 설정해 Publish. Workshop 위젯·Threads·OSDK/API로 배포하고, 함수로 publish하면 Evals·Automate 대상이 된다 [S7, S8].", "who": "FDE, 앱 빌더", "example": "공장 반장이 Workshop 화면에서 '3번 라인 내일 결품 위험?'을 물으면 객체 조회 후 대체 발주 Action을 확인받고 실행", "doc_url": "https://www.palantir.com/docs/foundry/chatbot-studio/overview/"}, {"name": "Pro-code agents · OSDK · Developer Console", "category": "코드 기반 에이전트·앱", "what": "온톨로지에서 생성되는 타입 안전 SDK(TypeScript·Python·Java·OpenAPI)와, 2026-07 도입된 Claude Agent SDK·OpenAI Agents SDK·Google ADK 템플릿 기반 pro-code 에이전트 [S19, S47].", "how": "Developer Console에서 앱 범위 토큰을 발급하고 사용자 권한을 함께 적용. publish된 에이전트는 Ontology binding과 API name을 받아 Workshop·OSDK에서 호출 [S19, S47]. 2026 Q1 콜에서는 agent engine SDK와 에이전트별 비용 귀속도 언급됐다(콜 발언) [S193].", "who": "소프트웨어 엔지니어, FDE", "example": "React 기반 고객용 포털이 OSDK로 '주문' 객체를 읽고, pro-code 에이전트가 납기 조정 Action을 호출", "doc_url": "https://www.palantir.com/docs/foundry/ontology-sdk/overview"}, {"name": "AIP Evals", "category": "품질 평가", "what": "Logic·Chatbot·코드 함수를 평가하는 테스트 환경. Suite = test case + target function + evaluator [S9].", "how": "run 간 메트릭 비교, 모델 비교, 실행 간 분산 측정. Experiments(2025-10, 프롬프트·모델 grid search로 품질·비용 균형), results analyzer(2025-11) [S9, S38, S39].", "who": "FDE, AI 엔지니어", "example": "모델을 바꾸기 전 실제 청구 케이스 수백 건으로 정확도·비용을 비교해 근거 있는 결정", "doc_url": "https://www.palantir.com/docs/foundry/aip-evals/overview"}, {"name": "Automate · Autopilot", "category": "자동화 실행 엔진 · 관제 화면", "what": "Automate는 조건(object set 모니터링·시간·이벤트)에 따라 Logic/Action effect를 실행하는 **엔진**이고, edit을 자동 적용하거나 staging해 사람이 승인하게 한다. Autopilot(2026-03 베타)은 Kanban·의존성 그래프·object timeline으로 사람 개입 지점을 보는 **관제 화면**이다 [S10, S11].", "how": "staging된 제안은 Proposals 탭에서 추론·decision log를 보고 승인 → Action 실행(HITL). Logic effect는 edit 목록을 반환하는 함수만 호출할 수 있고, staged write는 action effect로 호출 [S10]. object set 모니터링은 **객체마다** 실행되므로 대량 적재·backfill 전에는 automation을 일시 중지하거나 조건을 좁혀야 LLM 호출 폭증을 막는다(현장 관행).", "who": "운영 관리자, FDE", "example": "매일 아침 결품 위험 객체마다 Logic이 대체 공급처를 제안하고 구매 담당자가 승인", "doc_url": "https://palantir.com/docs/foundry/automate/effect-logic/"}, {"name": "Workshop", "category": "로우코드 운영 앱(내부 사용자)", "what": "운영 사용자가 매일 쓰는 플랫폼 내부 앱 빌더. AIP Chatbot·Analyst 위젯을 임베드 [S24]. 외부 사용자·고객 포털·기존 앱 내장에는 OSDK 앱이 맞다 [S19].", "how": "Chatbot의 application variable ↔ Workshop 변수 매핑, Workshop 이벤트·Commands로 다른 앱과 연동 [S24].", "who": "앱 빌더, 현업 사용자", "example": "병원 병상 관제 화면에 '퇴원 가능 환자 추천' 챗봇 위젯을 붙임", "doc_url": "https://www.palantir.com/docs/foundry/workshop/widgets-aip-chatbot"}, {"name": "AIP Analyst", "category": "에이전트형 분석", "what": "온톨로지 전반에 대한 자연어 분석 인터페이스. 2026-04 GA [S12, S43].", "how": "object type 검색→object set 생성→변환→요약·Vega-Lite 시각화, 의존성 그래프로 '작업 과정'을 보여줌. Skills·저장 분석·Notepad/Quiver/Contour 내보내기 [S12, S48].", "who": "분석가, 관리자", "example": "'지난 분기 지연 출하 상위 원인은?'에 대해 객체 집합을 만들고 근거 그래프와 함께 답", "doc_url": "https://palantir.com/docs/foundry/aip-analyst/overview/"}, {"name": "AIP Assist · AIP Threads · Boardroom", "category": "생산성·협업 앱", "what": "AIP Assist는 플랫폼 안에서 문맥에 맞는 도움말·안내를 주는 어시스턴트, AIP Threads(베타)는 문서(PDF)나 AIP Chatbot과 즉석 분석을 하는 범용 도구, Boardroom(베타)은 'director' 에이전트가 여러 전문가(SME) 에이전트의 결과를 종합해 권고를 내는 멀티 에이전트 앱이다 [S2, S13, S14, S313].", "how": "Assist는 관리자가 Control Panel에서 AIP를 켜야 하고, 여러 모드와 고객 자체 문서(SOP 등)를 소스로 추가할 수 있으며 문서상 고객 데이터에는 접근하지 않는다 [S313]. Threads는 출처 인용을 지원하고 AIP·AIP custom workflows가 켜져 있어야 쓴다. Boardroom은 에이전트별 지시·모델·도구·컨텍스트·위임을 설정하고 Chat·Panel(음성 회의)·Documents·Slide decks·Plans 모드를 제공하며 세션은 Ontology에 저장된다 [S13, S14].", "who": "현업 사용자(Threads), 빌더·전 사용자(Assist), 경영·기획 담당(Boardroom)", "example": "분기 계획 회의 전에 Boardroom에서 재무·공급망·영업 SME 에이전트에게 각자 분석을 맡기고 director 에이전트가 권고안과 슬라이드를 정리", "doc_url": "https://palantir.com/docs/foundry/boardroom/overview/"}, {"name": "AI FDE · AIP Evolve", "category": "플랫폼을 만드는 에이전트", "what": "AI FDE는 자연어로 Foundry(데이터 통합·온톨로지·함수·Automate)를 조작하는 빌더 에이전트(2026-03 GA) — 업무 데이터가 아니라 **플랫폼 자산**을 만든다. AIP Evolve는 AI FDE 에이전트 무리를 조율해 AI 시스템을 개선(모델 마이그레이션, 비용·지연, eval 점수)한다(2026-09 GA) [S15, S43, S49].", "how": "실행→검증→수정 closed loop, 사용자 권한 그대로, 변경은 Global Branch proposal/PR로 제안. Evals로 자기 코드를 테스트 [S15]. 실무 후기에서는 AI FDE가 잘못 설계된 온톨로지 위에 그럴듯한 앱을 만들어 낸 사례가 보고됐다 — 브랜치 격리와 프로덕션 전 사람 검토 게이트가 필요하다(개인 LinkedIn 후기, 신뢰도 낮음) [S307].", "who": "FDE, 플랫폼 빌더", "example": "회사 발표: AI FDE를 활용해 고객의 레거시 데이터 웨어하우스 마이그레이션을 5일에 완료(벤더 발표, 콜 발언) [S67]", "doc_url": "https://www.palantir.com/docs/foundry/ai-fde/overview"}, {"name": "Palantir MCP · Ontology MCP", "category": "외부 AI 도구·에이전트 연결", "what": "Palantir MCP는 Claude Code·Cursor 같은 AI IDE가 Palantir 위에서 빌드하게 하는 **빌더용** MCP(타입 수정 가능, 데이터 쓰기 불가). Ontology MCP는 Developer Console 앱의 object·action·query를 외부 에이전트에 노출하는 **소비자용** MCP. 둘 다 2026-06 GA [S16, S17, S46].", "how": "관리자가 Control Panel에서 활성화·범위 제한. 외부 호스팅 LLM에 연결하면 데이터 거버넌스가 외부로 넘어간다는 경고 [S58, S17].", "who": "개발자, 외부 에이전트 플랫폼(Copilot Studio 등)", "example": "Microsoft Copilot Studio 에이전트가 Ontology MCP로 '주문' 객체를 조회하고 허용된 Action만 호출(2026-03 연동) [S43]", "doc_url": "https://www.palantir.com/docs/foundry/palantir-mcp/"}, {"name": "Model Catalog · BYOM(registered models)", "category": "모델 접근", "what": "xAI·OpenAI·Anthropic·Meta·Google 등 LLM과 Palantir 호스팅 오픈소스 모델을 관리자가 켜서 쓴다. 고객 자체 모델은 registered model로 등록(2026-05 GA) [S20, S21, S45].", "how": "Palantir 관리 인프라를 거쳐 제3자 제공사가 데이터를 보관·재학습하지 않는 구조. enrollment(상업/IL2·4·5)·지역별로 가용 모델이 다름 [S3, S20, S44]. 토큰은 모델·지역별 요율로 compute-seconds 환산 [S235].", "who": "플랫폼 관리자", "example": "규제상 특정 지역 모델만 써야 하는 은행이 자체 호스팅 모델을 등록해 Logic·Chatbot에서 사용", "doc_url": "https://palantir.com/docs/foundry/aip/bring-your-own-model"}, {"name": "보안·거버넌스 (Markings · 세분 정책 · LLM allowlist · Observability)", "category": "횡단 보안", "what": "① Markings: lineage를 따라 파생 리소스로 **전파**되는 이진적 강제 접근통제 ② 세분 정책(restricted view·object security policy·property 권한): **읽기 시점**의 row/property 필터 ③ LLM marking allowlist: 어떤 marking이 붙은 세션이 LLM을 호출할 수 있는지 정하는 관문(세션 토큰 단위, 2026-10) [S22, S50, S231].", "how": "세분 정책은 산출물로 따라가지 않으므로 LLM 출력·edit·하류 데이터 보호는 Markings로 설계한다 [S5, S19]. Ontology/AIP Observability로 실행 기록·트레이스·토큰을 추적 [S39].", "who": "보안 관리자, FDE", "example": "환자 식별정보 marking이 붙은 세션은 LLM 호출 자체가 거부되고, scoped session으로 허용 범위만 사용", "doc_url": "https://palantir.com/docs/foundry/aip/control-llm-data-access-with-markings/"}, {"name": "Global Branching · DevOps · Apollo/Rubix", "category": "변경 관리·배포", "what": "Global Branching(2026-05 GA)은 transforms·온톨로지·Workshop·Logic을 한 브랜치에서 함께 바꾸고 병합한다 [S45]. Foundry DevOps는 온톨로지·파이프라인·앱을 product로 패키징해 같은 enrollment 안의 다른 공간에 설치·버전 관리하고, 별도 enrollment를 쓰는 계열사에는 Foundry products[Beta]를 Apollo connected hub로 배포한다(Support 활성화 필요) [S239, S320, S321]. Apollo는 Palantir **플랫폼 소프트웨어**를 Hub-Spoke 구조로 각 환경에 배포하고, Rubix는 하드닝된 Kubernetes 기판이다 [S31, S32].", "how": "Apollo는 고정 버전 대신 'Product + Release Channel + 제약'으로 정의, 유지보수 창에 자동 업그레이드. 단절망은 같은 배포 모델로 관리하되 반입 절차·인가 일정에 맞춰 늦게 반영되는 것이 일반적이다 [S31, S33]. Global Branching 지원 목록(2026-10)에 AIP Chatbot Studio·Data Connection·virtual table은 없다 — 운영 중인 Chatbot은 버전 고정 + Evals 비교 + 단계적 publish로 관리한다 [S322].", "who": "Palantir 플랫폼팀(Apollo 플랫폼 배포), 고객 IT·FDE(Branching·DevOps, cross-enrollment 시 Apollo hub 경유)", "example": "한 공장에서 검증한 품질 유스케이스를 DevOps product로 묶어 다른 공장 공간에 설치하고 release channel로 업그레이드", "doc_url": "https://www.palantir.com/docs/foundry/devops/overview/"}], "architecture": {"caption": "AIP 데이터·제어 흐름 — 원천이 온톨로지(OSv2)가 되고, LLM 로직·에이전트·사람이 Action을 통해 쓰며, writeback webhook이 원천을 먼저 바꾼다 [S3, S230, S231]", "nodes": [{"id": "p1", "label": "결정이 시스템 사이에 흩어짐", "lane": "problem"}, {"id": "erp", "label": "ERP·MES·EHR 등 원천", "lane": "source", "note": "system of record · 변경은 CDC로 재수집"}, {"id": "doc", "label": "문서·비정형 데이터", "lane": "source"}, {"id": "lake", "label": "Databricks·Snowflake", "lane": "source", "note": "virtual table"}, {"id": "pipe", "label": "Pipeline Builder·Doc Intelligence", "lane": "solution"}, {"id": "ont", "label": "Ontology(OSv2 객체·링크)", "lane": "solution", "note": "Funnel 인덱싱"}, {"id": "aip", "label": "Logic·Chatbot·Agents+Evals", "lane": "solution"}, {"id": "llm", "label": "LLM(Model Catalog·BYOM)", "lane": "solution"}, {"id": "auto", "label": "Automate(자동/승인 대기)", "lane": "solution"}, {"id": "act", "label": "Action(검증·권한·감사)", "lane": "solution"}, {"id": "ws", "label": "Workshop·OSDK 앱 사용자", "lane": "user"}, {"id": "ext", "label": "외부 에이전트(Ontology MCP)", "lane": "user"}, {"id": "o1", "label": "감사 가능한 결정 기록", "lane": "outcome"}], "edges": [{"from": "erp", "to": "pipe", "label": "커넥터·CDC"}, {"from": "doc", "to": "pipe", "label": "Use LLM 추출"}, {"from": "lake", "to": "ont", "label": "virtual table backing"}, {"from": "pipe", "to": "ont", "label": "객체로 인덱싱"}, {"from": "ont", "to": "aip", "label": "도구: 조회·Action"}, {"from": "aip", "to": "llm", "label": "프롬프트·marking allowlist 검사"}, {"from": "aip", "to": "auto", "label": "edit 제안"}, {"from": "aip", "to": "ws", "label": "위젯·API"}, {"from": "auto", "to": "act", "label": "자동 적용 또는 승인"}, {"from": "ws", "to": "act", "label": "사용자 실행"}, {"from": "ext", "to": "act", "label": "허용된 Action만"}, {"from": "ont", "to": "ext", "label": "MCP 도구 노출"}, {"from": "p1", "to": "ws", "label": "결정 지점"}, {"from": "act", "to": "erp", "label": "writeback webhook(먼저 실행)"}, {"from": "act", "to": "ont", "label": "edit → Funnel 병합"}, {"from": "act", "to": "o1", "label": "감사 로그"}]}, "delivery": [{"model": "Palantir 호스팅 SaaS", "desc": "기본 형태. 모든 서비스가 Rubix(하드닝된 K8s) 위에서 돌고 Apollo가 설치·업그레이드·롤백을 관리 [S32, S31]."}, {"model": "파트너 클라우드·소버린/프라이빗", "desc": "OCI 인증(퍼블릭·전용·소버린·에어갭 리전, 2024-07) [S35]. Rackspace는 스스로 AWS·Azure·GCP·프라이빗 클라우드의 'preferred deployment and operations partner'라고 소개(Rackspace 자체 주장) [S36]. 국내에서는 KT가 2025-03 첫 premium partner가 됐고, KT 클라우드 기반 재판매는 계획 단계로 보도됐다 [S96]."}, {"model": "온프렘·에어갭·엣지", "desc": "Apollo는 에어갭·원격 환경 때문에 만들어졌다고 회사가 설명. 같은 배포 모델로 단절망까지 관리하되 반입 절차에 따라 반영 시점이 늦다 [S33, S31]."}, {"model": "미 정부·기밀망", "desc": "FedRAMP High(2024-12, AIP 포함), DoD IL5·IL6. Azure Government·Secret·Top Secret 클라우드에서 Azure OpenAI를 AIP 안에서 사용(ATO 조건) [S34, S204]. FedStart로 제3자 SaaS가 Palantir 인가를 활용(예: Anthropic Claude, 2025-04) [S37]."}, {"model": "참여(Engagement) 모델·파트너", "desc": "AIP Bootcamp(1~5일) → FDE·Deployment Strategist 파일럿 → 엔터프라이즈 계약 확장 [S52]. 파트너 유형: 구현 SI(Accenture Federal — 1,000명 규모 Data & AI 팀을 인증 대상으로 하는 파트너십, 2025-06 발표·진척 미공개 [S104]; SAP 마이그레이션 첫 GSI는 Accenture [S105]), 산업 BPO(Moder × Freedom Mortgage [S77]), 앱 마켓(SAP Endorsed App [S105], AWS Marketplace 리스팅 [S152]), 정부 채널(FedStart [S37]), 자격 교육(Ontologize [S29]). 미 육군 EA는 리셀러 pass-through 수수료를 없앴다 — 대형 고객은 Palantir가 직접 계약하고 파트너는 구현·운영 역할이 크다는 신호 [S85]. 국내: KT(premium partner, 재판매 계획 보도) [S96]. 파트너 수익원은 단순 재판매보다 구현(SI)·운영(Rackspace·OCI)·산업 패키지(Moder)·교육·자격(Ontologize) 쪽이 크다(육군 EA 사례에서의 추론) [S36, S35, S77, S29, S85]."}], "pricing": "**한 줄 답**: 공개 정가 없이 협상하는 다년 플랫폼 약정이고, 좌석이 아니라 compute-seconds로 계량된 사용량이 붙는다 — 계량 단위는 공식 문서로 확인되지만 약정 차감·초과 과금 등 청구 방식은 비공개다 [S235, S237, S54]. **공개 정가 없음** — 협상 기반 다년 플랫폼 구독(좌석 단위 아님) [S54]. **공식 계량 방식**: AIP는 LLM 토큰을 모델·지역별 요율로 compute-seconds로 환산한다(문서 표의 예시 모델 기준, 북미 10k 토큰당 GPT-4o mini 입력 2.6 vs Claude 4.5 Sonnet 입력 51.8 — 약 20배 차이, 출력은 입력의 4~5배. 최신 모델 요율은 표에서 확인). 요율은 AWS 호스팅·기본 계약 기준이라 고객마다 다르고, 계약 형태(사용량형/용량 약정형)에 따라 비용 또는 약정 소진 속도로 나타난다 [S235]. 컴퓨트는 compute-seconds, 온톨로지 인덱스 크기는 Ontology volume(GB-month)으로 계량된다 [S237]. **비용 구성(정리)**: ① 라이선스 — 다년 약정, 좁은 범위 배포 연 약 $25만·첫 엔터프라이즈 계약 연 $0.5–2M·3년 할인 15–32%는 Redress Compliance 단독 추정(신뢰도 낮음) [S54] ② 구축 — Palantir FDE·DS 투입(구독 포함 여부 비공개), 파트너 SI, 고객 내부 빌더·CoE ③ 운영 — compute·LLM 토큰·Ontology volume. 청구 방식(약정 차감·초과 과금·BYOM 토큰 과금 주체)은 비공개라 계약서에서 확인할 항목이며, 확산 시 사용량이 크게 늘 수 있다는 컨설팅사 경고가 있다 [S54]. **비용·용량 통제 장치**: LLM capacity는 enrollment·프로젝트·사용자 3단계 TPM/RPM 한도로 관리되며, 용량의 20%는 대화형 사용에 예약돼 배치 작업은 최대 80%까지, 중요 프로젝트에는 모델 용량의 최대 50%를 예약할 수 있다 [S295]. 프로젝트별 reserved capacity(추가 비용 없음, 2026-01), capacity autoscaling, 사용자별 rate limit, 토큰 사용량 export, 에이전트별 비용 귀속(콜 발언)도 있다 [S41, S44, S47, S45, S193]. 역사적 공식 자료로 2019 UK G-Cloud Foundry 가격(서버 코어당 연 £66,000)이 있으나 AIP 이전이다 [S55]. 개인 학습용 **Developer Tier는 무료**(하드 캡) [S25, S26].", "integrations": ["SAP (Cloud ERP 데이터 마이그레이션, SAP Endorsed App)", "Databricks (Unity Catalog·virtual table)", "Snowflake (Iceberg 연동)", "Microsoft Azure OpenAI·Copilot Studio(Ontology MCP)", "NVIDIA (Nemotron·CUDA-X)", "OpenAI · Anthropic · Google · xAI · Meta 모델", "Claude Code · Cursor · VS Code (Palantir MCP)", "Oracle OCI", "REST API 원천 시스템(Action webhook)"]}, "playbook": {"concepts": [{"term": "Ontology (온톨로지)", "definition": "데이터셋·모델을 object type·property·link type·action type·function에 매핑한 조직의 디지털 트윈. 물리적으로는 OSv2에 인덱싱된 객체 사본 [S18, S231].", "why": "LLM에게 '회사가 어떻게 돌아가는지'를 구조화해 주는 통로. AIP의 모든 도구가 여기서 읽고 쓴다 [S3].", "say_it": "'테이블 수백 개 대신 설비·주문·환자 같은 업무 객체와 그 객체에 할 수 있는 행동을 정의해 두면, AI가 그 위에서 일합니다.'"}, {"term": "Object type / Object / Object set", "definition": "실세계 엔티티·이벤트의 스키마, 그 인스턴스, 인스턴스 집합(≈ dataset, row, 쿼리 결과) [S18].", "why": "Logic 입력, Chatbot 객체 조회 도구, Analyst의 분석 단위가 모두 object set이다 [S8, S12].", "say_it": "'엑셀 한 줄이 아니라 ‘12번 펌프’라는 객체 하나로 다룹니다.'"}, {"term": "Link type", "definition": "두 object type 사이 관계의 스키마(≈ join) [S18].", "why": "에이전트가 '이 주문 → 이 부품 → 이 공급사'처럼 연결을 따라가며 추론하게 한다 [S8].", "say_it": "'조인을 매번 짜지 않고 관계 자체를 업무 언어로 저장합니다.'"}, {"term": "Action type", "definition": "객체·속성·링크를 한 번에 바꾸는 변경 집합과 부수효과의 스키마 [S18].", "why": "AI의 '쓰기'는 반드시 Action을 통한다 — 권한·검증·감사가 붙는 유일한 경로 [S8, S10].", "say_it": "'AI가 DB를 직접 고치는 게 아니라, 사람에게 허락된 버튼(Action)을 대신 눌러 제안합니다.'"}, {"term": "Writeback webhook vs Side-effect webhook", "definition": "writeback webhook은 Action의 다른 rule보다 먼저 실행되고 실패 시 Action 전체 중단(Action당 1개). side-effect webhook은 edit 후 best-effort 실행(여러 개, 순서·성공 미보장) [S230].", "why": "'SAP에 어떻게 다시 쓰나요?'의 정답. 원천이 system of record면 writeback으로 원천을 먼저 바꿔야 온톨로지와 원천이 어긋나지 않는다 [S230].", "say_it": "'승인 버튼을 누르면 ERP를 먼저 바꾸고, ERP 호출이 실패하면 화면(온톨로지) 상태는 바뀌지 않습니다. 반대 방향 불일치는 멱등키로 대비합니다.'"}, {"term": "Function", "definition": "객체·object set을 입력으로 받는 코드 로직. Logic 함수와 publish된 Chatbot도 함수로 취급 [S18, S7].", "why": "함수가 되면 Evals로 테스트하고 Automate로 자동화하고 OSDK로 호출할 수 있다 [S9].", "say_it": "'한 번 만든 판단 로직을 앱·자동화·외부 시스템이 같은 방식으로 재사용합니다.'"}, {"term": "Logic vs Chatbot vs Pro-code agent vs AI FDE", "definition": "Logic = 단발성 LLM 함수(입력 객체 → 타입 출력/edit, 배치·판단 자동화). Chatbot = 다회차 대화·세션 상태, 사람이 화면에서 묻고 Action 확인. Pro-code agent = 코드(Agent SDK)로 짜는 다단계 오케스트레이션. AI FDE = 업무 데이터가 아니라 플랫폼 자산(파이프라인·온톨로지·함수)을 만드는 빌더 에이전트 [S5, S7, S47, S15].", "why": "면접 단골 질문 '언제 Logic, 언제 Chatbot?'에 답하는 축(선택 기준은 해석). 기준은 도구 가능 여부가 아니라 상호작용 형태다 — Chatbot도 함수로 publish하면 Evals·Automate 대상이 된다 [S7, S9].", "say_it": "'반복 판단은 Logic으로 자동화하고, 사람이 탐색하며 결정할 땐 Chatbot, 복잡한 다단계는 pro-code agent로 갑니다.'"}, {"term": "AIP Evals", "definition": "LLM 함수를 위한 테스트 환경. Suite = test case + target function + evaluator [S9].", "why": "LLM의 비결정성을 '감'이 아니라 점수로 관리 — 모델 교체·프롬프트 변경의 근거 [S9, S165].", "say_it": "'바꾸기 전에 실제 케이스 수백 건으로 점수를 비교하고 결정합니다.'"}, {"term": "Automate (엔진) vs Autopilot (관제)", "definition": "Automate는 조건→effect를 실행하고 edit을 자동 적용하거나 Proposals로 staging. Autopilot은 자동화 워크플로의 상태·의존성·사람 개입 지점을 보는 관제 화면(베타) [S10, S11].", "why": "자동화 수준을 업무 위험도에 맞게 조절하는 핵심 장치 [S10].", "say_it": "'처음엔 AI가 제안만 하고 사람이 승인합니다. Evals 점수가 쌓이면 자동 비율을 올립니다.'"}, {"term": "Workshop vs OSDK 앱", "definition": "Workshop = 플랫폼 내부 로우코드 앱(내부 사용자, 위젯·Chatbot 그대로, 며칠 만에). OSDK 앱 = Developer Console에 등록한 코드 앱(외부 사용자·고객 포털·기존 앱 내장, 앱 범위 토큰 + 사용자 권한) [S24, S19].", "why": "'어떤 앱 표면을 고를까'는 사용자 위치(내부/외부)·UX 맞춤 수준·개발 역량으로 정한다.", "say_it": "'내부 운영자는 Workshop으로 빠르게, 고객이 쓰는 화면은 OSDK로 기존 앱에 붙입니다.'"}, {"term": "Markings vs 세분 정책 vs LLM allowlist", "definition": "Markings = lineage를 따라 전파되는 이진적 강제 접근통제. 세분 정책 = 읽기 시점의 row/property 필터(산출물로 따라가지 않음). LLM allowlist = 특정 marking이 붙은 세션의 LLM 호출 허용 여부(세션 토큰 단위) [S22, S5, S231].", "why": "row/column 보안은 모델 출력·하류를 보호하지 못하므로 민감 데이터는 Markings로 막아야 한다 [S5, S19].", "say_it": "'민감 등급이 붙은 데이터는 AI 호출 경로에서 아예 빠지도록 설계합니다.'"}, {"term": "Palantir MCP vs Ontology MCP", "definition": "Palantir MCP = 빌더용(AI IDE가 타입·코드 수정, 데이터 쓰기 불가). Ontology MCP = 소비자용(외부 에이전트가 앱 범위의 object·action·query 사용) [S16, S17].", "why": "'우리 Copilot/Claude에서 Palantir 데이터를 쓸 수 있나?'라는 질문의 정답 경로 [S43].", "say_it": "'외부 에이전트도 쓸 수 있지만, 우리가 허용한 객체와 행동만 MCP 도구로 열어 줍니다.'"}, {"term": "Global Branching · DevOps", "definition": "Global Branching = transforms·온톨로지·Workshop·Logic·Automate를 한 브랜치에서 함께 바꾸고 병합(2026-05 GA). DevOps = 검증된 자산을 product로 패키징해 다른 공간에 설치, 별도 enrollment 계열사는 Foundry products[Beta]를 Apollo connected hub로 배포 [S45, S47, S239, S320]. Chatbot Studio·Data Connection·virtual table은 아직 브랜치 미지원 [S322].", "why": "운영 중인 AI 시스템을 안전하게 바꾸고 복제하는 소프트웨어 공학식 변경 관리 — AI FDE·Evolve 변경의 기본 경로 [S15].", "say_it": "'운영 화면을 멈추지 않고 브랜치에서 고쳐 검증한 뒤 합치고, 검증된 것은 다른 공장에 그대로 설치합니다.'"}, {"term": "Apollo / Rubix", "definition": "Apollo = Palantir 플랫폼 소프트웨어의 Hub-Spoke 지속 배포(Product + Release Channel + 제약). Rubix = 하드닝된 Kubernetes 기판 [S31, S32].", "why": "에어갭·기밀망·온프렘·멀티클라우드에 같은 플랫폼을 배포하는 Palantir의 숨은 경쟁력 [S33].", "say_it": "'인터넷이 끊긴 기지에도 클라우드와 같은 방식으로 플랫폼 업데이트가 관리됩니다.'"}, {"term": "Virtual table (zero-copy의 정확한 의미)", "definition": "Databricks·Snowflake·BigQuery 등의 원천 테이블을 복사하지 않고 가리키는 포인터. 객체 backing 가능, 단 versioning·branching 미지원, incremental은 append-only [S234]. Foundry worker + direct egress가 전제이며 agent proxy·agent worker·self-service private link 경유는 미지원 [S234].", "why": "'데이터를 또 복사하나요?'에 정직하게 답하는 근거 — dataset 계층 복제는 없지만 객체로 쓰면 OSv2 인덱스가 생긴다 [S231].", "say_it": "'객체로 쓰는 컬럼 값은 Palantir 인덱스(OSv2)에 복제되고, 나머지 원천 테이블은 귀사 레이크하우스에 그대로 둡니다. 단, 직접 egress 경로가 열려 있어야 합니다.'"}, {"term": "AIP Bootcamp", "definition": "고객 데이터로 1~5일 안에 작동하는 유스케이스를 만드는 hands-on 세션이자 AIP의 핵심 GTM [S52, S51].", "why": "'PoC 몇 달'을 '며칠'로 줄여 구매 결정을 앞당긴다 — 회사는 부트캠프 후 수주로 이어진 사례를 반복 언급(벤더 발표) [S59, S69].", "say_it": "'슬라이드 대신 여러분 데이터로 5일 안에 돌아가는 걸 보여드리겠습니다.'"}], "official_resources": [{"title": "AIP Overview (공식 문서)", "url": "https://palantir.com/docs/foundry/aip/overview/", "type": "docs"}, {"title": "AIP architecture (Architecture Center)", "url": "https://www.palantir.com/docs/foundry/architecture-center/aip-architecture", "type": "docs"}, {"title": "Get started with AIP (학습 경로)", "url": "https://palantir.com/docs/foundry/aip/getting-started-with-aip/", "type": "101"}, {"title": "Ontology core concepts", "url": "https://www.palantir.com/docs/foundry/ontology/core-concepts/", "type": "101"}, {"title": "Action types — Webhooks (write-back)", "url": "https://www.palantir.com/docs/foundry/action-types/webhooks/", "type": "docs"}, {"title": "AIP Logic overview", "url": "https://www.palantir.com/docs/foundry/logic/overview/", "type": "docs"}, {"title": "AIP Chatbot Studio — Overview", "url": "https://www.palantir.com/docs/foundry/chatbot-studio/overview/", "type": "tutorial"}, {"title": "AIP Evals overview", "url": "https://www.palantir.com/docs/foundry/aip-evals/overview", "type": "docs"}, {"title": "AIP compute usage (토큰 계량)", "url": "https://www.palantir.com/docs/foundry/aip/aip-compute-usage", "type": "docs"}, {"title": "Developers — 무료 Developer Tier·OSDK 튜토리얼", "url": "https://www.palantir.com/docs/foundry/developers", "type": "tutorial"}, {"title": "learn.palantir.com (Speedrun: Your First AIP Workflow 등)", "url": "https://learn.palantir.com/", "type": "tutorial"}, {"title": "Palantir 자격 개편 — AI Engineer 시험(2026-08)", "url": "https://community.palantir.com/t/palantir-certifications-are-getting-a-refresh-with-a-brand-new-ai-engineer-exam-launching-3-august/7022", "type": "cert"}, {"title": "Apollo core overview", "url": "https://palantir.com/docs/apollo/core/overview/", "type": "docs"}, {"title": "How AIP Bootcamps Work (Palantir 블로그)", "url": "https://blog.palantir.com/deploying-full-spectrum-ai-in-days-how-aip-bootcamps-work-21829ec8d560", "type": "blog"}, {"title": "Reflections on Palantir (전 FDE 8년 에세이)", "url": "https://nabeelqu.substack.com/p/reflections-on-palantir", "type": "blog"}, {"title": "Foundry 릴리스 공지(월별)", "url": "https://palantir.com/docs/foundry/announcements/2026-10/", "type": "docs"}, {"title": "AIP Assist overview", "url": "https://www.palantir.com/docs/foundry/assist/overview/", "type": "docs"}, {"title": "YouTube: Build an AIP Agent in Palantir Foundry (Step by Step, 제3자 튜토리얼)", "url": "https://www.youtube.com/watch?v=EqsLWIrzDbs", "type": "video"}, {"title": "YouTube: The AIP Ripple Effect — Tampa General Hospital at AIPCon 4", "url": "https://www.youtube.com/watch?v=B1j8qP-Nevs", "type": "video"}], "getting_started": [{"title": "1. 무료 Developer Tier 가입", "detail": "Developers 페이지에서 무료 계정 생성. 하드 캡이라 과금 없음, GA 앱 사용 가능 [S25, S26]. 면접 전 '직접 만들어 봤다'는 경험이 가장 강한 무기다 [S156, S161]."}, {"title": "2. learn.palantir.com 기초 과정", "detail": "'Introduction to Foundry & AIP' → 'Scoping Use Cases for Foundry & AIP'(약 15분) [S27]."}, {"title": "3. Speedrun: Your First AIP Workflow (60~90분)", "detail": "PDF에서 정보 추출 → 온톨로지 적재 → AIP Chatbot 구성 → 인터랙티브 앱. 이어서 'Your First Agentic AIP Workflow' [S27, S28]."}, {"title": "4. 표준 빌더 흐름 직접 따라 하기", "detail": "Pipeline Builder로 데이터 적재 → 온톨로지 모델링(object·link·action) → AIP Logic 함수 → Evals suite → Chatbot Studio → Workshop 위젯 → Automate staging 승인 [S23, S18, S5, S9, S7, S24, S10]."}, {"title": "5. 배지·자격(선택)", "detail": "Builder Foundations 배지 퀴즈(10문제 중 7개). 2026-08부터 Associate 자격(Data Engineer·Application Developer·AI Engineer), Specialist 실기는 2026-09-30 시작 [S30, S29]."}, {"title": "6. 코딩 에이전트로 연결(선택)", "detail": "관리자가 Palantir MCP를 활성화한 뒤 Claude Code·Cursor에 project scope로 설치 → OSDK·transform 코드를 AI와 함께 작성 [S58, S16]."}], "deployment_phases": [{"phase": "0. Discovery & 스코핑 + 승인 트랙 착수", "duration": "1~2주 (보안 심사는 병행 4~12주, 현장 관행 추정)", "activities": ["경영진 스폰서와 '돈이 되는 운영 결정' 1~2개 선정(예: 결품, 병상 배정, 심사 적체)", "결정에 필요한 원천 시스템·소유자·데이터 접근 경로 파악", "현재 KPI 기준선(baseline)과 지표 정의(분모) 합의", "승인 트랙 병렬 착수: Data Connection agent 설치·방화벽 egress, InfoSec 설문·DPA·외부 LLM 사용 승인, SSO/그룹 동기화", "레이크하우스 네트워크 경로 확인(직접 egress 가능 여부 → virtual table 가능 여부) [S234]"], "deliverables": ["유스케이스 브리프(결정·사용자·KPI·지표 정의)", "데이터 접근·보안 체크리스트와 승인 일정", "Bootcamp 일정·참여 SME"], "pitfalls": ["'AI로 뭘 할 수 있죠?'식 막연한 출발 — 결정 단위로 좁히지 않으면 데모로 끝난다", "보안 심사·커넥터 승인을 Bootcamp 뒤에 시작하면 일정 대부분을 잃는다(현장 관행)"]}, {"phase": "1. AIP Bootcamp", "duration": "1~5일 (사전 데이터 준비 1~3주, 현장 관행) [S52]", "activities": ["사전: 데이터 추출본 또는 승인된 커넥터 확보", "최소 온톨로지(객체 3~5개, Action 1~2개) 모델링", "AIP Logic/Chatbot으로 워크플로 구축, 현업과 hands-on", "경영진 리드아웃(데모)"], "deliverables": ["고객 데이터 위에서 작동하는 유스케이스", "MVP 롤아웃 계획 [S52]"], "pitfalls": ["Bootcamp의 Action은 보통 Ontology 안에서만 반영되고 원천 write-back은 Pilot 범위 — 이를 명시하지 않으면 기대치가 어긋난다(현장 관행)", "온톨로지를 Bootcamp 속도로 대충 만들면 이후 재설계 비용이 커진다(온톨로지 유지비 일반론 S150의 응용)"]}, {"phase": "2. Pilot / MVP", "duration": "8~12주, 원천 쓰기 연동 포함 시 +4~8주 (현장 관행 추정)", "activities": ["프로덕션 파이프라인: LLM 노드는 'Skip recomputing rows' 우선, incremental 적용 시 신규 행 출력 검증(사용자 보고 S294) [S293, S238]", "온톨로지 확장, Action에 writeback webhook 연결(원천 쪽 멱등키) [S230]", "Evals suite(실제 케이스)로 품질 기준 설정", "Automate는 staging(사람 승인)으로 시작", "현업 교육·피드백 루프"], "deliverables": ["baseline 대비 KPI 측정 결과(게이트: Evals 점수, KPI 개선)", "운영 runbook·권한 설계"], "pitfalls": ["baseline·지표 정의 없이 성과를 주장하면 NHS FDP처럼 독립 평가에서 반박당한다 [S99]", "row/column 보안만 믿고 LLM 출력 보호를 빠뜨림 — Markings 필요 [S5]", "SAP 기술 사용자 권한·OData 활성화·transport에 수주~수개월(현장 관행)"]}, {"phase": "3. Production & 거버넌스", "duration": "분기 단위", "activities": ["Markings·LLM marking allowlist·scoped session 설계 [S22, S50]", "프로젝트별 LLM capacity·rate limit·토큰 사용량 대시보드 [S41, S45]", "Global Branching으로 변경 검증·병합, 플랫폼 업그레이드는 Apollo가 처리 [S45, S31]", "Observability로 실행 기록·트레이스 감시 [S39]"], "deliverables": ["SLA·운영 체계", "자동 적용 비율 확대 기준(Evals 점수 연동)"], "pitfalls": ["전사 확산 시 LLM compute 사용량이 크게 늘 수 있다 — 모델별 요율 차이(약 20배)를 설계에 반영 [S235, S54]", "Automate 대량 트리거(backfill 시 객체마다 LLM 호출)", "기본 충돌 정책('Apply user edits')에서는 한 번 edit된 속성이 이후 원천 갱신을 계속 이긴다 — 원천이 system of record인 속성은 Action에서 직접 edit하지 말고 writeback webhook만 호출 후 재수집으로 반영하거나, 'Apply most recent value'(UTC timestamp 필요)를 쓴다. 이미 생긴 edit은 개별 undo가 불가하다 [S232]"]}, {"phase": "4. Expansion (Land & Expand)", "duration": "연 단위", "activities": ["같은 온톨로지 위에 인접 유스케이스 추가, 같은 enrollment는 DevOps product 설치, 별도 enrollment 계열사는 Foundry products[Beta]를 Apollo connected hub로 배포 [S239, S320]", "고객 내부 빌더·CoE 육성(예: HD현대 공동 CoE, Lear 사내 펠로십) [S93, S67]", "파트너(SI·BPO) 활용으로 FDE 의존도 낮추기 [S77, S104]"], "deliverables": ["엔터프라이즈 계약", "유스케이스 포트폴리오(예: Lear 4개 → 280개, Palantir 콜) [S66]"], "pitfalls": ["FDE 없이는 유지 못 하는 구조가 되면 비용·락인 비판으로 돌아온다 [S147] → 처방: 확장 단계마다 내부 빌더 인계 계획을 계약에 포함", "온톨로지 유지보수 책임자 부재 — 비즈니스가 바뀌면 모델이 낡는다 [S150] → 처방: CoE에 온톨로지 오너 지정, Global Branching·AI FDE로 변경 관리 [S45, S15]"]}], "discovery_questions": ["이 프로젝트를 밀고 있는 임원은 누구이고, 3개월 뒤 그분이 무엇을 보면 '됐다'고 하시겠습니까?", "지금 가장 비싼 '늦은 결정' 또는 '잘못된 결정'은 무엇이고, 그 결정은 누가, 어떤 화면에서, 얼마나 자주 내립니까?", "그 결정이 지금처럼 계속되면 1년에 얼마가 나갑니까? 결품·지연·인건비·매출 손실 중 무엇입니까?", "그 업무의 기준 지표(처리 시간, 비용, 오류율)를 지금 측정하고 있습니까? 지표의 정의(분모)는 누구와 합의돼 있습니까?", "그 결정에 필요한 데이터는 어느 시스템(ERP·MES·EHR·엑셀)에 있고, 각 시스템 오너와 접근 승인에는 보통 몇 주가 걸립니까?", "결정 결과를 원천 시스템에 되돌려 써야 합니까(write-back)? 그렇다면 어느 API·트랜잭션을 거쳐야 하고, 원천이 진실의 원천입니까?", "AI가 '제안'만 해도 되는 업무와, 사람 승인 없이 '실행'해도 되는 업무의 경계는 어디입니까?", "민감 데이터 등급 체계가 있습니까? 외부 LLM 호출이 허용되는 등급, 금지된 공급자, 망분리·지역 요건은 무엇입니까?", "이미 투자한 데이터 플랫폼이나 클라우드 약정(Databricks·Snowflake·Microsoft·AWS)이 있습니까? 데이터를 옮기지 않고 연결하길 원합니까?", "지금까지 해 본 GenAI·데이터 PoC는 무엇이고, 프로덕션에 못 간 이유는 무엇이었습니까? 지금 함께 검토 중인 대안(Microsoft Copilot·Fabric, Databricks, 자체 구축)이 있습니까?", "이 규모 소프트웨어는 보통 누가 어떤 절차로 결정합니까? 예산 주기·보안 심사·구매 중 무엇이 가장 오래 걸립니까?", "현업에서 Bootcamp에 며칠을 비울 수 있는 SME는 누구이고, 도입 뒤 이 화면을 매일 쓰게 만들 책임자는 누구입니까? 함께 일하는 SI 파트너가 있습니까?"], "objections": [{"objection": "\"결국 비싼 컨설팅 아닌가요? FDE 빠지면 우리 직원들은 아무것도 못 할 텐데요.\"", "response": "초기에 Palantir 인력 비중이 큰 건 사실이라고 인정하세요. 대신 확장 계획에 내부 빌더 육성을 같이 넣습니다 — Lear는 사내 펠로십으로 빌더를 키웠고, HD현대는 공동 CoE를 만들었습니다 [S67, S93]. 공식 자격(Associate 3종·Specialist 실기)과 파트너(BPO Moder, 미 연방은 Accenture Federal, 국내는 KT가 첫 premium partner — 역할 범위는 확인 필요)로 운영 인력 풀을 넓힐 수 있고, AI FDE가 반복 작업 일부를 가져갑니다 [S29, S96, S77, S104, S15]."}, {"objection": "\"이미 Databricks(또는 Snowflake)에 데이터가 다 있는데 또 플랫폼을 사요? 데이터 또 복사하는 거죠?\"", "response": "원천 테이블은 virtual table로 귀사 레이크하우스에 그대로 두고 가리킵니다. 다만 업무 객체로 쓰려면 온톨로지 인덱스(OSv2)는 Palantir에 생기고, virtual table은 브랜치·버전 관리가 안 되고 Foundry에서 레이크하우스로 직접 egress가 열려 있어야 한다는(agent·private link 경유 불가) 제약까지 말씀드립니다 [S234, S231]. AIP가 더하는 것은 그 위의 '결정과 실행' 계층(온톨로지·Action·HITL)이며, 양사는 2025년부터 공식 연동을 발표했습니다 [S205, S207]."}, {"objection": "\"LLM이 틀리면 누가 책임지죠? 환각이 무서워서 운영에 못 씁니다.\"", "response": "AI는 Action을 '제안'하고 사람이 승인하는 staging부터 시작합니다. Evals로 실제 케이스 점수를 측정해 자동화 비율을 단계적으로 올리고, 모든 실행은 감사 로그에 남습니다 [S10, S9]. Action에 writeback webhook을 걸면 원천(ERP) 반영이 성공한 경우에만 온톨로지 상태가 바뀝니다 [S230]."}, {"objection": "\"우리 데이터가 OpenAI나 외부로 나가는 건 안 됩니다. 망분리 규정도 있고요.\"", "response": "두 환경을 나눠 답하세요. ① 클라우드 enrollment: Palantir 관리 경로로 호출해 제공사가 데이터를 보관·재학습하지 않고, Markings allowlist로 특정 등급 데이터는 LLM 경로에서 아예 차단합니다 [S3, S22]. ② 망분리·에어갭: 외부 상용 API는 쓸 수 없으므로 내부에 배포한 오픈 모델이나 자체 모델(BYOM)을 쓰고, 품질 차이는 Evals로 측정해 업무 범위를 정합니다 [S21, S33, S20](현장 관행 추론). 고객의 규제 해석에 따라 ①이 가능한지 확인 질문을 던지세요. 국내 공공 클라우드 보안인증(CSAP) 보유 기록은 확인되지 않으므로 공공 고객에게는 '확인 후 답변'이 정직합니다 [S297]."}, {"objection": "\"가격표도 없고, 한번 깔면 못 빼잖아요.\"", "response": "락인 우려를 인정하세요(Bootcamp 단계부터 온톨로지가 쌓이며 전환 비용이 생긴다는 지적이 있습니다 [S54]). 원천 데이터는 고객 레이크하우스에 둘 수 있고 edit 결과는 materialization dataset으로 받을 수 있지만 [S234, S233], 온톨로지 정의·Logic·Workshop 앱은 다른 플랫폼으로 옮기는 표준이 없어 전환 비용이 남습니다. 그래서 Bootcamp → 파일럿 → 엔터프라이즈 계약의 단계별 약정과 KPI 게이트, 데이터·메타데이터 export 조항을 제안합니다(권고, 계약 관행)."}, {"objection": "\"전사로 넓히면 토큰·compute 비용이 몇십 배로 뛴다던데요.\"", "response": "맞는 우려입니다. 모델 선택만으로 토큰 비용이 약 20배 차이 나므로 분류·추출은 작은 모델, 판단만 큰 모델로 나눕니다 [S235]. 프로젝트별 reserved capacity·rate limit·토큰 사용량 export·에이전트별 비용 귀속(2026 콜 발표, 문서 확인 필요)으로 비용을 유스케이스 단위로 보이게 합니다 [S41, S47, S45, S193]."}, {"objection": "\"OpenAI나 Anthropic도 엔지니어를 보내서 다 만들어 준다는데, 굳이 Palantir요?\"", "response": "AIP는 특정 모델에 묶이지 않고 OpenAI·Anthropic·Google·자체 모델을 골라 쓰고 바꿀 수 있으며, 모델 밖의 영역(온톨로지·권한·write-back·에어갭 배포)을 책임집니다 [S20, S21, S31]. AIG CEO는 AIG Assist를 바탕으로 한 다음 단계 멀티 에이전트를 'Palantir·Anthropic과 긴밀한 파트너십으로' 시작했다고 밝혔습니다(모델 구성은 미공개) — 모델 회사와 Palantir는 대체가 아니라 분담 관계라는 예입니다 [S264, S263]. 공공 고객에게는 BYOM·자체 모델 등록을 먼저 말하세요. 'bake-off에서 랩을 이겼다'는 Palantir 주장은 회사 발언이므로 근거로 단정하지 마세요 [S64]."}, {"objection": "\"GenAI PoC만 벌써 스무 개 했어요. 또 PoC 하자는 거죠? NHS 기사 보니 효과도 없다던데요.\"", "response": "'그 기사는 정확한 지적을 담고 있습니다'로 시작하세요. NHS England 스스로 인과관계는 보일 수 없다는 단서를 달았고, 결론은 지표 정의(7일 이상 재원 코호트 vs 전체 병상)에 더해 도입 전부터의 하락 추세, 비교군, 데이터 품질(일부 트러스트가 데이터 오류 인정) 문제로 갈렸습니다 [S249, S250, S248, S254]. 그리고 그것은 Foundry 기반 사례입니다. 그래서 데모 데이터가 아니라 귀사 실데이터로 결정 하나에 대해 시작하고, Bootcamp 전에 지표 정의·분모·비교군·baseline 추세를 문서로 합의해 파일럿 KPI 게이트로 쓰자고 제안합니다 [S52]."}], "field_notes": [{"title": "온톨로지는 '결정'에서 역산하라", "detail": "데이터셋 목록에서 시작하면 끝없이 모델링하게 된다. '누가 어떤 결정을 내리나 → 그 결정에 필요한 객체·링크 → 결정 결과인 Action' 순서로 최소 모델을 만들고 넓혀라 [S156, S18]."}, {"title": "write-back은 'writeback webhook 1개 + side-effect 여러 개'", "detail": "원천이 system of record면 writeback webhook으로 원천을 먼저 바꾼다(실패 시 Action 전체 롤백). 알림·부가 반영은 side-effect webhook에 맡긴다. 외부는 성공하고 Ontology 반영이 실패하는 역방향은 보장되지 않으므로 원천 쪽 멱등키를 둬라 [S230]."}, {"title": "에이전트가 쓴 값이 ERP 값을 계속 덮어쓴다", "detail": "OSv2 기본 충돌 정책은 'Apply user edits'라 한 번 edit된 속성은 이후 원천이 갱신돼도 바뀌지 않는다 — 원천을 바꾸고 재수집해도 마찬가지다. 원천이 system of record인 속성은 Action에서 직접 edit하지 말고 writeback webhook만 호출한 뒤 재수집으로 반영하거나(edit 전용 속성과 원천 속성 분리), 해당 datasource를 'Apply most recent value'(UTC timestamp 필요)로 바꿔라. 이미 생긴 edit은 개별 undo가 불가하다 [S232]."}, {"title": "LLM 비용 = 모델 선택 × 출력 길이 × 재처리 여부", "detail": "공식 환산표상 작은 모델과 큰 모델의 토큰 요율이 약 20배, 출력은 입력의 4~5배다. 분류·추출은 작은 모델, 판단만 큰 모델로 나누고, Pipeline Builder LLM 노드는 'Skip recomputing rows'·incremental로 신규 행만 처리하고(프롬프트 변경 시 캐시 초기화 주의), 토큰 사용량 export를 첫 주부터 대시보드로 만들어라. 배치 작업은 용량의 최대 80%만 쓸 수 있다는 점도 일정에 반영하라 [S235, S293, S45, S295]."}, {"title": "일정은 Bootcamp가 아니라 '연결과 승인'이 결정한다", "detail": "1~5일 Bootcamp 앞뒤로 커넥터 설치·방화벽, InfoSec·외부 LLM 승인, SAP 기술 사용자 권한·transport가 수주~수개월씩 걸린다. 첫 미팅에서 이 승인 트랙을 병렬로 시작시키는 것이 FDE의 실제 일정 관리다(현장 관행 추정)."}, {"title": "virtual table은 '네트워크 설계'에서 먼저 막힌다", "detail": "virtual table은 Foundry worker와 direct egress가 전제다. agent proxy·agent worker 경유나 self-service private link 뒤의 레이크하우스는 지원하지 않는다. '복사 없이 붙여 달라'는 요청의 첫 질문은 모델링이 아니라 'Foundry에서 그 워크스페이스로 직접 egress가 열리느냐'다. 안 열리면 dataset 동기화로 가고 저장 비용·동기화 지연을 견적에 넣어라 [S234]."}, {"title": "계열사 복제 질문에는 'enrollment가 같나요?'로 되물어라", "detail": "같은 enrollment면 Marketplace(DevOps product) 설치로 끝난다. 다른 enrollment면 Foundry products[Beta]를 Apollo connected hub로 배포하며 Support 활성화가 필요하다. 운영 중인 Chatbot은 Global Branching 대상이 아니므로 버전 고정 + Evals 비교 + 단계적 publish로 관리한다 [S239, S320, S322]."}, {"title": "보안은 '읽기'와 '출력'을 따로 설계", "detail": "row/column 정책은 LLM이 읽는 것만 제한한다. Markings는 lineage로 전파되므로 LLM 출력·Ontology edit·하류 데이터셋 보호는 Markings·LLM allowlist로 설계하라 [S5, S22]."}, {"title": "면접 Decomposition = 이 플레이북의 축소판", "detail": "막연한 문제를 '입력 데이터 → 데이터 모델 → 비즈니스 로직 → 출력/행동 → 지표 → 파일럿 계획'으로 쪼개는 것이 핵심. 1분 만에 기술 솔루션으로 뛰어들거나 컨설팅 케이스 프레임만 읊으면 감점된다는 후기가 반복된다 [S156, S163, S157]."}, {"title": "면접에서 커머셜을 말하는 법", "detail": "FDE의 커머셜 기여는 가격 협상이 아니라 '작동하는 가치를 빨리, 측정 가능하게' 만드는 것이다: 결정 하나와 baseline → Bootcamp → 파일럿 KPI → 엔터프라이즈 계약 → 같은 온톨로지 위 인접 유스케이스. Karp는 콜에서 '정말로 파는' 사람은 7명뿐이라고 말했다(수사적 표현일 수 있음) — 영업 조직보다 제품·배포가 확장을 이끈다는 회사의 자기 인식으로 읽힌다(해석). NDR 157%는 확장이 성장의 축임을 보여준다 [S193, S196]. 분업: DS는 가치·이해관계자 정의, FDE는 데이터·온톨로지·Action으로 작동시키고 반복 수정을 제품으로 환류한다 [S166, S141]. 할인 약속·벤더 수치 단정은 피하라."}]}, "cases": [{"id": "us-army-2026", "date": "2026-09-24", "company": "U.S. Army", "anonymous": false, "industry": "국방·공공", "region": "US", "product": "Foundry 기반 Army Vantage + 로우코드 앱, Enterprise Agreement — AIP 명시 없음(콜 발언 기반 추정)", "title": "계약 75건을 하나로 묶은 EA, 그리고 탄약 관리 레거시 9개 대체", "headline": "10년 상한 $10B EA(2025-07) 위에서 $48.1M 탄약 관리 현대화 수주(2026-09)", "situation": "육군은 Palantir 관련 계약 75건(본계약 15, 관련 60)을 리셀러 수수료를 내며 따로 관리했고, 탄약은 레거시 플랫폼 9개에 흩어져 추적됐다 [S85, S108].", "problem": "조달 오버헤드, 그리고 육군 스스로 '작전 템포를 따라가지 못한다'고 평가한 탄약 책임관리 모델 [S108].", "solution": "Palantir 플랫폼 기반 Army Vantage(데이터 플랫폼)와 로우코드 앱으로 탄약 관리 시스템을 재구축 [S108, S67].", "touchpoint": "육군 데이터 플랫폼(Vantage), 탄약·물류 레거시 시스템 9개, 국방부 다른 기관도 EA로 구매 가능 [S85, S108].", "approach": "2025-07 10년·상한 $10B EA로 계약을 통합하고 물량 할인·리셀러 수수료 제거 → 2026-09 탄약 SW를 12개월 구축 + 5년 지원 조건으로 $48.1M 수주 [S85, S108].", "outcome": "공개된 것은 계약 규모뿐이며 운영 KPI는 아직 없다. $10B는 확정 지출이 아닌 상한이다 [S200, S108].", "inferred": ["solution"], "inference_note": "탄약 SW 기사에는 '로우코드/노코드'만 언급되고 AIP 명시는 없다. Vantage가 Palantir 플랫폼 기반이라는 회사 콜 발언(S67)을 근거로 연결했다. 쓰기 경로(레거시 이관 방식)는 공개되지 않았다.", "metrics": [{"label": "EA 상한", "value": "$10B / 10년", "note": "정부 발표, 확정 지출 아님"}, {"label": "통합 계약 수", "value": "75건 → 1", "note": "DefenseScoop"}, {"label": "탄약 SW", "value": "$48.1M", "note": "Defense News"}], "flow": {"caption": "흩어진 계약·레거시를 EA와 단일 데이터 플랫폼으로 수렴", "nodes": [{"id": "p", "label": "계약 75건·레거시 9개 분산", "lane": "problem"}, {"id": "s1", "label": "탄약 레거시 시스템 9개", "lane": "source"}, {"id": "s2", "label": "Army Vantage 데이터", "lane": "source"}, {"id": "ea", "label": "Enterprise Agreement", "lane": "solution"}, {"id": "app", "label": "탄약 관리 로우코드 앱", "lane": "solution"}, {"id": "u", "label": "탄약 관리관·지휘관", "lane": "user"}, {"id": "o", "label": "단일 계약·단일 탄약 뷰", "lane": "outcome"}], "edges": [{"from": "p", "to": "ea", "label": "계약 통합"}, {"from": "s1", "to": "app", "label": "데이터 이관·통합"}, {"from": "s2", "to": "app", "label": "플랫폼 공유"}, {"from": "ea", "to": "app", "label": "EA 하의 개별 발주"}, {"from": "app", "to": "u", "label": "책임관리 화면"}, {"from": "u", "to": "o"}]}, "sales_hook": "'계약 75건을 EA 1건으로 묶어 리셀러 수수료를 없애고 물량 할인을 받았습니다. EA는 다음 유스케이스의 조달 마찰을 줄이는 장치입니다($10B는 상한).'", "lessons": ["엔터프라이즈 계약은 '다음 유스케이스의 조달 마찰'을 줄이는 장치다 — 다만 개별 구축 기간(12개월)은 그대로 든다", "공공 사례는 계약 규모와 운영 성과를 구분해 말해야 한다"], "confidence": "high", "sources": ["S85", "S108", "S200", "S67"]}, {"id": "maven-2026", "date": "2026-09-22", "company": "U.S. DoD / NATO — Maven Smart System", "anonymous": false, "industry": "국방(AI 지휘통제)", "region": "US·NATO", "product": "Maven Smart System (Palantir 플랫폼 기반 AI C2) — AIP 명시 공식 문구 없음", "title": "사용자 2만 → 10만 명, 정식 획득 프로그램 전환이 지시된 국방 AI", "headline": "활성 사용자 20,000+(2025-05) → 사용자 100,000+(2026-09), 2026-03 국방부 메모로
