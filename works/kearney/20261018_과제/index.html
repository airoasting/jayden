    --paper-1: #26241f; --paper-2: #2a2338; --paper-3: #2f2a20; --paper-4: #232320; --rule: rgba(167, 116, 239, .14);

    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1px, transparent 1.2px);
    background-size: 14px 14px;

  .wrap { max-width: 1280px; margin: 0 auto; padding: 44px 28px 72px; }

  /* 카드 너비는 모두 같다. 행 높이는 행마다 같아지고 카드가 행을 꽉 채운다. */
  .board {
    display: grid; gap: 30px 24px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: stretch;
  }
  .card {
    position: relative; min-width: 0;
    background: var(--paper); box-shadow: var(--shadow);
    border-radius: 3px; padding: 22px 18px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card[hidden] { display: none; }
  /* 종이 종류 4가지를 돌려 쓴다 */
  .paper-1 { --paper: var(--paper-1); }
  .paper-2 { --paper: var(--paper-2); }
  .paper-3 { --paper: var(--paper-3); }
  .paper-4 {
    --paper: var(--paper-4);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  /* 마스킹 테이프 */
  .tape {
    position: absolute; top: -11px; left: 50%; width: 92px; height: 24px; z-index: 2;
    background: var(--tape); transform: translateX(-50%) rotate(var(--tt, -3deg));
    clip-path: polygon(3% 0, 97% 4%, 100% 50%, 96% 100%, 2% 96%, 0 50%);
  }
  .card:nth-child(3n) .tape { background: var(--tape-2); }
  /* 번호 스티커 */
  .sticker {
    position: absolute; top: 12px; right: -8px; z-index: 3;
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px;
    transform: rotate(var(--st, 8deg)); box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
  }

  /* 폴라로이드 사진: 결과 HTML 첫 화면 캡처(_thumbs/번호.jpg, 1280px 폭에서 찍어 640px로 줄임) */
  .photo {
    margin: 0; background: #fff; padding: 7px 7px 26px; box-shadow: 0 2px 8px rgba(0, 0, 0, .14);
    transform: rotate(var(--pt, -1.5deg)); position: relative;
  }
  .photo img { display: block; width: 100%; height: 210px; object-fit: cover; object-position: top center; background: #f3f3f3; }
  .photo figcaption {
    position: absolute; left: 0; right: 0; bottom: 3px; text-align: center;
    font-family: "Nanum Pen Script", cursive; font-size: 20px; color: #3c3a36; line-height: 1;
  }
  .photo a.cover { position: absolute; inset: 0; z-index: 1; }
  /* HTML이 없는 과제는 메모지로 대신한다 */
  .memo {
    margin: 0; height: 243px; padding: 16px 16px 14px; background: #fff6b8; color: #3c3a36;
    transform: rotate(var(--pt, 1.5deg)); box-shadow: 0 2px 8px rgba(0, 0, 0, .14);
    font-family: "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 1.6; overflow: hidden;

  .memo b { font-family: "Nanum Pen Script", cursive; font-size: 23px; font-weight: 400; display: block; margin-bottom: 4px; }

  .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .name {

  .slug { font-family: "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--muted); margin-top: -6px; }
  .sum { margin: 0; font-size: 14.5px; color: var(--ink-soft); }

  .links a, .links .off {

  .links .off { color: var(--disabled); border: 1.5px dashed var(--disabled); }

  .group-head h2 {

  .hero h1 { grid-area: title; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 32px; line-height: 1.05; letter-spacing: -0.03em; }

  .hero h1 .s1 { background: #7823dc; color: #fff; transform: rotate(-3deg); }
  .hero h1 .s2 { background: #fffdf8; color: #1e1e1e; transform: rotate(2deg); }
  .hero h1 .s3 { background: #d2cfff; color: #1e1e1e; transform: rotate(-1.5deg); font-family: "Nanum Pen Script", cursive; font-size: 38px; font-weight: 400; }
  .filters { grid-area: filters; justify-self: end; width: min(100%, 680px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .filters button {
    font: inherit; font-size: 14.5px; cursor: pointer; height: 40px; padding: 0 6px; border-radius: 4px; white-space: nowrap;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    border: 1.5px solid rgba(255, 255, 255, .3); background: transparent; color: var(--hero-ink);
  }
  .filters button small { opacity: .6; }
  .filters button i { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); flex: none; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5); }
  .filters button[aria-pressed="true"] { background: var(--hero-ink); color: #1e1e1e; border-color: var(--hero-ink); }
  @container (max-width: 940px) {
    .hero-in { grid-template-columns: minmax(0, 1fr); grid-template-areas: "eyebrow" "title" "filters"; }
    .filters { justify-self: stretch; width: auto; }
  }
  @container (max-width: 640px) {
    .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @container (max-width: 420px) {
    .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @container (max-width: 300px) { .filters { grid-template-columns: 1fr; } }

  @media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 540px) {

  @media (prefers-reduced-motion: no-preference) {
    .photo, .memo { transition: transform .2s ease; }
    .card:hover .photo, .card:hover .memo { transform: rotate(0deg) scale(1.02); }
  }
</style>

    tags: ["5항목 × 0~2점 채점", "check_pass.py 통과 판정", "예시: 나스닥·반도체 급락"],
    html: "ax-research/results/2026-10-17-nasdaq-semis-selloff/report.html", md: "ax-research/SKILL.md",
    extra: [["아티팩트판 HTML", "ax-research/results/2026-10-17-nasdaq-semis-selloff/report-artifact.html"], ["채점표", "ax-research/references/04-rubric.md"], ["리뷰 루프", "ax-research/references/05-review-loop.md"]]
  },
  {

    tags: ["4관점 리뷰(구조·안정성·검증·성능)", "승인 없이 구현 금지", "Codex·Claude Code 공용"],
    html: null, md: "SKILL.md"
  },
  {
    name: "조서현", group: "meet",
    title: "현황분석 인터뷰 시사점 장표화", slug: "kearney-interview-report",
    sum: "STT 회의록, 현장 손그림 노트, RFP를 받아 인터뷰 정리, 시사점, 도식 장표까지 만듭니다. 결과는 Kearney 스타일 HTML 보고서와 장표용 PNG입니다.",
    tags: ["팬아웃 → 파이프라인", "적대적 검증 + 완전성 비평", "멀티 에이전트"],

  },
  {

    title: "솔루션 딥리서치 및 적용 사례 도식화", slug: "solution-deep-research",
    sum: "솔루션 이름 하나로 개요, 기능과 제공 방식, FDE용 플레이북, 고객 적용 사례 도식, 객관식 퀴즈까지 담은 인터랙티브 HTML을 만듭니다.",
    tags: ["6인 역할(블랙·레드·블루·실버·골드·화이트)", "9.5점 이상까지 반복", "예시: Palantir AIP"],
    html: "솔루션 딥리서치 및 적용 사례/palantir-aip.html", md: "솔루션 딥리서치 및 적용 사례/SKILL - 복사본.md"

// 카테고리. 비슷한 일을 하는 Skill끼리 묶고, 이 순서대로 보드에 놓는다.
const GROUPS = [
  { key: "meet", short: "회의·인터뷰", title: "회의·인터뷰 정리", desc: "말로 오간 내용을 결정, 할 일, 시사점으로 바꿉니다.", dot: "var(--c-meet)" },
  { key: "case", short: "사례 조사", title: "사례·벤치마킹 조사", desc: "여러 사례를 같은 기준으로 모으고 비교합니다.", dot: "var(--c-case)" },
  { key: "deep", short: "딥리서치", title: "시장·솔루션 딥리서치", desc: "한 주제를 깊게 파고들어 근거 있는 보고서로 만듭니다.", dot: "var(--c-deep)" },
  { key: "auto", short: "업무 자동화", title: "개발·업무 자동화", desc: "팀이 반복하는 업무 절차를 Skill로 고정합니다.", dot: "var(--c-auto)" }
];
// 콜라주 장식용 기울기. 카드 순서대로 돌려 쓴다(카드와 버튼은 기울이지 않는다).
const TILT = [-2, 1.5, -1, 2.2, -1.8, 1, -2.4, 1.8, -1.2, 2, -1.6];

// 공백·괄호가 들어간 폴더명을 안전한 href로 바꾼다. 외부 URL은 그대로 둔다.
const href = p => /^https?:/.test(p) ? p : p.split("/").map(encodeURIComponent).join("/");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const link = (cls, p, label) => `<a class="${cls}" href="${href(p)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;
const pad = n => String(n).padStart(2, "0");

// 결과 HTML은 캡처 사진(폴라로이드)으로, HTML이 없으면 메모지로 보여 준다.
// 캡처 파일 이름은 제출 순서 번호(_thumbs/01.jpg ...)다.
const visual = (s, thumb) => s.html
  ? `<figure class="photo">
       <img src="_thumbs/${thumb}.jpg" alt="" loading="lazy">
       <figcaption>${esc(s.title)}</figcaption>
       <a class="cover" href="${href(s.html)}" target="_blank" rel="noopener" aria-label="${esc(s.title)} 결과 HTML 열기"></a>
     </figure>`
  : `<div class="memo"><b>SKILL.md만 제출</b>${esc(s.slug)}<br>${esc(s.sum)}</div>`;

const card = (s, n, g) => {
  const t = TILT[n % TILT.length], thumb = pad(SKILLS.indexOf(s) + 1);
  return `
  <article class="card skill paper-${(n % 4) + 1}" data-group="${g.key}"
           style="--dot:${g.dot}; --pt:${t}deg; --tt:${-t * 1.5}deg; --st:${t * 4}deg">
    <span class="tape"></span>
    <span class="sticker">${pad(n + 1)}</span>
    ${visual(s, thumb)}
    <div class="who"><span class="name">${esc(s.name)}</span><span class="cat">${esc(g.title)}</span></div>
    <h3>${esc(s.title)}</h3>
    <div class="slug">${esc(s.slug)}</div>
    <p class="sum">${esc(s.sum)}</p>
    <div class="tags">${s.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
    ${s.extra ? `<div class="extra">${s.extra.map(([l, p]) => `<a href="${href(p)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}</div>` : ""}
    <div class="links">
      ${s.html ? link("html", s.html, s.htmlLabel || "결과 HTML") : `<span class="off" title="이 과제는 SKILL.md만 제출됐습니다">HTML 없음</span>`}
      ${link("md", s.md, "SKILL.md")}
    </div>
  </article>`;
};

// 그룹 제목 → 그 그룹 카드 순으로 붙인다. 카드 번호는 보드에 놓인 순서다.
const board = document.getElementById("board");
let n = 0;
board.insertAdjacentHTML("beforeend", GROUPS.map(g => {
  const items = SKILLS.filter(s => s.group === g.key);
  return `
  <header class="group-head" data-group="${g.key}" style="--dot:${g.dot}">
    <h2>${esc(g.title)}</h2><span class="count">${items.length}개</span><p>${esc(g.desc)}</p>
  </header>` + items.map(s => card(s, n++, g)).join("");
}).join(""));

// 분류 필터
const opts = [{ key: "all", short: "전체" }, ...GROUPS];
const filters = document.getElementById("filters");
filters.innerHTML = opts.map((o, i) =>
  `<button type="button" aria-pressed="${i === 0}"${o.dot ? ` style="--dot:${o.dot}"` : ""}>${o.dot ? "<i></i>" : ""}${esc(o.short)}<small>${o.key === "all" ? SKILLS.length : SKILLS.filter(s => s.group === o.key).length}</small></button>`).join("");
filters.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const key = opts[[...filters.children].indexOf(b)].key;
  [...filters.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  board.querySelectorAll("[data-group]").forEach(el => el.hidden = key !== "all" && el.dataset.group !== key);
});
</script>
</body>
