<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[백업] NEXT HR SUMMIT | 강정구</title>
<!-- 원본: 삼성물산_강정구_20261009_v1.pptx (16:9, 3장). 좌표는 1280×720 캔버스 기준으로 옮겼다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --ink: #000;
    --ink-soft: #b0b0b0;
    --muted: #808080;
    /* NEXT HR SUMMIT: 로고 그린 #3ADD2E(사용자가 준 로고 이미지 표본), 로고 바탕 #111911. 코랄 #FF7878은 올리브영판에서 물려받은 보조색, 글자 #1A1A1A.
       템플릿 기본 바탕은 흰색. 그린은 면·막대·점에, 흰 바탕 위 글자 강조는 한 단계 진한 #1f9a14를 쓴다 */
    --oy-green: #1f9a14;
    --oy-green-ink: #3add2e;
    --oy-coral: #ff7878;
    --oy-ink: #f6f6f6;
    --oy-gray: #9aa2a9;
    /* 아래 이름은 IQVIA판에서 물려받은 변수명이다. 값만 올리브영 → HR 서밋으로 바꿨다 */
    --iq-indigo: #f6f6f6;
    --iq-blue: #3add2e;
    --iq-cyan: #ff7878;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #161616; overflow: hidden; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 1280×720 고정 캔버스를 화면에 맞춰 축소·확대한다 */
  .deck { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center; }
  .slide { position: absolute; inset: 0; background: #161616; overflow: hidden; display: none; }
  /* 한국어판: 단어 중간에서 줄이 끊기지 않게 한다 */
  .slide { word-break: keep-all; }
  .slide.active { display: block; }
  .abs { position: absolute; }
  .center { display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; }

  /* 공통 머리 (레이아웃 2) */
  /* 제목 위 광선: 제목 정렬선(x=76)의 기준점에서 출발해 화면 끝까지 가고, 1140부터 곡선 6가닥이 나팔꽃처럼 휘어 퍼진다(±20px). 본선은 끊김 없이 이어진다. 장이 보일 때마다(display 전환) 애니메이션이 처음부터 재생된다 */
  .head-mark { left: 0; top: 20px; width: 1280px; height: 60px; overflow: visible; }
  .hm-dot { fill: #f0f0f0; animation: hm-pop .6s cubic-bezier(.16,1,.3,1) .05s backwards; }
  .hm-dot-glow { animation: hm-pop .8s cubic-bezier(.16,1,.3,1) .05s backwards, hm-breathe 4s ease-in-out 1s infinite; transform-box: fill-box; transform-origin: center; }
  .head-mark path { fill: none; stroke-linecap: round; }
  .hm-line { stroke-width: 1.2; }
  .hm-glow { stroke-width: 6; opacity: .3; filter: blur(2.5px); }
  .hm-fan { stroke-width: 1; }
  .hm-line, .hm-glow, .hm-fan { stroke-dasharray: 1; stroke-dashoffset: 0; }
  .hm-line, .hm-glow { animation: hm-draw 1.4s cubic-bezier(.65,0,.35,1) .3s backwards; }
  .hm-fan  { animation: hm-draw .9s cubic-bezier(.16,1,.3,1) calc(1.3s + var(--k) * .05s) backwards; }
  .hm-spark { opacity: 0; mix-blend-mode: screen; animation: hm-spark 5s cubic-bezier(.45,.05,.35,1) 2.4s infinite; }
  @keyframes hm-draw  { from { stroke-dashoffset: 1; } }
  @keyframes hm-pop   { from { opacity: 0; transform: scale(.2); } }
  @keyframes hm-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  /* 헤드라인: 광선이 그어지기 시작하면 흐림에서 선명해지며 살짝 떠오른다. 장이 보일 때마다 다시 재생된다 */
  .head-title { animation: head-in 1.1s cubic-bezier(.16,1,.3,1) .4s backwards; }
  @keyframes head-in  { from { opacity: 0; transform: translateY(12px); filter: blur(6px); } }
  @keyframes hm-spark {
    0%   { transform: translateX(0);    opacity: 0; }
    8%   { opacity: 1; }
    55%  { transform: translateX(1024px); opacity: 1; }
    62%  { transform: translateX(1074px); opacity: 0; }
    100% { transform: translateX(1074px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .head-mark *, .head-title { animation: none !important; } .hm-spark { display: none; } }
  /* 헤드라인: 막대(40~44) 아래 60에서 시작하는 한 줄. 좌우 여백 76 안(76~1204)에 둔다. 위치 원칙은 같은 폴더 CLAUDE.md */
  .head-title {
    left: 76px; top: 60px; width: 1128px;
    font-size: 44.4px; font-weight: 700; letter-spacing: -1.78px; line-height: 1.1; white-space: nowrap;
  }

  /* 1. 표지 (HR 서밋 템플릿): 흰 바탕 + 오른쪽 행사 로고 배지 + 왼쪽 정렬 제목. 마무리 장도 같은 심볼을 같은 자리에 둔다 */
  /* 표지 오른쪽 행사 로고 배지: 사용자가 준 NEXT HR SUMMIT 로고(assets/logo-hrsummit.png, 원본 바탕 #111911)를 같은 바탕색의 264 정사각 안에 둔다.
     배치 기준: 오른쪽 끝을 1204에 둬 왼쪽 여백 76과 좌우 대칭을 맞추고, 윗변을 제목 윗변(236)에 맞춰 제목과 한 줄로 읽히게 한다. 마무리 장도 같은 자리에 고정한다 */
  .oy-symbol { left: 940px; top: 236px; width: 264px; height: 264px; overflow: visible; }
  .cover.play .oy-symbol, .closing.active .oy-symbol { animation: oy-sym 1.3s cubic-bezier(.16,1,.3,1) .1s backwards; }
  .hr-badge { border-radius: 24px; background: #111911; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hr-badge img { width: 224px; height: auto; display: block; }
  .hr-wm { margin: 0; font-size: 17px; font-weight: 800; line-height: 24px; letter-spacing: .06em; color: var(--oy-ink); white-space: nowrap; }
  /* 표지 왼쪽 위: 행사명 + 행사 주제(사용자 지정 문구)를 한 줄로. 주제는 그린 글자 */
  .hr-wm-theme { height: auto; }
  .hr-wm-theme span { font-weight: 700; letter-spacing: -.005em; color: var(--oy-green-ink); }
  @keyframes oy-sym { from { opacity: 0; transform: scale(.9); } }
  .cover { background: #161616; color: var(--oy-ink); }
  .cover-logo { left: 76px; top: 62px; height: 24px; }
  .cover h1 { left: 76px; top: 236px; margin: 0; font-size: 64px; font-weight: 700; line-height: 1.16; letter-spacing: -.025em; display: flex; flex-direction: column; }
  .cover .cover-sub { left: 76px; top: 332px; margin: 0; font-size: 24px; font-weight: 500; color: var(--oy-gray); letter-spacing: -.005em; }
  .cover-bar { left: 76px; top: 462px; }
  .cover .byline { left: 76px; top: 548px; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .cover .byline span { font-size: 22px; font-weight: 700; }
  .cover .byline time { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--oy-green-ink); }

  /* 등장 연출: 표지에 들어올 때마다 .play를 다시 붙여 처음부터 재생한다. 클래스가 없으면(인쇄 등) 최종 상태로 보인다 */
  .cover.play .cover-logo { animation: cv-rise 1s .2s cubic-bezier(.16,1,.3,1) backwards; }
  .cover.play h1 > span { animation: cv-rise 1.2s cubic-bezier(.16,1,.3,1) backwards; }
  .cover.play h1 > span:first-child { animation-delay: .5s; }
  .cover.play h1 > span:last-child { animation-delay: .7s; }
  .cover.play .cover-sub { animation: cv-rise 1.2s 1s cubic-bezier(.16,1,.3,1) backwards; }
  .cover.play .cover-bar { animation: oy-in .7s cubic-bezier(.16,1,.3,1) 1.3s backwards; }
  .cover.play .byline > * { animation: cv-rise 1.2s cubic-bezier(.16,1,.3,1) backwards; }
  .cover.play .byline span { animation-delay: 1.5s; }
  .cover.play .byline time { animation-delay: 1.65s; }
  @keyframes cv-rise { from { opacity: 0; transform: translateY(16px); filter: blur(6px); } }
  @media (prefers-reduced-motion: reduce) { .cover *, .closing * { animation: none !important; } }

  /* 2. 기술 패러다임 */
  .eras { left: 76px; top: 184px; width: 1128px; height: 354px; display: block; font-family: inherit; }
  .year { width: 106px; height: 33px; top: 193px; background: #000; color: #f6f6f6; font-size: 24.9px; font-weight: 700; padding-top: 2px; }
  .verb { width: 187px; height: 33px; top: 494px; border-radius: 5.5px; background: rgba(255,255,255,.08); color: #f6f6f6; font-size: 21.3px; font-weight: 700; padding-top: 2px; }
  .cat { width: 106px; height: 33px; top: 557px; font-size: 21.3px; }
  .logos { top: 601px; width: 282px; height: 50px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  .logos img { width: 50px; height: 50px; object-fit: contain; display: block; }
  .logos .rr { border-radius: 8px; }
  .logos .uber { border: 1.33px solid var(--muted); }
  .logos .gemini { border: 1.33px solid hsl(186 100% 60%); background: #808080; }
  .footnote { left: 76px; top: 684px; width: 1128px; height: 20px; font-size: 10.7px; color: var(--muted); display: flex; align-items: flex-end; }

  /* 다크 포맷(2장·4장): 커리어 여정과 같은 배경 */
  .slide.dark { background: #161616; color: #f6f6f6; }
  .slide.dark .year { background: #262626; color: #fff; }
  .slide.dark .verb { background: var(--oy-green); color: var(--oy-ink); }
  .slide.dark .cat { color: #f6f6f6; }
  .slide.dark .footnote { color: #7f878e; }

  /* 하단 여백 통일: 콘텐츠 장의 본문 아래 끝을 y 650에 맞춘다(주석 684~704와 34 간격). 본문이 짧거나 긴 장은 section에 --bs로 본문 블록 전체를 위아래로 옮긴다.
     헤드라인, 막대, 서브타이틀(필·부제·범례·로고), 주석은 움직이지 않는다 */
  .slide[style*="--bs"] > .abs:not(.head-bar):not(.head-title):not(.footnote):not(.sp-track):not(.case-logo):not(.cr-sub):not(.rp-sub):not(.rp-legend):not(.sp-sub),
  .slide[style*="--bs"] > :not(.abs) > .abs { margin-top: var(--bs); }
  /* 순차 등장(2장·4장): 스크립트가 일정 간격으로 .on을 붙여 한 묶음씩 나타나게 한다 (2장은 한 시대, 4장은 원 하나) */
  .slide.dark [data-step] {
    opacity: 0; translate: 0 18px; filter: blur(6px);
    transition: opacity .7s cubic-bezier(.16,1,.3,1), translate .9s cubic-bezier(.16,1,.3,1), filter .7s ease;
  }
  .slide.dark rect[data-step] { translate: none; filter: none; }
  .slide.dark [data-step].on { opacity: 1; translate: 0 0; filter: none; }
  .slide.dark .year.on { transition-delay: .08s; }
  .slide.dark .verb.on { transition-delay: .16s; }
  .slide.dark .cat.on { transition-delay: .24s; }
  .slide.dark .logos.on { transition-delay: .32s; }
  .slide.dark.instant [data-step] { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .slide.dark [data-step] { transition: none; translate: none; filter: none; } }

  /* 메시지 장(내 소개 다음): 네 가지 색 구절이 먼저 뜨고, 나머지 흰 글자가 뒤따라 문장을 완성한다 */
  .slide.dark.thesis { background: #161616; }
  .thesis-text {
    left: 0; top: 0; width: 1280px; height: 720px; flex-direction: column;
    font-size: 30px; font-weight: 800; line-height: 2; letter-spacing: -.025em; color: #f6f6f6;
  }
  .thesis-text span[data-step] { translate: none; }
  .thesis-text span[data-step="1"] { translate: 0 10px; } .thesis-text span[data-step="1"].on { translate: 0 0; }
  /* 네 구절은 색 필 버튼: 같은 색 계열을 한 단계 진하게 채우고 흰 글자 */
  .thesis-text .c1, .thesis-text .c2, .thesis-text .c3, .thesis-text .c4 { display: inline-block; padding: 0 18px; margin: 0 2px; border-radius: 999px; line-height: 1.5; color: #fff; box-shadow: 0 6px 18px rgba(16,24,32,.10); }
  /* 올리브영판에서 물려받음: 회색 → 잉크 → 코랄 → 그린 순으로 진해져, 마지막 '정착'이 브랜드 그린으로 끝난다 */
  .thesis-text .c1 { background: #8a939b; }
  .thesis-text .c2 { background: #262626; }
  .thesis-text .c3 { background: #ff7878; }
  .thesis-text .c4 { background: #1f9a14; color: #f6f6f6; }
  .thesis-text .c2.on { transition-delay: .15s; }
  .thesis-text .c3.on { transition-delay: .3s; }
  .thesis-text .c4.on { transition-delay: .45s; }
  /* 5장 검정 배경(2026-10-26 사용자 지정): 문장은 흰 글자, 잉크 필(c2)은 흰 필 + 잉크 글자 */
  .thesis.demo-bk .thesis-text { color: #f6f6f6; }
  .thesis.demo-bk .thesis-text .c2 { background: #f6f6f6; color: #1a1a1a; }
  .thesis.demo-bk .thesis-text .c1, .thesis.demo-bk .thesis-text .c2, .thesis.demo-bk .thesis-text .c3, .thesis.demo-bk .thesis-text .c4 { box-shadow: none; }

  /* 4. 에이전트 팀: 큰 원 3개(배수) + 아래 슬래시 명령 */
  .agent { top: 240px; width: 240px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .ring {
    width: 240px; height: 240px; border-radius: 50%; display: grid; place-items: center;
    border: 3px solid transparent;
    background:
      radial-gradient(circle at 50% 32%, #161616 0%, #0e260b 72%) padding-box,
      conic-gradient(from 210deg, #ff7878, #1f9a14, #3add2e, #1f9a14, #ff7878) border-box;
    box-shadow: 0 0 64px rgba(58,221,46,.14), inset 0 0 32px rgba(255,120,120,.12);
  }
  .mult { display: flex; align-items: baseline; font-size: 96px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: #f6f6f6; font-variant-numeric: tabular-nums; }
  .mult i { font-style: normal; font-weight: 400; font-size: .5em; color: #9aa2a9; margin-right: 6px; letter-spacing: 0; }
  .cmd {
    font: 500 20px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .02em; color: #c9cdd1;
    padding: 10px 18px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,.03);
  }
  .cmd span { color: #7f878e; margin-right: 1px; }

  /* 8. 세 가지 변화: 오피스 공간 이야기라서 카드마다 같은 문법의 아이소메트릭 공간 일러스트를 둔다.
     카드 352 × 3 + 간격 36 → 76~1204. 순서: 일러스트 → 번호·이름 → 질문 → 구분선 → 키워드 */
  .pillar {
    top: 196px; width: 352px; height: 452px; display: flex; flex-direction: column; padding: 22px 30px 30px;
    border-radius: 22px; border: 1px solid rgba(255,255,255,0.22);
    background:
      radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.2px) 0 0 / 18px 18px,
      radial-gradient(120% 70% at 50% 0%, rgba(58,221,46,.12), transparent 62%),
      linear-gradient(180deg, #161616, #141414);
    box-shadow: 0 24px 60px rgba(16,24,32,.08), inset 0 1px 0 rgba(26,26,26,.04);
  }
  /* 카드 강조: 강조된 카드는 떠오르며 테두리가 빛나고, 나머지는 흐려진다 */
  .slide.dark .pillar[data-step] {
    transition: opacity .6s cubic-bezier(.16,1,.3,1), translate .7s cubic-bezier(.16,1,.3,1), filter .6s ease, box-shadow .6s ease, border-color .6s ease;
  }
  .slide.dark.hl-on .pillar.on:not(.hl) { opacity: .38; filter: saturate(.5); }
  .slide.dark.hl-on .pillar.on.hl {
    translate: 0 -10px; border-color: rgba(58,221,46,.55);
    box-shadow: 0 0 0 1px rgba(58,221,46,.35), 0 30px 80px rgba(58,221,46,.28), inset 0 1px 0 rgba(26,26,26,.08);
  }
  .pillar .iso { display: block; width: 100%; height: 156px; margin-bottom: 24px; }
  .iso-floor { fill: rgba(58,221,46,.06); stroke: rgba(230,234,238,.35); stroke-width: 1; }
  .iso-grid  { fill: none; stroke: rgba(230,234,238,.12); stroke-width: .8; }
  .iso-t { fill: #0b0b0b; stroke: rgba(230,234,238,.7); stroke-width: 1; stroke-linejoin: round; }
  .iso-l { fill: #1e1e1e; stroke: rgba(230,234,238,.55); stroke-width: 1; stroke-linejoin: round; }
  .iso-r { fill: #222222; stroke: rgba(230,234,238,.45); stroke-width: 1; stroke-linejoin: round; }
  .iso-tile { fill: rgba(58,221,46,.16); stroke: rgba(58,221,46,.65); stroke-width: .9; }
  .iso-l-glass, .iso-r-glass, .iso-t-glass { fill: rgba(58,221,46,.05); stroke: rgba(230,234,238,.32); stroke-width: .8; }
  .iso-l-screen, .iso-r-screen, .iso-t-screen { fill: #1a4a14; stroke: rgba(58,221,46,.7); stroke-width: .8; }
  .iso-head { fill: rgba(255,120,120,.45); stroke: none; }
  .iso-card { fill: rgba(255,255,255,.22); stroke: rgba(255,255,255,.45); stroke-width: .5; }
  .iso-bar  { fill: rgba(255,120,120,.18); stroke: rgba(255,120,120,.55); stroke-width: .8; }
  .iso-thin { fill: none; stroke: rgba(230,234,238,.35); stroke-width: .8; }
  .iso-link { fill: none; stroke: rgba(58,221,46,.55); stroke-width: 1; stroke-dasharray: 3 3; }
  .iso-graph { fill: none; stroke: #3add2e; stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: 1; }
  .iso-led { fill: #3add2e; animation: iso-led 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .pillar.on .iso-graph { animation: hm-draw 1.6s cubic-bezier(.65,0,.35,1) .5s backwards; }
  @keyframes iso-led { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .pillar .ph { display: flex; align-items: center; gap: 14px; }
  .pillar .pill {
    flex: none; height: 30px; min-width: 30px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.45); background: rgba(58,221,46,.10);
    font: 600 15px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #c9cdd1;
  }
  .pillar h3 { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: #f6f6f6; }
  .pillar .q { margin-top: 16px; font-size: 22px; font-weight: 500; line-height: 1.45; color: #9aa2a9; letter-spacing: -.01em; word-break: keep-all; }
  /* 핵심어 칸을 두 줄 높이로 고정해 세 카드의 구분선이 같은 높이에 선다 */
  .pillar .kw {
    margin-top: auto; padding-top: 18px; height: 82px; box-sizing: border-box; line-height: 1.24; border-top: 1px solid rgba(255,255,255,0.22);
    font-size: 25px; font-weight: 700; letter-spacing: -.02em;
    color: #3add2e;
  }

  /* 9. 내 책상: 장이 보일 때마다 책상 → 기기 → 화면(맥북 → 모니터 1 → 모니터 2) 순으로 켜진다.
     이후 모니터 2의 터미널 4칸에서 에이전트 로그가 각자 다른 속도로 위로 흐르고, 맥 미니 표시등·커서·상태 점·커피 김이 반복된다 */

  .desk-mac-title { position: absolute; left: 152px; top: 404px; width: 104px; height: 19px; padding-left: 5.5px; background: linear-gradient(90deg, #050c1a, #07111f); color: #dfe4ec; font-size: 11.8px; font-weight: 600; letter-spacing: -.2px; line-height: 19px; white-space: nowrap; transform: skewY(-4.5deg); transform-origin: 0 0; }

  /* 커피잔 김: 잔 입구(약 x 678, y 474) 위로 세 가닥이 번갈아 피어오르며 흩어진다 */

  .desk-steam path { fill: none; stroke: rgba(235,240,248,.55); stroke-width: 3.2; stroke-linecap: round; opacity: 0; animation: dk-steam-rise 4.2s ease-in-out infinite; animation-delay: calc(var(--k) * 1.4s); transform-box: fill-box; transform-origin: 50% 100%; }

     머리말은 또렷한 한국어, 본문은 알아볼 수 없을 만큼 작은 글자로 천천히 흐른다 */
  .desk-term { position: absolute; left: 687px; top: 227px; width: 358px; height: 213px; background: #070a10; border-radius: 2px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 18px rgba(120,170,255,.12); font-family: "SF Mono", Menlo, "Pretendard", monospace; }

  /* 표 행은 translate가 먹지 않으므로 순차 등장은 흐림·투명도만 쓴다 */

  /* 16-1. 사람이 모이는 이유: 카드 둘(함께 판단하기 · 서로 연결되기) + 오른쪽 근거 기둥. 연결 카드를 시안으로 강조한다 */

  /* 한국어판: 현상(왼쪽 근거) → 대안(오른쪽 카드 둘) */

  /* 16-2. 회의 변화 사례: 카드 셋(팀 안 · 회사 사이 · 열린 시장). 위에서부터 영역, 출처, 발견, 회의에서 바뀌는 점 */

  .md-tbl { left: 76px; top: 176px; width: 1128px; border-collapse: collapse; table-layout: fixed; }

  /* 질문 말풍선(.qz-bub): 잉크 말풍선, 아래 꼬리가 답한 칸을 가리킨다. left는 칸 가운데 x, top은 칸 윗변 - 10.
     정렬 c = 가운데, l = 꼬리를 왼쪽 40px에, r = 꼬리를 오른쪽 24px에 둬 좌우 여백선(76~1204) 안에 머문다 */
  .qz-bub { margin: 0; padding: 12px 18px 13px; border-radius: 12px; background: #262626; color: #fff; white-space: nowrap; z-index: 3;
    transform: translate(-50%, -100%); box-shadow: 0 10px 28px rgba(16,24,32,.22); }
  .qz-bub.l { transform: translate(-40px, -100%); }
  .qz-bub.r { transform: translate(calc(-100% + 24px), -100%); }
  .qz-bub::after { content: ''; position: absolute; bottom: -7px; left: 50%; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #c9cdd1; }
  .qz-bub.l::after { left: 40px; } .qz-bub.r::after { left: auto; right: 24px; margin: 0 -7px 0 0; }
  .qz-bub q { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.02em; quotes: '“' '”'; }
  .qz-bub b { display: block; margin-top: 5px; font-size: 13px; font-weight: 700; color: #a6ef6e; }
  .slide.dark .qz-bub.on:has(~ .qz-bub.on) { opacity: 0; translate: 0 6px; }
  .qz-mark { box-sizing: border-box; border: 3px solid #3add2e; border-radius: 4px; z-index: 2; pointer-events: none; }
  .slide.dark .qz-mark[data-step] { translate: none; filter: none; }
  .qz-mark.on { animation: qz-pop .6s cubic-bezier(.34,1.56,.64,1) backwards; }
  @keyframes qz-pop { from { transform: scale(1.4); } }

  /* AI는 그거 못해(.qa): 질문(회색, 따옴표) → 모델(굵게) · 시점. 줄 폭 1128(콘텐츠 영역 76~1204 전체), 질문 열 520, 화살표 48, 모델 열 나머지, 시점은 오른쪽 끝 */
  .qa-row { left: 76px; width: 1128px; height: 48px; box-sizing: border-box; padding: 0 24px; border-radius: 10px; display: flex; align-items: center;
    background: #141414; border: 1px solid #444444; white-space: nowrap; }
  .qa-row q { width: 520px; flex: none; font-size: 16px; font-weight: 600; color: #9aa2a9; letter-spacing: -.01em; quotes: '“' '”'; overflow: hidden; text-overflow: ellipsis; }
  .qa-row i { width: 48px; flex: none; font-style: normal; font-size: 16px; font-weight: 700; color: #3add2e; }
  .qa-row b { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; color: #f6f6f6; letter-spacing: -.01em; }
  .qa-row time { flex: none; margin-left: 12px; font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #7f878e; }

  /* 헤드라인 꼬리 ", 아직은": 폭 0에서 펼쳐져 닫는 따옴표를 밀어내고, 이어서 "아직은" 아래 그린 밑줄이 왼쪽부터 그어진다 */
  .slide.dark.qa .qa-later[data-step] { display: inline-block; vertical-align: bottom; max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; translate: none; filter: none;
    transition: max-width 1s cubic-bezier(.16,1,.3,1) .6s, opacity .6s ease .6s; }
  .slide.dark.qa .qa-later[data-step].on { max-width: 320px; opacity: 1; }
  .qa-later em { position: relative; font-style: normal; color: #3add2e; }
  .qa-later em::after { content: ''; position: absolute; left: 0; right: 0; bottom: 3px; height: 5px; border-radius: 3px; background: #1f9a14; transform: scaleX(0); transform-origin: left; transition: transform .7s cubic-bezier(.65,0,.35,1) 1.4s; }
  .qa-later.on em::after { transform: scaleX(1); }
  .slide.dark.instant .qa-later em::after { transition: none; }

  /* Ramp AI Index 선 차트(.rp): 선 2px, 격자는 옅게, 끝 라벨은 글자색(잉크·회색) + 값. 장에 들어오면 선이 왼쪽부터 그어지고 끝 라벨이 뒤따른다 */
  .rp-sub { left: 76px; top: 168px; margin: 0; font-size: 20px; font-weight: 600; color: #9aa2a9; letter-spacing: -.01em; }
  .rp-legend { right: 76px; top: 172px; margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #c9cdd1; }
  .rp-legend i { width: 18px; height: 3px; border-radius: 2px; margin-left: 12px; }
  .rp-legend i.an { background: #f06464; } .rp-legend i.oa { background: #1f9a14; }
  .rp-legend i.all { background: repeating-linear-gradient(90deg, #98a1a8 0 5px, transparent 5px 8px); } .rp-legend i.etc { background: #4a4f54; }
  .rp-chart { left: 0; top: -17px; width: 1280px; height: 720px; overflow: visible; }   /* 축 글자 아래 끝을 650에 맞춤 */
  .rp-grid { stroke: #444444; stroke-width: 1; } .rp-grid.base { stroke: #666666; }
  .rp-ax { font: 500 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #98a1a8; }
  .rp-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .rp-line.an { stroke: #f06464; stroke-width: 3; } .rp-line.oa { stroke: #3add2e; stroke-width: 3; }
  /* 점선 선은 pathLength를 두지 않는다(pathLength=1이면 6 5 간격이 선 전체보다 길어져 실선으로 보인다) */
  .rp-line.all { stroke: #98a1a8; stroke-dasharray: 6 5; } .rp-line.etc { stroke: #666666; stroke-width: 1.5; }
  .rp-lead { fill: none; stroke: #666666; stroke-width: 1; }
  .rp-end { font-size: 14px; font-weight: 600; fill: #9aa2a9; }
  .rp-end .v { font-weight: 700; } .rp-end.an, .rp-end.oa { font-size: 16px; fill: #f0f0f0; } .rp-end.an .v { fill: #e8504f; } .rp-end.oa .v { fill: #3add2e; }
  .rp-end.all { fill: #c9cdd1; }
  /* 토큰 사용량(.tk): OpenRouter 주간 토큰 누적 막대 40주(2026.1~10). 색은 개발사 묶음, 장에 들어오면 왼쪽부터 자람(tk-go). 오른쪽은 1월·10월 첫 주 상위 5개 모델 */
  .tk .rp-sub { color: #f6f6f6; font-weight: 800; }
  .tk .rp-ax { fill: #f0f0f0; }
  .tk-go { width: 0; height: 0; }
  .tk-legend { left: auto; right: 76px; top: 174px; margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #c9cdd1; }
  .tk-legend i { width: 12px; height: 12px; border-radius: 3px; margin-left: 10px; } .tk-legend i:first-child { margin-left: 0; }
  .tk-s { stroke: #000; stroke-width: .8; }
  .tk-s.ds, .tk-legend i.ds, .tk-wk i.ds { fill: #3add2e; background: #1f9a14; }
  .tk-s.cn, .tk-legend i.cn, .tk-wk i.cn { fill: #9ee86a; background: #9ee86a; }
  .tk-s.an, .tk-legend i.an, .tk-wk i.an { fill: #ff7878; background: #ff7878; }
  .tk-s.oa, .tk-legend i.oa, .tk-wk i.oa { fill: #f0f0f0; background: #262626; }
  .tk-s.etc, .tk-legend i.etc, .tk-wk i.etc { fill: #98a1a8; background: #98a1a8; }
  .tk-s.oth, .tk-legend i.oth { fill: #222222; background: #222222; }
  .tk-bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .55s cubic-bezier(.16,1,.3,1) var(--d, 0s); }
  .tk:has(.tk-go.on) .tk-bar { transform: scaleY(1); }
  .tk-anns { opacity: 0; transition: opacity .4s 1.5s; } .tk:has(.tk-go.on) .tk-anns { opacity: 1; }
  .slide.dark.instant .tk-bar, .slide.dark.instant .tk-anns { transition: none; }
  .tk-val { font-size: 15px; font-weight: 800; fill: #f0f0f0; } .tk-val.last { font-size: 18px; fill: #3add2e; }
  .tk-brk { fill: none; stroke: #3add2e; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .tk-pill rect { fill: #3add2e; } .tk-pill text { font-size: 18px; font-weight: 800; fill: #f0f0f0; }
  .tk-bub { margin: 0; padding: 7px 12px; border-radius: 10px; background: #262626; color: #fff; font-size: 13.5px; font-weight: 700; white-space: nowrap; opacity: 0; transition: opacity .4s 1.7s; }
  .tk-bub::after { content: ""; position: absolute; left: 12px; bottom: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #c9cdd1; }
  .tk:has(.tk-go.on) .tk-bub { opacity: 1; } .slide.dark.instant .tk-bub { transition: none; }
  .tk-top { left: 848px; top: 220px; width: 356px; height: 430px; display: flex; flex-direction: column; gap: 12px; }
  .tk-wk { flex: 1; box-sizing: border-box; padding: 16px 18px; border-radius: 14px; background: #141414; border: 1px solid #4a4a4a; }
  .tk-wk.hot { background: #0e260b; border: 1.5px solid #3add2e; }
  .tk-wk h4 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 800; color: #f6f6f6; }
  .tk-wk h4 small { font-size: 13px; font-weight: 700; color: #9aa2a9; }

  .tk-wk li b { font-weight: 800; color: #f6f6f6; font-variant-numeric: tabular-nums; }
  .tk-wk.hot li b { color: #3add2e; }
  .tk-note { margin: 0; font-size: 14px; font-weight: 700; color: #f6f6f6; text-align: right; } .tk-note b { color: #3add2e; }
  /* 이미지·영상 생성(.tm): 12장(.tk) 막대·괄호선·필을 그대로 쓰고, 개발사 색만 다르게 */
  .tk-s.go, .tk-legend i.go { fill: #3add2e; background: #1f9a14; }
  .tk-s.bd, .tk-legend i.bd { fill: #9ee86a; background: #9ee86a; }

  /* 로봇 대체 시나리오 차트(.rb): 12장 Ramp 차트 문법. 기본 그린, 급진 코랄, 범위 확대는 같은 색 점선. 회색 점선 기준선 46%·34%, 10% 문턱선 */
  .rb .rp-sub, .rb .rp-ax { color: #f6f6f6; fill: #f0f0f0; }
  .rb .rp-sub { font-weight: 800; }
  .rp-line.all.rb-d { stroke-dasharray: 6 5; stroke-width: 2; } .rp-line.rb-d.oa { stroke: #3add2e; } .rp-line.rb-d.an { stroke: #f06464; }
  .rp-legend i.d.oa { background: repeating-linear-gradient(90deg, #1f9a14 0 5px, transparent 5px 8px); } .rp-legend i.d.an { background: repeating-linear-gradient(90deg, #f06464 0 5px, transparent 5px 8px); }
  .rb-band { fill: #2a1f12; }   /* 기본 시나리오가 10%에 닿는 2060년대를 옅은 주황 면으로 구분 */
  .rb-band-t { font-size: 13px; font-weight: 800; fill: #d9822b; }
  .rb-ref { stroke: #98a1a8; stroke-width: 1; stroke-dasharray: 4 4; }
  .rb-ref-t { font-size: 13px; font-weight: 600; fill: #9aa2a9; }
  .rb-ten { stroke: #e6e6e6; stroke-width: 1; stroke-dasharray: 3 4; opacity: .5; }
  .rb-mk circle { fill: #0b0b0b; stroke-width: 2.5; } .rb-mk circle.a { stroke: #f06464; } .rb-mk circle.b { stroke: #3add2e; }
  .rb-mk-t { font-size: 15px; font-weight: 800; } .rb-mk-t.a { fill: #e8504f; } .rb-mk-t.b { fill: #3add2e; }
  .rp-end.dim { font-size: 14px; fill: #9aa2a9; }
  .rp.active .rb-mk, .rp.active .rb-band, .rp.active .rb-band-t { animation: dk-fade .8s ease 1.9s backwards; }
  /* 점선도 왼쪽에서 오른쪽으로 그려지듯 나타나게: 점선은 dasharray를 쓰므로 선 그리기 대신 clip-path로 드러낸다 */
  .rp.active.rb .rb-ref, .rp.active.rb .rb-ten { animation: rb-wipe .9s cubic-bezier(.65,0,.35,1) .1s backwards; }
  .rp.active.rb .rp-line.rb-d { animation: rb-wipe 1.3s cubic-bezier(.65,0,.35,1) 1.4s backwards; }
  @keyframes rb-wipe { from { clip-path: inset(-10px 100% -10px 0); } to { clip-path: inset(-10px 0 -10px 0); } }
  /* 25장 주가 차트(.sk): 기반 시스템 회색 실선, 급락 구간 음영 */
  .rp-line.mid { stroke: #98a1a8; stroke-width: 2; } .rp-legend i.mid { background: #98a1a8; }
  .rp-end.mid { fill: #9aa2a9; }
  .sk .rp-sub { color: #f6f6f6; font-weight: 800; }
  .sk .rp-ax { fill: #f0f0f0; }
  .sk-band { fill: rgba(240,100,100,.08); }
  .sk-band-t { font-size: 12px; font-weight: 600; fill: #e8504f; }
  .sk-band-d { font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #e8504f; opacity: .8; }
  .sk .rp-end { font-size: 15px; } .sk .rp-end.oa, .sk .rp-end.an { font-size: 16px; }
  .rp.active .sk-band, .rp.active .sk-band-t, .rp.active .sk-band-d { animation: dk-fade 1s ease 1.6s backwards; }
  .rp.active .rp-line:not(.all) { stroke-dasharray: 1; animation: hm-draw 1.8s cubic-bezier(.65,0,.35,1) .3s backwards; }
  .rp.active .rp-line.all { animation: dk-fade 1.2s ease .3s backwards; }
  .rp.active .rp-ends { animation: dk-fade .8s ease 1.9s backwards; }
  @media print { .rp .rp-line:not(.all) { stroke-dasharray: none; } .rp .rp-line.all { stroke-dasharray: 6 5; } }

  /* 키 메시지 카드(.km): 번호(그린 글자), 메시지(굵게 크게), 아래 근거(회색). 근거 칸을 카드 아래에 붙여 세 카드의 구분선 높이를 맞춘다 */
  .km-card { top: 196px; width: 352px; height: 444px; box-sizing: border-box; padding: 36px 30px 30px; border-radius: 20px; display: flex; flex-direction: column;

  .km-card h3 { margin: 16px 0 0; font-size: 25px; font-weight: 800; line-height: 1.38; letter-spacing: -.03em; color: #f6f6f6; word-break: keep-all; }
  .km-card ul { list-style: none; margin: auto 0 0; padding: 20px 0 0; height: 152px; box-sizing: border-box; border-top: 1px solid #4a4a4a; display: flex; flex-direction: column; gap: 10px; }
  .km-card li { position: relative; padding-left: 14px; font-size: 15.5px; line-height: 1.5; color: #c9cdd1; word-break: keep-all; }

  .km-rt .km-card ul { height: 206px; }   /* AI 모델 시사점: 01 카드 불릿이 셋이라 세 카드 구분선을 함께 올림 */ /* 서브타이틀 필이 있는 장: 본문을 y 220부터 */

  /* 개인 간 AI 격차(.gp): 카드 셋(교육 증가 → 현재 나뉜 인력 구성 → 경험 격차). 분석 시점은 필(.gp-date). 진한 강조는 3번 카드 하나 */
  .gp-card { top: 220px; width: 352px; height: 430px; box-sizing: border-box; padding: 28px 28px 24px; border-radius: 20px; display: flex; flex-direction: column;
    background: #141414; border: 1px solid #444444; }
  .gp-card.hot { background: #0e260b; border-color: #3add2e; box-shadow: 0 16px 40px rgba(58,221,46,.16); }
  .gp-k { font-size: 15px; font-weight: 800; color: #3add2e; letter-spacing: -.01em; }
  .gp-big { margin-top: 14px; font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: #f6f6f6; white-space: nowrap; }
  .gp-big i { font-style: normal; font-size: 30px; color: #7f878e; margin: 0 8px; vertical-align: middle; }
  .gp-card p { margin: 14px 0 0; font-size: 16px; line-height: 1.5; font-weight: 600; color: #c9cdd1; word-break: keep-all; }

  .gp-date { position: absolute; top: 24px; right: 24px; padding: 5px 11px; border-radius: 999px; border: 1px solid #575757; background: #161616;

  .gp-rows dd { margin: 4px 0 0; display: flex; align-items: center; gap: 12px; }
  .gp-rows dd b { flex: none; min-width: 84px; font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: #f6f6f6; }
  .gp-rows dd span { font-size: 13.5px; line-height: 1.45; font-weight: 600; color: #c9cdd1; word-break: keep-all; }
  /* 1번 카드 막대(.gp-chart): 58% = 170px 기준 비례. 카드가 뜰 때 막대가 아래에서 자란다 */
  .gp-chart { margin-top: 30px; height: 214px; display: flex; align-items: flex-end; justify-content: center; gap: 56px; border-bottom: 1px solid #666666; }
  .gp-col { width: 84px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .gp-col b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: #9aa2a9; margin-bottom: 8px; }
  .gp-col.hot b { font-size: 34px; color: #f6f6f6; }
  .gp-col i { display: block; width: 84px; border-radius: 6px 6px 0 0; background: #4a4f54; transform-origin: bottom; transition: transform .9s cubic-bezier(.16,1,.3,1) .3s; }
  .gp-col.hot i { background: #1f9a14; }
  .gp-col span { position: absolute; bottom: -24px; font: 600 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #9aa2a9; }
  .gp-card:not(.on) .gp-col i { transform: scaleY(0); }
  .gp-card p.gp-lead { margin-top: 30px; }
  .gp-lead { font-size: 18px !important; font-weight: 800 !important; color: #f6f6f6 !important; line-height: 1.45 !important; }
  .gp-segs { list-style: none; margin: 30px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .gp-segs li { display: grid; grid-template-columns: 64px 1fr; align-items: baseline; row-gap: 6px; }
  .gp-segs b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: #f6f6f6; }
  .gp-segs span { font-size: 13px; font-weight: 600; color: #c9cdd1; white-space: nowrap; }
  .gp-segs i { grid-column: 1 / -1; display: block; height: 10px; border-radius: 5px; }
  .gp-segs .a i { background: #1f9a14; } .gp-segs .a2 i { background: #a6ef6e; } .gp-segs .b i { background: #4a4f54; } .gp-segs .c i { background: #ff7878; }
  /* 3번 카드 비교 막대(.gp-cmp): 6개월 이상(그린) 대 신규(회색), 50% = 막대 영역 전체 */
  .gp-legend { margin: 30px 0 0 !important; display: flex; align-items: center; gap: 6px; font-size: 12.5px !important; font-weight: 700 !important; color: #c9cdd1 !important; }
  .gp-legend i { width: 12px; height: 12px; border-radius: 3px; margin-left: 10px; } .gp-legend i:first-child { margin-left: 0; }
  .gp-legend i.h { background: #1f9a14; } .gp-legend i.l { background: #4a4f54; }
  /* 높을수록 좋은 지표만 둔다(방향이 다른 지표를 섞으면 신규 사용자가 이긴 것처럼 읽힌다) */
  .gp-cmp { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 24px; }
  .gp-cmp em { display: block; margin-bottom: 6px; font-style: normal; font-size: 15px; font-weight: 700; color: #f6f6f6; }
  /* 막대는 고정 폭 트랙(.t) 안에서 50% = 트랙 전체로 그린다. 값 글자 폭 때문에 두 막대가 같은 길이로 잘리지 않게 트랙과 값을 분리 */
  .gp-cmp .h, .gp-cmp .l { display: flex; align-items: center; gap: 10px; height: 26px; margin-top: 6px; }

  .gp-cmp i { display: block; height: 20px; border-radius: 0 4px 4px 0; }
  .gp-cmp .h i { background: #1f9a14; } .gp-cmp .l i { background: #4a4f54; }
  .gp-cmp b { font-size: 16px; font-weight: 800; color: #f6f6f6; } .gp-cmp .l b { font-weight: 600; color: #9aa2a9; }
  .gp-delta { margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: #f06464; font-size: 12.5px; font-weight: 800; color: #fff; vertical-align: 1px; }
  .gp-band { left: 76px; top: 512px; width: 1128px; }
  .gp-cap { margin: 0 0 12px; font-size: 17px; font-weight: 800; color: #f6f6f6; letter-spacing: -.01em; }

  .gp-bar .a { background: #1f9a14; } .gp-bar .b { background: #222222; } .gp-bar .c { background: #2a1515; }

  /* ───────── HR 서밋 템플릿 ─────────
     모든 장의 바탕은 흰색(#fff), 글자는 #1a1a1a. 제목 위에는 둥근 그린 막대 한 줄(40×4)만 둔다.
     올리브영판 템플릿처럼 장식을 줄이고, 색 띠 하나로 장마다 브랜드가 보이게 한다. 장이 보일 때마다 왼쪽에서 그어진다 */
  .oy-bar { width: 40px; height: 4px; border-radius: 2px; background: var(--oy-green); transform-origin: left center; animation: oy-in .7s cubic-bezier(.16,1,.3,1) .15s backwards; }
  @keyframes oy-in { from { transform: scaleX(0); } }
  .head-bar { left: 76px; top: 40px; }

  @media print {
    @page { size: 1280px 720px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    .deck { position: static; transform: none !important; width: 1280px; height: auto; }
    .slide { position: relative; display: block !important; visibility: visible !important; width: 1280px; height: 720px; page-break-after: always; break-after: page; }
    .hud, .hm-spark { display: none; }
    .head-mark *, .head-title, .iso *, .desk *, .mig *, .sp-iso * { animation: none !important; }
    .slide.dark [data-step] { opacity: 1 !important; translate: none !important; filter: none !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ───────── IQVIA판 구조를 HR 서밋 포맷으로 옮기며 더한 규칙(2026-10-16) ───────── */
  /* 세 묶음 내비(.rs-nav): 필 셋, 지금 묶음만 그린 */
  .rs-nav { left: 76px; top: 24px; display: flex; gap: 6px; }   /* 왼쪽 위(y 24~48). 내비가 있는 장은 그린 필이 막대를 대신하고, 헤드라인을 24 아래(y 72)로 내린다 */

  .rs-nav span { box-sizing: border-box; width: 152px; height: 24px; padding: 0; border-radius: 999px; border: 1px solid #575757; display: inline-flex; align-items: center; justify-content: center;   /* 세 필 같은 폭 */
    font-size: 12px; font-weight: 700; color: #7f878e; white-space: nowrap; }
  .rs-nav span.on { background: #1f9a14; border-color: #1f9a14; color: #fff; }   /* 그린 필 글자는 흰색(2026-10-26 사용자 지정) */

  .rs-card { top: 220px; width: 352px; height: 430px; box-sizing: border-box; padding: 36px 32px; border-radius: 20px; background: #141414; border: 1px solid #4a4a4a; display: flex; flex-direction: column; justify-content: center; }
  .rs-pill { align-self: flex-start; height: 32px; padding: 0 16px; border-radius: 999px; background: #1f9a14; display: inline-flex; align-items: center; font-size: 15px; font-weight: 800; color: #fff; }
  .rs-card h4 { margin: 24px 0 0; font-size: 34px; font-weight: 800; line-height: 1.32; letter-spacing: -.02em; color: #f6f6f6; word-break: keep-all; }
  /* 묶음 연결 장(.br): 가운데 두 줄. 첫 줄 회색 전제, 둘째 줄 잉크 주장 + 그린 필 강조 */
  .br-text { left: 76px; top: 292px; width: 1128px; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; word-break: keep-all; }
  .br-l1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: #9aa2a9; }

  /* AI 도입 대비 조직 성과(.og): gp 카드 문법 + 1번 카드 가로 막대(100% = 220px) */

  .og .gp-rows { gap: 22px; }

  /* 인력별 AI 역량 구분(.gp-pie): 도넛(지름 168) + 범례. 조각은 pathLength 100 기준, 카드가 뜰 때 그려진다 */

  .gp-card:not(.on) .gp-pie circle { stroke-dasharray: 0 100; }
  .gp-pie .a { stroke: #3add2e; } .gp-pie .a2 { stroke: #a6ef6e; } .gp-pie .b { stroke: #666666; } .gp-pie .c { stroke: #ff7878; }

  .gp-pie .dn p span { margin-top: 4px; font-size: 12.5px; font-weight: 700; color: #9aa2a9; }

<script>
  // 조작: → ↓ Space PageDown 클릭(오른쪽 절반) 다음, ← ↑ PageUp 클릭(왼쪽 절반) 이전, Home/End 처음/끝, F 전체화면
  const deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll('.slide')];
  const counter = document.getElementById('counter');
  const fsBtn = document.getElementById('fs');
  let i = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    deck.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  function go(n) {
    const next = Math.max(0, Math.min(slides.length - 1, n));
    const prevIndex = i;
    // 2장에서 바로 3장으로 넘어갈 때만: 2장 시대 이름의 위치를 장이 바뀌기 전에 재 둔다
    const morphPts = slides[prevIndex] === morphSrcSlide && slides[next] === morphDstSlide && next === prevIndex + 1 ? morphSources() : null;
    stopMorph();
    i = next;
    slides.forEach((el, k) => el.classList.toggle('active', k === i));
    if (i === 0) replayCover();
    stopSeq();
    if (slides[i].querySelector('[data-step]')) playSeq(slides[i], next < prevIndex, morphPts ? MORPH_DUR - 500 : 0);
    if (morphPts) morphEras(morphPts);
    if (slides[i] === hlSlide) {
      setHl(next < prevIndex ? HL_MAX : 0);
      // 앞에서 들어오면 카드 셋이 다 뜬 뒤 클릭 없이 첫 번째 카드를 강조한다
      if (next > prevIndex) seqTimers.push(setTimeout(() => setHl(HL_MAX), SEQ_FIRST + (hlCards.length - 1) * SEQ_GAP + 1600));
    }
    // 시연 영상: 보이는 장의 영상만 처음부터 재생하고 나머지는 멈춘다
    slides.forEach((el, k) => el.querySelectorAll('video').forEach(v => {
      if (k === i) { v.currentTime = 0; v.play().catch(() => {}); } else v.pause();
    }));
    counter.textContent = `${i + 1} / ${slides.length}`;
    history.replaceState(null, '', `#${i + 1}`);
  }
  // 표지 등장 연출을 처음부터 다시 재생한다
  const cover = slides[0];
  function replayCover() {
    cover.classList.remove('play');
    void cover.offsetWidth;
    cover.classList.add('play');
  }
  // 순차 등장(2장·4장): [data-step] 묶음을 클릭 없이 일정 간격으로 하나씩 보여 준다.
  // 뒤에서 돌아오면 다시 재생하지 않고 전부 보여 준다. data-count가 있으면 숫자를 0부터 세어 올린다.
  const SEQ_FIRST = 400, SEQ_GAP = 1200;
  let seqTimers = [];
  function countUp(el) {
    const to = +el.dataset.count, t0 = performance.now(), dur = 1100;
    (function tick(now) {
      const p = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  }
  function setStep(slide, n, instant) {
    slide.classList.toggle('instant', !!instant);
    slide.querySelectorAll('[data-step]').forEach(el => {
      const on = +el.dataset.step <= n, was = el.classList.contains('on');
      el.classList.toggle('on', on);
      el.querySelectorAll('[data-count]').forEach(c => {
        if (!on) c.textContent = '0';
        else if (instant) c.textContent = c.dataset.count;
        else if (!was) countUp(c);
      });
    });
    if (instant) { void slide.offsetWidth; slide.classList.remove('instant'); }
  }
  function stopSeq() { seqTimers.forEach(clearTimeout); seqTimers = []; }
  // data-click 장: 첫 단계만 저절로 뜨고, 다음 단계는 클릭(→)할 때마다 하나씩 올린다
  let clickStep = 0;
  const maxStep = slide => Math.max(...[...slide.querySelectorAll('[data-step]')].map(el => +el.dataset.step));
  function playSeq(slide, showAll, delay = 0) {
    const max = maxStep(slide);
    if (showAll) { setStep(slide, max, true); clickStep = max; return; }
    setStep(slide, 0, true);
    if (slide.dataset.click) {
      const auto = +slide.dataset.auto || 1, g = +slide.dataset.gap || SEQ_GAP;   // data-auto: 앞의 몇 단계는 저절로, 나머지는 클릭
      clickStep = auto;
      for (let k = 1; k <= auto; k++) seqTimers.push(setTimeout(() => setStep(slide, k), SEQ_FIRST + (k - 1) * g));
      return;
    }
    const gap = +slide.dataset.gap || SEQ_GAP;
    for (let k = 1; k <= max; k++) seqTimers.push(setTimeout(() => setStep(slide, k), SEQ_FIRST + delay + (k - 1) * gap));
  }


  // 2장 → 3장: 2장 아래 시대 이름(Internet · Smartphone / Social · Artificial Intelligence)이 3장 시대 띠 이름 자리로 날아가며
  // 글자가 바뀐다(Internet era · Mobile era · AI era). 2장에 아직 뜨지 않은 이름은 날리지 않는다
  const morphSrcSlide = slides.find(sl => sl.querySelector('[data-morph-src]'));
  const morphDstSlide = slides.find(sl => sl.querySelector('[data-morph-dst]'));
  const MORPH_DUR = 1100;
  let morphTimer = 0;
  const morphCenter = el => {
    let x = el.offsetWidth / 2, y = el.offsetHeight / 2;
    for (let e = el; e && !e.classList.contains('slide'); e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; }
    return [x, y];
  };
  function morphSources() {
    const pts = {};
    morphSrcSlide.querySelectorAll('[data-morph-src].on').forEach(el => {
      const [x, y] = morphCenter(el);
      pts[el.dataset.morphSrc] = { x, y, text: el.textContent };
    });
    return pts;
  }
  function stopMorph() {
    clearTimeout(morphTimer);
    if (!morphDstSlide) return;   // 백업 덱에는 커리어 장이 없다
    morphDstSlide.classList.remove('morph');
    morphDstSlide.querySelectorAll('.morph-fly').forEach(f => f.remove());
  }
  function morphEras(pts) {
    const dst = morphDstSlide;
    dst.classList.add('morph');
    const ease = 'cubic-bezier(.65,0,.35,1)';
    dst.querySelectorAll('[data-morph-dst]').forEach(t => {
      const s = pts[t.dataset.morphDst];
      const fly = document.createElement('div');
      fly.className = 'morph-fly';
      const from = document.createElement('span'), to = document.createElement('span');
      from.className = 'from'; to.className = 'to';
      from.textContent = s ? s.text : '';
      to.textContent = t.textContent;
      to.style.color = getComputedStyle(t).color;
      fly.append(from, to);
      const [x1, y1] = morphCenter(t);
      fly.style.left = `${x1}px`; fly.style.top = `${y1}px`;
      dst.appendChild(fly);
      if (s) {
        fly.animate([{ transform: `translate(-50%, -50%) translate(${s.x - x1}px, ${s.y - y1}px)` }, { transform: 'translate(-50%, -50%)' }], { duration: MORPH_DUR, easing: ease, fill: 'both' });
        from.animate([{ opacity: 1 }, { opacity: 1, offset: .35 }, { opacity: 0, offset: .75 }, { opacity: 0 }], { duration: MORPH_DUR, fill: 'both' });
        to.animate([{ opacity: 0 }, { opacity: 0, offset: .35 }, { opacity: 1, offset: .75 }, { opacity: 1 }], { duration: MORPH_DUR, fill: 'both' });
      } else {
        // 2장에서 아직 안 뜬 이름은 제자리에서 나타난다
        fly.style.transform = 'translate(-50%, -50%)';
        to.animate([{ opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'none' }], { duration: 700, delay: MORPH_DUR - 700, fill: 'both' });
      }
    });
    morphTimer = setTimeout(stopMorph, MORPH_DUR);
  }
  // 8장(세 가지 변화): 카드 셋이 뜬 뒤 첫 번째 카드(에이전트)가 저절로 강조된다.
  // 강조 전에 다음을 누르면 바로 강조하고, 강조된 뒤 다음을 누르면 장을 넘긴다. 이전은 바로 앞 장으로 간다
  const hlSlide = slides.find(sl => sl.querySelector('.pillar'));
  const hlCards = hlSlide ? [...hlSlide.querySelectorAll('.pillar')] : [];
  const HL_MAX = 1;
  let hl = 0;
  function setHl(n) {
    hl = n;
    hlSlide.classList.toggle('hl-on', n > 0);
    hlCards.forEach((c, k) => c.classList.toggle('hl', k === n - 1));
  }
  function next() {
    if (slides[i].dataset.click && clickStep < maxStep(slides[i])) { stopSeq(); setStep(slides[i], ++clickStep); return; }
    if (slides[i] === hlSlide && hl < HL_MAX) {
      stopSeq(); setStep(hlSlide, hlCards.length);   // 아직 다 안 나왔으면 카드 셋을 모두 보이게 한 뒤 강조
      setHl(hl + 1); return;
    }
    go(i + 1);
  }
  function prev() {
    go(i - 1);
  }
  function handleKey(key) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(key)) next();
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(key)) prev();
    else if (key === 'Home') go(0);
    else if (key === 'End') go(slides.length - 1);
    else if (key === 'f' || key === 'F') toggleFullscreen();
    else return false;
    return true;
  }
  function toggleFullscreen() {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }

  addEventListener('resize', fit);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (handleKey(e.key)) e.preventDefault();
  });
  document.getElementById('prevBtn').addEventListener('click', e => { e.stopPropagation(); prev(); e.currentTarget.blur(); });
  document.getElementById('nextBtn').addEventListener('click', e => { e.stopPropagation(); next(); e.currentTarget.blur(); });
  fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); fsBtn.blur(); });
  addEventListener('click', e => {
    e.clientX > innerWidth / 2 ? next() : prev();
  });
  fit(); go(i);
  // 주소창에서 # 뒤 번호만 바꿔도(엔터, 새로고침 없이) 그 장으로 바로 이동. 새로고침하면 위의 첫 줄이 같은 번호를 읽는다
  window.addEventListener('hashchange', () => {
    const n = parseInt(location.hash.slice(1), 10);
    if (n && n - 1 !== i) go(n - 1);
  });
  // 뒤로 가기 캐시(bfcache)로 되살아난 경우에도 주소의 번호를 따른다
  window.addEventListener('pageshow', e => {
    if (!e.persisted) return;
    const n = parseInt(location.hash.slice(1), 10);
    if (n && n - 1 !== i) go(n - 1);
  });
  // 책상 장: 플로어 영상 창이 커질 때 영상을 처음부터 재생한다(IQVIA판에서 가져옴).
  // 영상 첫 1초는 캐릭터 등장 동작이라, 모니터 정지 화면(1.2초 프레임)과 같은 지점부터 재생하고 반복도 그 지점으로 돌아간다
  const deskZoom = document.querySelector('.desk-zoom');
  const DESK_T0 = 1.2;
  if (deskZoom) {
    const v = deskZoom.querySelector('video');
    v.addEventListener('ended', () => { v.currentTime = DESK_T0; v.play().catch(() => {}); });
    new MutationObserver(() => { if (deskZoom.classList.contains('on')) { v.currentTime = DESK_T0; v.play().catch(() => {}); } }).observe(deskZoom, { attributes: true, attributeFilter: ['class'] });
  }
</script>
</body>
